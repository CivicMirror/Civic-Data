# DEMO — NOT live civic-data content. This file is not read by
# scripts/validate.py (it lives outside data/, and isn't named
# jurisdictions/officials/elections even if it were inside it).
#
# WHAT THIS SHOWS: the third layout option for CivicPatch/open-data —
# "stick with grouped-by-place" — using the same 9 real MA congressional
# officials from data/us/ma/officials/ in this repo, reformatted into
# CivicPatch's OWN actual current schema (shared.schemas.Official, one
# file per PLACE containing a LIST of officials), not civic-data's
# schema. Compare against:
#   - data/us/ma/officials/*.yaml            (civic-data's current
#     one-file-per-PERSON layout, ID inside the file only)
#   - data/us/ma/officials/Lori-Trahan-<uuid>.yaml
#     (the openstates-style demo: one-file-per-person, ID IN the
#     filename)
# This file is the third point of comparison: same real data, grouped
# by PLACE instead of by person, in her repo's actual current shape.
#
# IN CivicPatch/open-data THIS WOULD LIVE AT (hypothetically — CivicPatch
# has never covered federal/congressional officials before; MA's
# municipalities are the closest real analog):
#   data/ma/local/place_<municipality>.yml   — one file per REAL place
# The grouping below (all 9 into one file) is coarser than that: MA's
# congressional districts are single-member, so a literal per-district
# file would only ever contain ONE official — not a useful demo of
# "grouping." Grouping the whole delegation into one file here is purely
# to make the "many officials, one reviewable file" shape visible, the
# way it would look for e.g. a 13-member city council.
#
# THREE THINGS ARE LOST vs. civic-data's current model, converting to
# this schema — worth knowing before deciding:
#   1. Career history. This schema has no roles[] — one flat
#      office/jurisdiction_ocdid/start_date per person. Richard Neal's
#      civic-data record has TWO roles (old MA-02 1989-2013, then MA-01
#      2013-present); here he can only show his current one. His actual
#      first House win (1989) isn't representable at all in this shape.
#   2. Multiple offices. This schema has no addresses[] — 'phones' is a
#      single flat list, with no way to say which number is the D.C.
#      office vs. which district office, no fax field, and no street
#      addresses at all. Bill Keating's 4 real offices (1 D.C. + 3
#      district, each with its own address/phone/fax) collapse here into
#      one undifferentiated phones: [...] list.
#   3. Multiple emails as a concept still works ('emails' is a list
#      here too, matching civic-data) — just noting where this schema IS
#      already equivalent, not just where it's narrower.
#
# id below is the same UUID used in each person's civic-data
# ocd-person/<uuid> id, just without that prefix — same real people,
# not re-randomized, so cross-referencing between the two demos is easy.

