# OCD jurisdiction classifications from OCDEP 3.
- id: government
  label: Government
  definition: The combined government for a cohesive city, town, county, state, or country.
  source: https://open-civic-data.readthedocs.io/en/latest/proposals/0003.html
- id: legislature
  label: Legislature
  definition: A separate legislative branch governing the division.
  source: https://open-civic-data.readthedocs.io/en/latest/proposals/0003.html
- id: executive
  label: Executive
  definition: A separate executive branch governing the division.
  source: https://open-civic-data.readthedocs.io/en/latest/proposals/0003.html
- id: school
  label: School system
  definition: An independent school system jurisdiction.
  source: https://open-civic-data.readthedocs.io/en/latest/proposals/0003.html
- id: park
  label: Park
  definition: An independent park authority jurisdiction.
  source: https://open-civic-data.readthedocs.io/en/latest/proposals/0003.html
- id: sewer
  label: Sewer
  definition: An independent sewer authority jurisdiction.
  source: https://open-civic-data.readthedocs.io/en/latest/proposals/0003.html
- id: forest
  label: Forest
  definition: An independent forest authority jurisdiction.
  source: https://open-civic-data.readthedocs.io/en/latest/proposals/0003.html
- id: transit_authority
  label: Transit authority
  definition: An independent transit authority jurisdiction.
  source: https://open-civic-data.readthedocs.io/en/latest/proposals/0003.html
