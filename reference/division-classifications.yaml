# Geographic OCD division classifications. These describe place, not the
# governing body operating within the place.
- id: state
  label: State
  definition: A state or equivalent first-order political geography.
  source: https://open-civic-data.readthedocs.io/en/latest/ocdids.html
- id: county
  label: County
  definition: A county or county-equivalent geography.
  source: https://open-civic-data.readthedocs.io/en/latest/ocdids.html
- id: town
  label: Town
  definition: A legally incorporated town geography.
  source: https://open-civic-data.readthedocs.io/en/latest/ocdids.html
- id: city
  label: City
  definition: A legally incorporated city geography.
  source: https://open-civic-data.readthedocs.io/en/latest/ocdids.html
- id: congressional-district
  label: Congressional district
  definition: A U.S. congressional district geography.
  source: https://open-civic-data.readthedocs.io/en/latest/ocdids.html
- id: prosecutorial-district
  label: Prosecutorial district
  definition: A prosecutorial service-area geography.
  source: https://open-civic-data.readthedocs.io/en/latest/ocdids.html
