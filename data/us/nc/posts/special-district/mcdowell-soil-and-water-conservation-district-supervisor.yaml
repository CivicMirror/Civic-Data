  note: 'N.C. General Statutes Chapter 139 (Soil and Water Conservation Districts Law), Sections 139-6 and 139-7: the district board of supervisors has five members -- three elected on a nonpartisan basis at the general election for staggered four-year terms (a class of two and a class of one, taking office the first Monday in December) and two appointed by the NC Soil and Water Conservation Commission. Only the three elected seats are modeled here.'
