- url: https://www.ncsbe.gov/results-data/election-results/historical-election-results-data
  note: 'NCSBE Historical Election Results Data page: the November 8, 2022 general election Results (ZIP) file (results_pct_20221108.txt) is the official precinct-level results file for the election. This record carries the U.S. Senate (Class III) contest (federal pass) and the 2022 county contests (county pass: commissioners, sheriffs, clerks of superior court, registers of deeds, and one coroner), all from the same SBE file; each candidate''s method columns (Election Day + one-stop early + absentee by mail + provisional) sum to the file''s total-votes column on every precinct row. Write-in rows in the file are not ballot candidates and are not recorded as candidates here.'
  retrieved: '2026-10-23'
- url: https://s3.amazonaws.com/dl.ncsbe.gov/ENRS/2022_11_08/results_pct_20221108.zip
  note: Direct download of the November 8, 2022 general election results file used for the contest totals in this record.
  retrieved: '2026-10-23'
- url: https://s3.amazonaws.com/dl.ncsbe.gov/ENRS/2022_11_08/results_pct_20221108.zip
  note: 'County pass (issue #172): the county contests were aggregated from the same SBE file and reconciled against the existing county tier as described in the 2024 record''s county-pass note.'
  retrieved: '2026-10-23'
- url: https://s3.amazonaws.com/dl.ncsbe.gov/ENRS/2022_11_08/results_pct_20221108.zip
  note: 'Municipal pass (issue #172): the municipal contests in this record (mayors and governing-body seats of NC cities, towns and villages) were aggregated from the same SBE file. Municipalities elect on different cycles and methods: most in the November odd-year generals, a set on the even-year general ballot, and a few in October (election-and-runoff method, or an October election date); September and the remaining October contests are primaries and are not recorded. School-board, sanitary-district, hospital and water-district contests and ballot questions in the file are not municipal offices and are not recorded here.'
  retrieved: '2026-10-25'
- url: https://s3.amazonaws.com/dl.ncsbe.gov/ENRS/2022_11_08/results_pct_20221108.zip
  note: 'Judicial pass (issue #172): Supreme Court, Court of Appeals, Superior Court, District Court and District Attorney contests appended from this same NC SBE results file; see the ''kept contests'' in the pass plan (District Court 2020 contests excluded -- 4-year terms, that class was re-elected in 2024).'
  retrieved: '2026-10-26'
