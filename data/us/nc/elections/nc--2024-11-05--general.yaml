sources:
- url: https://www.ncsbe.gov/results-data/election-results/historical-election-results-data
  note: 'NCSBE Historical Election Results Data page: the November 5, 2024 general election Results (ZIP) file (results_pct_20241105.txt) is the official precinct-level results file for the election, certified November 26, 2024. This election record covers the ten Council of State contests all 170 General Assembly contests (50 State Senate + 120 State House districts), the 14 U.S. House contests, and the county contests (commissioners, register of deeds, and two unexpired-term clerks of superior court); vote totals here are aggregated from that file across all 100 counties and cross-checked so each candidate''s method columns (Election Day + early + absentee by mail + provisional) sum to the file''s total-votes column on every precinct row.'
  retrieved: '2026-10-23'
- url: https://s3.amazonaws.com/dl.ncsbe.gov/ENRS/2024_11_05/results_pct_20241105.zip
  note: Direct download of the November 5, 2024 general election results file (results_pct_20241105.txt, tab-delimited per layout_results_pct.txt) used for the contest totals in this record.
  retrieved: '2026-10-23'
- url: https://s3.amazonaws.com/dl.ncsbe.gov/ENRS/2024_11_05/results_pct_20241105.zip
  note: 'General Assembly pass (issue #172): the 170 legislative contests were aggregated from the same SBE file (13,516 precinct rows; method columns sum to total votes on every row). Write-in rows in the file (named write-in candidates and the miscellaneous write-in buckets in Senate District 31 and House Districts 18 and 84) are not ballot candidates and are not recorded as candidates here; no write-in won. Eight districts'' 2024 winners have since departed and been succeeded by appointees (Senate 18, 23, 34; House 40, 47, 60, 90, 119); those successions are modeled on the membership records with their own sources.'
  retrieved: '2026-10-23'
- url: https://s3.amazonaws.com/dl.ncsbe.gov/ENRS/2024_11_05/results_pct_20241105.zip
  note: 'Federal pass (issue #172): the 14 U.S. House contests were aggregated from the same SBE file (7,270 precinct rows; method columns sum to total votes on every row). The two U.S. Senate seats were not on the 2024 ballot; their contests live in the 2020 (Class II) and 2022 (Class III) election records. Presidential contests are not modeled in Civic-Data (no president post exists in the repo) and are not recorded here.'
  retrieved: '2026-10-23'
- url: https://s3.amazonaws.com/dl.ncsbe.gov/ENRS/2024_11_05/results_pct_20241105.zip
  note: 'County pass (issue #172): the county contests were aggregated from the same SBE file, reconciled against the existing county tier (built from these files by the earlier county pipeline): every contest''s winners were checked against the seated memberships, and the divergences found -- dropped unexpired-term winners, two-year-term boards carrying only the latest cycle, and one county''s consent-order appointments -- were corrected in the membership records with the corrections sourced there. Town-board contests that appear in the county files (''TOWN OF ... BOARD OF COMMISSIONERS'') are municipal and are not recorded here.'
  retrieved: '2026-10-23'
- url: https://s3.amazonaws.com/dl.ncsbe.gov/ENRS/2024_11_05/results_pct_20241105.zip
  note: 'Municipal pass (issue #172): the municipal contests in this record (mayors and governing-body seats of NC cities, towns and villages) were aggregated from the same SBE file. Municipalities elect on different cycles and methods: most in the November odd-year generals, a set on the even-year general ballot, and a few in October (election-and-runoff method, or an October election date); September and the remaining October contests are primaries and are not recorded. School-board, sanitary-district, hospital and water-district contests and ballot questions in the file are not municipal offices and are not recorded here.'
  retrieved: '2026-10-25'
- url: https://s3.amazonaws.com/dl.ncsbe.gov/ENRS/2024_11_05/results_pct_20241105.zip
  note: 'Judicial pass (issue #172): Supreme Court, Court of Appeals, Superior Court, District Court and District Attorney contests appended from this same NC SBE results file; see the ''kept contests'' in the pass plan (District Court 2020 contests excluded -- 4-year terms, that class was re-elected in 2024).'
  retrieved: '2026-10-26'
