  note: 'Charleston County School District, built from the SC State Election Commission Election History results for the November 8, 2022 and November 5, 2024 general elections (School Trustee contests) in the ElectionStats school board data. Nine members elected in nonpartisan elections at the general election from nine single-member districts (numbered to correspond to the county council districts) to staggered four-year terms (Act 340 of 1967, as amended by Act 182 of 2020, which established the single-member districts from 2022). The district''s eight constituent school boards were abolished July 1, 2025 by Act 77 of 2025 and are not built.'
