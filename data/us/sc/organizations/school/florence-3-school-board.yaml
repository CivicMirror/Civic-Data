  note: 'Florence County School District Three, built from the SC State Election Commission Election History results for the November 8, 2022 and November 5, 2024 general elections (School Board Member contests) in the ElectionStats school board data. Nine members elected in nonpartisan elections at the general election to staggered four-year terms: five from single-member districts and four from two multimember districts of two seats each (Act 103 of 2017). The multimember districts are Districts 4 and 7; in the ElectionStats data each holds a single-seat contest in every cycle, its two seats staggered across cycles, and the contests are labeled by seat number (Seat 1 through Seat 7).'
