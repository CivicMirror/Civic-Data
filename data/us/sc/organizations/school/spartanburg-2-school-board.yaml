  note: 'Spartanburg School District Two, built from the SC State Election Commission Election History results for the November 2, 2021 and November 7, 2023 general elections (School Trustee contests) in the ElectionStats school board data. Ten members elected in nonpartisan elections to staggered four-year terms at odd-year November elections: nine at large and one from Trustee District 10, the district''s Cherokee County portion (Act 612 of 1984; Act 572 of 1982). The District 10 contest appears in the ElectionStats data at the division ''Cherokee County School District 2''; its 2023 winner, Seth Breitenbach, holds the Cherokee County seat (term December 1, 2023 - November 30, 2027 per the district''s board listing). Spartanburg County school districts elect in odd-year November elections; the two most recent cycles in the ElectionStats system are 2021 and 2023 (the November 2025 election is not yet loaded in the system).'
