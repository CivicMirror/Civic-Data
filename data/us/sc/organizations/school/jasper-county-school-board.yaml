  note: 'Jasper County School District, built from the SC State Election Commission Election History results for the November 8, 2022 and November 5, 2024 general elections (School Board Member contests) in the ElectionStats school board data. The Jasper County Board of Education is, ex officio, the board of trustees of the Jasper County School District (Act 278 of 1985, as amended by Act 476 of 1998): nine members elected in nonpartisan elections at the general election from nine single-member districts to staggered four-year terms (Districts 2, 4, 6, and 8 elected in midterm cycles; Districts 1, 3, 5, 7, and 9 in presidential cycles). The single-member districts were reapportioned by Act 240 of 2024 beginning with the 2024 general election.'
  retrieved: '2026-10-28'
- url: https://ed.sc.gov/newsroom/news-releases/state-board-of-education-approves-state-of-education-emergency-declaration-in-jasper-county-school-district/
  note: 'STATE TAKEOVER DISCLOSURE (added in Phase 1 classification review, 2026-10-28): the elected board built here was dissolved under a state-of-education emergency declared July 28, 2025 (S.C. Code Section 59-18-1640); the State Board of Education approved SCDE assuming full management on August 5, 2025, after SCDE took control of district finances in December 2024. District classified ELECTED (SUSPENDED - state takeover 2025); build treatment pending a scope ruling on issue #177.'
  retrieved: '2026-10-28'
