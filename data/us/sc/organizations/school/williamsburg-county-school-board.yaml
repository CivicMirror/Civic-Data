  note: 'Williamsburg County School District, built from the SC State Election Commission Election History results for the November 8, 2022 and November 5, 2024 general elections (School Board Member contests) in the ElectionStats school board data. Nine members elected in nonpartisan elections at the general election to staggered four-year terms: seven from single-member districts (the county council districts) and two at large (Act 107 of 2017). The district was under SCDE control from 2018, with governance responsibilities returned to the elected board in stages beginning in 2024; the board''s selection has remained elective.'
