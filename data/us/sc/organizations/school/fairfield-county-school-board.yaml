  note: 'Fairfield County School District, built from the SC State Election Commission Election History results for the November 8, 2022 and November 5, 2024 general elections (School Board Member contests) in the ElectionStats school board data. Seven members elected in nonpartisan elections at the general election from seven single-member districts (the county council districts) to staggered four-year terms (Act 191 of 1991, as amended; Act 255 of 2022). A circa-2010 expansion adding delegation-appointed seats was blocked by a federal Voting Rights Act objection and never took effect; the board is seven elected members.'
