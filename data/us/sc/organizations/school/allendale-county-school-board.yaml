  note: 'Allendale County Schools, built from the SC State Election Commission Election History results for the November 8, 2022 and November 5, 2024 general elections (School Board Member contests) in the ElectionStats school board data. Five members elected in nonpartisan elections at the general election from five single-member districts (the county council districts) to staggered four-year terms (Act 174 of 1999). The board''s selection has remained elective throughout; state takeovers in 1999-2007 and 2017 suspended its management authority, which the State Board of Education recorded as restored in December 2022.'
