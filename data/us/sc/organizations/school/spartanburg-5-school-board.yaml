  note: 'Spartanburg School District Five, built from the SC State Election Commission Election History results for the November 2, 2021 and November 7, 2023 general elections (School Trustee contests) in the ElectionStats school board data. Nine members elected in nonpartisan elections to staggered four-year terms at odd-year November elections from three multimember residency districts — District 51 (one seat), District 52 (two seats), and District 53 (six seats) — whose members are elected by the voters of the whole district (Act 106 of 2015, as amended). No contest for District 52 appears in the ElectionStats data in any cycle; that post is built without memberships. Spartanburg County school districts elect in odd-year November elections; the two most recent cycles in the ElectionStats system are 2021 and 2023 (the November 2025 election is not yet loaded in the system).'
