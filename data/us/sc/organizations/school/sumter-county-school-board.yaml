  note: 'Sumter School District, built from the SC State Election Commission Election History results for the November 8, 2022 and November 5, 2024 general elections (School Board Member contests) in the ElectionStats school board data. Nine members elected in nonpartisan elections at the general election from nine single-member districts to staggered four-year terms (Act 387 of 2008, as amended). The district''s own board materials and the SC Inspector General describe a nine-member elected board, and the ElectionStats contests run in nine districts; Districts 8 and 9 began as at-large seats under Act 321 of 2010 and are now elected from districts. Four 2022 contests (Districts 1, 2, 4, and 8) were decided in majority runoffs on November 22, 2022; the initial November 8 contests are recorded with no winner and the runoffs carry the certified winners. A fiscal emergency declared in 2019 did not dissolve the board.'
