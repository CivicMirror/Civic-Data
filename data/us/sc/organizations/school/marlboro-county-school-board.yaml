- url: https://electionhistory.scvotes.gov/contest/2902
  note: 'Marlboro County School District, built from the SC State Election Commission Election History results for the November 8, 2022 and November 5, 2024 general elections (School Board Chairman and School Board Member contests) in the ElectionStats school board data. Nine members elected in nonpartisan elections at the general election to staggered four-year terms: eight from single-member districts (the county council districts) and a chairman elected countywide as a separate office (Act 256 of 1981, as amended by Act 611 of 1992). Two 2022 district contests (Districts 3 and 8) were decided in majority runoffs on November 22, 2022; the initial November 8 contests are recorded with no winner and the runoff contests carry the certified winners.'
  retrieved: '2026-10-30'
- url: https://ed.sc.gov/newsroom/news-releases/state-board-of-education-approves-state-of-education-emergency-declaration-in-marlboro-county-school-district/
  note: 'STATE TAKEOVER DISCLOSURE: SCDE placed the district on Fiscal Watch in 2022 and declared a Fiscal Emergency on February 18, 2025, assuming control of district finances on July 18, 2025; following an Inspector General report dated June 1, 2026, the State Board of Education declared a state-of-education emergency on June 2, 2026 and SCDE assumed full management of the district, with the elected board dissolved. The memberships built in this pass are the board as elected in 2022 and 2024; the district is currently governed by SCDE, not by the elected board. The district is classified ELECTED (SUSPENDED - state takeover 2026), parallel to Jasper County.'
  retrieved: '2026-10-30'
