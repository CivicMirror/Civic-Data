  note: 'Berkeley County School District, built from the SC State Election Commission Election History results for the November 8, 2022 and November 5, 2024 general elections (School Board Member contests) in the ElectionStats school board data. Nine members elected in nonpartisan elections at the general election to staggered four-year terms: eight from single-member districts (the county council districts) and one at large (Act 518 of 1982, as amended by Act 251 of 2022). Before 2022 the board had nine single-member districts; the former District 9 was eliminated in the 2022 restructuring, and only contests of the current structure are built.'
