  note: 'Nine members elected in nonpartisan elections from nine single-member districts to staggered four-year terms (Act 587 of 1992, as reapportioned by Act 252 of 2022); Cherokee County school elections are held on the second Tuesday in August of even years (Act 132 of 2007). Cherokee County school elections are not published in the SEC Election History (ElectionStats) system, so no contests or memberships are built in this pass; certified results for the district''s two most recent elections have been requested from the Cherokee County elections office.'
