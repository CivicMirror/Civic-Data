  note: 'Anderson School District Three, built from the SC State Election Commission Election History results for the November 8, 2022 and November 5, 2024 general elections (School Trustee contests) in the ElectionStats school board data. Five members elected in nonpartisan elections at the general election to staggered four-year terms: four from single-member districts and one at large (Act 509 of 1982, Section 13A(C), as amended by Act 96 of 2015). The single-member districts are labeled Areas in the ElectionStats data and are modeled as district posts.'
