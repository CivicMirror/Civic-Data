  note: 'Anderson School District Five, built from the SC State Election Commission Election History results for the November 8, 2022 and November 5, 2024 general elections (School Trustee contests) in the ElectionStats school board data. Nine members elected in nonpartisan elections at the general election to staggered four-year terms: seven from single-member districts and two at large (Act 509 of 1982, Section 13A(E), added by Act 300 of 2014). The single-member districts are labeled Areas in the ElectionStats data and are modeled as district posts; the two at-large seats are contested one per cycle.'
