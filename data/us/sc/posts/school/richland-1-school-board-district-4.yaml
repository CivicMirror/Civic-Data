  note: 'Richland County School District One, built from the SC State Election Commission Election History results for the November 8, 2022 and November 5, 2024 general elections (School Board Member contests) in the ElectionStats school board data. Seven members elected in nonpartisan elections at the general election to staggered four-year terms: four from single-member districts and three at large (Act 613 of 1986, as amended by Act 300 of 2016). The governing body is styled the Board of School Commissioners. On the ballot the single-member districts are labeled Seat 1 through Seat 4; in the 2022 ElectionStats data the District 1 and District 3 contests appear at the divisions ''Richland County School District 11'' and ''Richland County School District 13'' (won by Aaron Bishop and Robert Lominack, the Seat 1 and Seat 3 incumbents) and are built as Districts 1 and 3.'
  retrieved: '2026-10-30'
