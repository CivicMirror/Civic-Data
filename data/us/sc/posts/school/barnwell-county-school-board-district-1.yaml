  note: 'Barnwell County School District, built from the SC State Election Commission Election History results for the November 5, 2024 general elections (School Trustee contests) in the ElectionStats school board data. Five members elected in nonpartisan elections at the general election from five single-member districts (Act 92 of 2023). The consolidated Barnwell County School District opened July 1, 2024, succeeding Barnwell County Districts 45, 19, and 29; only the consolidated district''s 2024 contests are built in this pass — the 2022 contests in the ElectionStats data at like-named divisions belong to the predecessor Barnwell County Consolidated School District and are not built.'
