  note: 'Horry County Schools, built from the SC State Election Commission Election History results for the November 8, 2022 and November 5, 2024 general elections (Board of Education Chair and Member of the Board of Education contests) in the ElectionStats school board data. Twelve members elected in PARTISAN elections (with June primaries) at the general election to staggered four-year terms: eleven from single-member districts and a chairman elected countywide as a separate office (Act 287 of 1989, as amended by Act 178 of 1997). Horry is South Carolina''s partisan school-board exception; party labels are carried from the certified results.'
