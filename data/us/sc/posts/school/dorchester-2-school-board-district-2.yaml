  note: 'Dorchester School District Two, built from the SC State Election Commission Election History results for the November 5, 2024 general elections (School Board Member contests) in the ElectionStats school board data. Seven members elected in nonpartisan elections at the general election from seven single-member districts to staggered four-year terms (Act 535 of 1982, as amended by Act 96 of 2023). Before 2024 the board was elected at large; only the 2024 contests, the first under the single-member-district structure, are built in this pass — the at-large contests of 2020 and 2022 belong to the prior structure and do not map to the current seats.'
