  note: 'Hampton County School District, built from the SC State Election Commission Election History results for the November 8, 2022 and November 5, 2024 general elections (School Board Member contests) in the ElectionStats school board data. Seven members elected in nonpartisan elections at the general election from seven single-member districts to staggered four-year terms (Act 184 of 2020, as amended by Act 259 of 2022). The consolidated Hampton County School District''s first elected board was chosen in 2022. Act 184 of 2020 originally described the members as elected at large; Act 259 of 2022 delineated the seven single-member districts, and the county''s ballots run separate district contests, as built here.'
