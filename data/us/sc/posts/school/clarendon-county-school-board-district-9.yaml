  note: 'Clarendon County School District, built from the SC State Election Commission Election History results for the November 5, 2024 general elections (School Board Member contests) in the ElectionStats school board data. Nine members elected in nonpartisan elections at the general election from nine single-member districts to staggered four-year terms (Act 106 of 2021; districts as delineated by Act 234 of 2024). The consolidated Clarendon County School District''s board became fully elected beginning with the 2024 general election; only the 2024 contests are built in this pass.'
