  note: 'Florence District Five, built from the SC State Election Commission Election History results for the November 8, 2022, November 7, 2023, and November 5, 2024 general elections (School Board Member contests) in the ElectionStats school board data. Seven members elected in nonpartisan elections to staggered three-year terms at annual November elections: four from single-member districts (Seats 1-4) and three at large (Act 250 of 1991, as amended). Three cycles (2022, 2023, and 2024) are built because the district elects annually. One 2022 at-large contest appears in the ElectionStats data at the division ''Florence School District'' (contest 2693); it is assigned to this district — the only Florence district with at-large seats — and its vote totals are on this district''s scale.'
