  note: 'Anderson School District One, built from the SC State Election Commission Election History results for the November 8, 2022 and November 5, 2024 general elections (School Trustee contests) in the ElectionStats school board data. Seven members elected in nonpartisan elections at the general election to staggered four-year terms (Act 509 of 1982, Section 13A(A), as amended by Act 231 of 2024). Members must reside in one of seven residency areas but are elected by the voters of the whole district; the posts are the residency areas.'
