  note: 'Pickens County School District, built from the SC State Election Commission Election History results for the November 8, 2022 and November 5, 2024 general elections (School Trustee contests) in the ElectionStats school board data. Seven members elected in nonpartisan elections at the general election from seven single-member districts to staggered four-year terms (Act 260 of 1981, as amended). The Phase 1 classification described six districts; the district''s own board page (a seven-member board, one member from each of seven districts) and the ElectionStats contests both show seven — District 7 (the Dacusville/Pickens area) was contested in 2018, in a 2021 unexpired-term special election, and in 2022 — and the build follows the contests and the district''s published structure.'
  retrieved: '2026-10-30'
