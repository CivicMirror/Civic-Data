  note: 'Lee County School District, built from the SC State Election Commission Election History results for the November 8, 2022 and November 5, 2024 general elections (School Board Member contests) in the ElectionStats school board data. Seven members elected at the general election from seven single-member districts (the county council districts) to staggered four-year terms (Act 843 of 1952, as amended; restated by Act 272 of 2026). In the ElectionStats data the district''s general-election candidates carry party labels and the district holds June primaries, unlike most South Carolina school boards; party labels are carried from the certified results. Act 272 of 2026 restates the cycle: there is no Lee County school election in 2026; Districts 1, 2, 3, and 7 next elect in 2028 and Districts 4, 5, and 6 in 2030.'
