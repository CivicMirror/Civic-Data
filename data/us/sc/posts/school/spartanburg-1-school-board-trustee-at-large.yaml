  note: 'Spartanburg School District One, built from the SC State Election Commission Election History results for the November 2, 2021 general elections (School Trustee contests) in the ElectionStats school board data. Nine members elected in nonpartisan elections at large to staggered four-year terms at odd-year November elections (Act 612 of 1984). No 2023 contest for this district appears in the ElectionStats system; only the 2021 contests are built. Spartanburg County school districts elect in odd-year November elections; the two most recent cycles in the ElectionStats system are 2021 and 2023 (the November 2025 election is not yet loaded in the system).'
