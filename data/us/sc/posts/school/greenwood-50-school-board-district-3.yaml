  note: 'Greenwood School District 50, built from the SC State Election Commission Election History results for the November 8, 2022 and November 5, 2024 general elections (School Trustee contests) in the ElectionStats school board data. Nine members elected in nonpartisan elections at the general election from nine single-member districts to staggered four-year terms (Act 595 of 1994, as amended; districts reapportioned by Act 239 of 2024). No ElectionStats contest appears for Seat 5 in any cycle in the system, and Seats 4 and 9 have no contest in the two most recent cycles; those posts are built without memberships.'
