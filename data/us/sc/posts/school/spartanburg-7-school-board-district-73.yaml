  note: 'Spartanburg School District Seven, built from the SC State Election Commission Election History results for the November 2, 2021 and November 7, 2023 general elections (School Trustee contests) in the ElectionStats school board data. Nine members elected in nonpartisan elections to staggered four-year terms at odd-year November elections from five election districts (Act 98 of 2023): Districts 71-74 hold one seat each and District 75 holds five, the allocation consistent with the act''s district populations and with the ElectionStats contest sizes (District 75 elects three members in one odd-year cycle and two in the next). Spartanburg County school districts elect in odd-year November elections; the two most recent cycles in the ElectionStats system are 2021 and 2023 (the November 2025 election is not yet loaded in the system).'
