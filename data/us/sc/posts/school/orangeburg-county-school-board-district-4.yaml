  note: 'Orangeburg County School District, built from the SC State Election Commission Election History results for the November 8, 2022 and November 5, 2024 general elections (School Board Member contests) in the ElectionStats school board data. Nine members elected in nonpartisan elections at the general election to staggered four-year terms: seven from single-member districts (the county council districts) and two at-large seats with residency restrictions — Seat 8 for residents of council Districts 1-4 and Seat 9 for residents of council Districts 5-7 (Act 280 of 2017). In the ElectionStats data the two at-large seats appear as bare-division ''At Large'' contests; the district''s first contests (2018) tie the Seat 8 race to the division labeled District 8 and the Seat 9 race to District 9, and the at-large contests alternate cycles — the 2022 at-large contest is assigned to Seat 9 and the 2024 contest to Seat 8 on that cycle evidence.'
