- url: https://ed.sc.gov/newsroom/news-releases/state-board-of-education-approves-state-of-education-emergency-declaration-in-jasper-county-school-district/
  note: 'STATE TAKEOVER DISCLOSURE (added in Phase 1 classification review, 2026-10-28): SCDE assumed control of the district''s finances in December 2024; on July 28, 2025 the State Superintendent declared a state-of-education emergency under S.C. Code Section 59-18-1640, and on August 5, 2025 the State Board of Education approved SCDE assuming full management of the district, with the elected board dissolved. The memberships built in this pass are the board as elected in 2022 and 2024; the district is currently governed by SCDE, not by the elected board. Jasper is classified ELECTED (SUSPENDED - state takeover 2025), parallel to Marlboro County; whether to hold this district or end the memberships at the dissolution is a scope ruling pending on issue #177.'
  retrieved: '2026-10-28'
