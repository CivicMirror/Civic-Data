  note: 'Seven members elected in nonpartisan elections at the general election to staggered four-year terms from residency areas, elected by the voters of the whole district. Act 268 of 2026 converts the district to six single-member districts plus one at-large seat beginning with the 2026 and 2028 elections; the contests built in this pass predate that transition. In the ElectionStats data the in-scope contests are organized as Area 1 (two seats), Area 2 (two seats), Areas 4, 5, and 6 (one seat each), and one at-large contest; no Area 3 contest appears in the two most recent cycles, and no Area 3 post is built.'
