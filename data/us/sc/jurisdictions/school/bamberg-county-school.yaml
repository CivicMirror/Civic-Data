- url: https://www.scstatehouse.gov/sess125_2023-2024/bills/5231.htm
  note: 'TRANSITION DISCLOSURE: Act 104 of 2021 consolidated Bamberg-Ehrhardt District 1 and Denmark-Olar District 2 under an initially delegation-appointed nine-member board (seven single-member districts and two at-large seats, designated Districts 8 and 9). Under Act 233 of 2024, five seats were elected in November 2024 (Districts 1, 4, 5, 7, and at-large District 8) and are seated in this pass; the remaining four seats (Districts 2, 3, 6, and 9) are held by Bamberg County Legislative Delegation appointees who serve until successors are elected November 3, 2026 — those posts are built without memberships.'
  retrieved: '2026-10-30'
