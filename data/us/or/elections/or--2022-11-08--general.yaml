  note: 'Oregon Secretary of State, Elections Division, November 8, 2022 General Election
    Abstract of Votes (certified county-by-county abstract). For Governor: Tina Kotek
    (D) 917,074 votes, marked ** as elected; Christine Drazan (R) 850,347; Betsy Johnson
    (NAV) 168,431; Donice Noelle Smith (C) 8,051; R Leon Noble (L) 6,867; miscellaneous
    write-ins 2,113. Kotek won by a plurality of 66,727 votes. Party labels are as
    printed in the abstract: (D) Democratic, (R) Republican, (NAV) Nonaffiliated,
    (C) Constitution, (L) Libertarian. Kotek was sworn in on January 9, 2023; the
    November 3, 2026 general election decides the next term.'
  retrieved: '2026-10-23'
- url: https://records.sos.state.or.us/ORSOSCMSearch/Search/DocumentStream.ashx?uri=13735454
  note: 'Oregon Secretary of State, Elections Division, November 8, 2022 General Election Abstract of Votes (certified county-by-county abstract), published through the Oregon State Archives records system and linked from the Secretary of State''s Election Results & History page. For Commissioner of the Bureau of Labor and Industries (a nonpartisan office; the abstract prints no party labels for this contest): Christina E Stephenson 916,455 votes, marked ** as elected; Cheri Helt 582,609; miscellaneous write-ins 9,826. Stephenson won by a plurality of 333,846 votes. She assumed office on January 2, 2023.'
