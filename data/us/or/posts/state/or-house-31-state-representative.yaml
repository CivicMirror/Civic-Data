  note: 'Oregon Secretary of State, Elections Division, November 5, 2024 General Election Abstract of Votes (certified county-by-county abstract), published through the Oregon State Archives records system and linked from the Secretary of State''s Election Results & History page. For State Representative, District 31: Jordan Gutierrez (D) 15,145; Darcey Edwards (R) 23,972 votes, marked ** as elected; Robert Miller (L) 1,389; miscellaneous write-ins 93. Darcey Edwards won by a plurality of 8,827 votes. Party labels are as printed in the abstract: (D) Democratic, (R) Republican, (L) Libertarian. Members of the 83rd Legislative Assembly were sworn in on January 13, 2025.'
