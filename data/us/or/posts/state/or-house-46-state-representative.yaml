  note: 'Oregon Secretary of State, Elections Division, November 5, 2024 General Election Abstract of Votes (certified county-by-county abstract), published through the Oregon State Archives records system and linked from the Secretary of State''s Election Results & History page. For State Representative, District 46: John Mark Alexander (R) 4,414; Kevin Levy (I) 1,252; Willy Chotzen (D) 25,542 votes, marked ** as elected; Austin Daniel (L) 1,040; miscellaneous write-ins 58. Willy Chotzen won by a plurality of 21,128 votes. Party labels are as printed in the abstract: (R) Republican, (I) Independent, (D) Democratic, (L) Libertarian. Members of the 83rd Legislative Assembly were sworn in on January 13, 2025.'
