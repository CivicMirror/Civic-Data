  note: 'Oregon Secretary of State, Elections Division, November 5, 2024 General Election Abstract of Votes (certified county-by-county abstract), published through the Oregon State Archives records system and linked from the Secretary of State''s Election Results & History page. For Secretary of State: Tobias Read (D) 1,166,447 votes, marked ** as elected; Dennis Linthicum (R) 897,704; Nathalie Paravicini (PG) 76,170; miscellaneous write-ins 2,011. Read won by a plurality of 268,743 votes. Party labels are as printed in the abstract: (D) Democratic, (R) Republican, (PG) Pacific Green. Read was sworn in on January 6, 2025; the next election for the office is November 7, 2028.'
