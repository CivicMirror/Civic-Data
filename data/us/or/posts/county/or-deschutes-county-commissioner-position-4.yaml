  note: 'Deschutes County Clerk, 2026-05-19 Canvass Report (Official Final Results / Statement of Ballots Cast, dated 06/12/2026; Laserfiche public portal document 98257, county Election Archives): County Commissioner, Position 4: Rick Russell 38,446 (56.80%), Chet Wamboldt 29,105 (43.00%), write-ins 132; total 67,683. Russell''s majority elected him outright at the primary under Oregon''s nonpartisan rules, so the seat did not appear on the November 3, 2026 ballot.'
  retrieved: '2026-11-05'
- url: https://webapps.deschutes.org/Elections/Home/Results/102
  note: 'Deschutes County Elections Central, May 19, 2026 primary results page (county clerk): Position 4 totals identical to the canvass report (Russell 38,446; Wamboldt 29,105); 50 of 50 precincts reporting, page last updated June 12, 2026. Position 4 is a new seat: Measure 9-173 (approved November 2024) expands the Board of Commissioners from three to five members; the new positions carry initial two-year terms beginning January 2027. The membership start, January 4, 2027, is the first Monday in January 2027, following this Board''s existing pattern (January 2, 2023 and January 6, 2025 starts in its existing memberships).'
  retrieved: '2026-11-05'
