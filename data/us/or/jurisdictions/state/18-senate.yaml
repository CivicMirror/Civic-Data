  note: 'Oregon Secretary of State, Elections Division, November 5, 2024 General Election Abstract of Votes (certified county-by-county abstract), published through the Oregon State Archives records system and linked from the Secretary of State''s Election Results & History page. For State Senator, District 18: Brian Pierson (R) 23,114; Wlnsvey E Campos (D) 38,956 votes, marked ** as elected; miscellaneous write-ins 65. Wlnsvey E Campos won by a plurality of 15,842 votes. Party labels are as printed in the abstract: (R) Republican, (D) Democratic. Members of the 83rd Legislative Assembly were sworn in on January 13, 2025. In 2022 the District 18 seat was on the ballot for a two-year term (redistricting): Wlnsvey E Campos (D) 30,534 votes, marked ** as elected; Kimberly Rice (R) 17,848; Rich Vial (NAV) 5,599; miscellaneous write-ins 59; Campos was re-elected to the full term in 2024.'
