  note: 'Oregon Secretary of State, Elections Division, November 5, 2024 General Election Abstract of Votes (certified county-by-county abstract), published through the Oregon State Archives records system and linked from the Secretary of State''s Election Results & History page. For State Representative, District 34: John Verbeek (R) 8,973; Lisa Reynolds (D) 22,572 votes, marked ** as elected; miscellaneous write-ins 44. Lisa Reynolds won by a plurality of 13,599 votes. Party labels are as printed in the abstract: (R) Republican, (D) Democratic. Members of the 83rd Legislative Assembly were sworn in on January 13, 2025. Lisa Reynolds, re-elected in 2024, resigned the seat on November 15, 2024, before the new term began, after her appointment to the State Senate; she never served in the 2025 term, so no membership is recorded for her in this seat (candidacy recorded; compare the California AD32 precedent). Mari Watanabe was appointed by the Multnomah and Washington county commissions on January 15, 2025, and sworn in on January 19, 2025.'
  retrieved: '2026-10-23'
