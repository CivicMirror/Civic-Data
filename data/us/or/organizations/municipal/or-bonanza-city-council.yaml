  note: 'Town of Bonanza, contact page roster (city site): The town''s contact page names the mayor and four councilors with no position labels or term dates. Klamath County''s November 2026 sample ballot shows five numbered council positions (Positions 2-5 are on that ballot), so the council has five seats; the fifth seat''s current holder is not named on any official source (the factory''s Nancy Ibarra appears on no official source and is not minted) and no position mapping for the four named councilors is recorded, so they sit on one five-seat post. The 2026 ballot also lists the mayoralty as a two-year unexpired term with no candidate filed and Ashlie Pence (Petersen) as a declared write-in, suggesting the seat came open mid-term; the town site still lists her as Mayor.'
  retrieved: '2026-10-25'
