  note: 'City of Dufur, council minutes, April 21, 2026 (Reed resignation, in the June 9, 2026 agenda packet): A mayor and six councilors. City documents never print seat numbers, so the councilors sit on one six-seat post (the factory''s Seat 1-6 labels are its own). Mayor Reed resigned effective April 30, 2026 (he was moving out of town); the council declared the mayoralty vacant and Councilor Podvent was appointed to it in May 2026, leaving one councilor seat vacant as of the June 9, 2026 agenda''s ''City Council Vacancy'' item -- five councilor memberships are open on the six-seat post. City minutes print ''Lou Svoboda'' (the factory''s ''Jr.'' is not used). Coleman''s latest appearance in the city documents read is the September 9, 2025 minutes.'
