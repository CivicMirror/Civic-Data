  note: 'City of Brookings, council minutes in the June 22, 2026 and July 27, 2026 agenda packets (AgendaCenter, city site): 2026 turnover, from the city''s own minutes: Mayor Isaac Hodges resigned at the January 12, 2026 meeting; the council appointed Councilor Phoebe Pereda as Mayor and appointed Jim Jollota to her vacated Position #2 at the same meeting. On June 22, 2026 the council accepted Kristi Fulton''s resignation and appointed Anthony Bond to Position #4 (sworn the same meeting). Pereda has said she will complete the term but not seek election. The Position 1 (Malmberg) and Position 3 (Martin) assignments rest on the factory lead -- the minutes confirm both men''s incumbency in roll calls but never print their position numbers.'
