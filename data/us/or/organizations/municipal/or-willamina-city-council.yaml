  note: 'City of Willamina, council minutes, February 10, 2026 (in the official March 10, 2026 packet -- the full council as seated) and 1993 Charter Sec. 18 (Council President as a council-filled role): A mayor and SIX councilors. Baller serves as Council President as a council role under Sec. 18 of the 1993 Charter -- not a separate seat, despite the factory listing it as one. The factory''s ''Jennifer Eckels'' is an error: she appears nowhere in the city''s 2026 minutes, and Michael Alger holds the sixth seat. Hernandez still signs as Mayor in June 2026. No term dates are printed in the city documents read, so no starts are modeled and the factory''s classes rest on the factory lead alone.'
