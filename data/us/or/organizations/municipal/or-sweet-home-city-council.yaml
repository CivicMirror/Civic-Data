  note: 'City of Sweet Home, mayoral proclamation of the November 5, 2024 results in a city meeting packet (charter recital and certified totals), and January 27, 2026 Municode agenda (sitting councilors): Sweet Home elects SEVEN councilors at large and the COUNCIL SELECTS the mayor from its members. The charter mechanism is recited in an official mayoral proclamation: each biennial election elects four councilors, the top three vote-getters to four-year terms and the fourth to a two-year term. Coleman signed that proclamation as Mayor in November 2024, so her mayoral service predates the January 2025 re-selection reported in an AI-derived summary of the January 14, 2025 meeting (flagged, not official) -- no mayoral start is modeled, and her membership sits on the Mayor post only. The November 5, 2024 totals are in the winners'' notes; the multi-seat contest itself is not filed as an election record because the builder''s contest shape is single-seat.'
