  note: 'City of Warrenton Official Statement (EMMA/MSRB; table sourced to the City of Warrenton under the heading ''City Commission'' -- roster, service-begin dates, term expirations) and the city elections page (commission form; November 2026 open seats): Commission-form city: a mayor and four commissioners in numbered Positions 1-4, all nominated and elected from the city at large to four-year terms (city elections page); city meetings are styled ''Warrenton City Commission''. Service-begin dates and expirations are as printed in the city''s Official Statement. Moha''s Position 3 service began November 25, 2025, mid-term; the Official Statement does not say why, and no seating method is asserted. The mayor and Position 4 are on the November 3, 2026 ballot (the elections page prints the mayoral incumbent as ''Henery Balensifer'' [sic]; the filings table spells Henry Balensifer III).'
