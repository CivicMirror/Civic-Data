  note: 'City of Sodaville, council minutes, November 16, 2023 (in the December 21, 2023 council packet) and April 2022 minutes (Perry as Mayor, Lewis as councilor): A mayor and four councilors. The city''s published documents run 2021-2023 and the site is stale, so the roster is the November 16, 2023 minutes roll: Mayor Brian Lewis, Council President Roger Perry, Councilors Adina Olivares and Joseph Parsons, and a FIFTH seat whose current holder cannot be settled -- Jeff Hensley is the last city-confirmed holder (November 2023), while the factory''s Caleb Gay appears in no city document located; neither is minted for that seat and the seat is carried with three of four councilors seated. April 2022 minutes show Perry as Mayor with Lewis a councilor, so Lewis took the mayor''s office at the November 2022 cycle. Whether the current roster still matches the 2023 roll is a research item.'
