  note: 'City of Winston, official 2026 Election Packet (the positions expiring December 31, 2026 and their incumbents), council minutes, June 1, 2026, and Douglas County''s certified November 5, 2024 results (the Ward/Position 1 pairings): A mayor elected at large to a two-year term, plus TWO councilors in each of Ward 1 (Precinct 23) and Ward 2 (Precinct 24) in numbered Positions 1-2, elected by ward to four-year terms -- the factory''s garbled ward labels resolve into this two-seats-per-ward structure. The Position 1 pairings are confirmed by Douglas County''s certified 2024 results; White and Wiggins hold Position 2 in their wards by elimination and by the city''s 2026 Election Packet, which prints their seats among the positions expiring December 31, 2026. The city prints ''Dorie White'' (the packet''s text layer misprints her as ''Doie''); the mayor''s ballot form is ''Christie Glen-Knutson''. Cunningham''s factory styling as ''Council President'' is confirmed by no city document and is not carried.'
