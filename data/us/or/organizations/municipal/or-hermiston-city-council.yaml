  note: 'City of Hermiston, ''New City Council, Mayor Swear in for 2025'' (structure and 2025 class) and December 2022 swearing-in article (ward class): A mayor elected separately (four-year term; votes only on ties) and eight councilors, all elected citywide to four-year terms: four by ward (the city prints Roman numerals, Ward I-IV) and four at large (the city prints NO slot numbers -- the factory''s ''At-Large Slot 1-4'' is its own construction). FORWARD CHANGE, not yet modeled: at the May 19, 2026 primary, Krista Van Veen (Ward I) and Barbara J. Martin (Ward III) won their wards and Barron and McCarthy were re-elected; those terms begin January 1, 2027, and the current ward holders serve through December 31, 2026. Charter amendments on ward-only voting and ward boundaries are on the November 2026 ballot.'
