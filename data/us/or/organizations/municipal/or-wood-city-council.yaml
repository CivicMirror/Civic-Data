  note: 'City of Wood Village, council minutes, January 14, 2025 (the council''s 5-0 votes approving Rios-Campos as Mayor and Tan as Council President, after the newly elected councilors were sworn in) and July 14, 2026 (the body as styled), and the city''s 2022 filing page (Miner in Position 4): NO separately elected mayor: the five-member council, elected to staggered four-year terms in numbered Positions 1-5, selects one of its own members as Mayor for a two-year term -- which is why the factory lists no mayor. On January 14, 2025 the council voted 5-0 to approve Rios-Campos as Mayor (he simultaneously holds Position 2; per this pass''s convention his single membership sits on the Mayor post, and Position 2 is built with no membership) and Tan as Council President, likewise a role rather than a seat (Miner had been mayor before that vote; his earlier service is not modeled). Position 1 is Gothard''s by elimination: the factory''s Mark Clark has departed at an undocumented point and is not modeled, and Gothard''s own seating instrument was not read. The 2028 classes for Positions 2, 3 and 5 rest on the factory lead corroborated by GoodParty; Positions 1 and 4 are on the November 3, 2026 ballot.'
