  note: 'City of Oregon City, Mayor & City Commission page (commission form and structure) and 2025-2027 Biennial Budget book (roster as printed): Commission form of government: ''The City Commission is composed of five unpaid, volunteer members: the mayor and four Commissioners,'' each serving a four-year at-large term (maximum two terms in any ten years), with a Commission President elected by the Commission each year (city commission page). The roster is taken from the city''s official 2025-2027 Biennial Budget book, which prints ''Rocky Smith, Jr.'' with the comma (third-party transcripts'' ''Adam Morrow'' and ''Denise McGriff'' are garbles). No term dates are printed on the city sources read, so no starts are modeled and the factory''s class years are not used.'
