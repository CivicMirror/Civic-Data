  note: 'City of Baker City, City Council page and 2022 charter (city site): Seven councilors are elected at large; there is no separately elected mayor -- at the first regular January meeting after each biennial election the council chooses one of its members as mayor for a two-year term, and all seven vote equally (charter). The mayor is therefore modeled as a post held by one of the seven councilors. Individual term-end years are not printed on any city document read and none are modeled. The seventh councilor is Daugherty himself, whose membership is recorded on the Mayor post. Randy Schiewe was appointed in early 2026 to fill the seat Stephen Carr vacated by resigning October 7, 2025 (the exact appointment date rests on the factory lead; the seat''s term runs through the end of 2026).'
