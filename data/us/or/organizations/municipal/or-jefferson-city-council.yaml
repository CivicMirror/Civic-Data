  note: 'City of Jefferson, FY2024-25 audit, officials page (roster; Cruikshank and Vickery annotated ''resigned July 2025''): The factory''s ''Jefferson'' entry is the Jefferson COUNTY roster, misfiled under the city; it was ignored entirely. The city''s FY2024-25 audit lists a mayor and six councilors with unlabeled seats and prints no term dates, so no starts are modeled. Chandra Cruikshank and Charles Vickery are annotated ''resigned July 2025'' in the audit and are NOT modeled; no successors appear in any city source read, so two of the six councilor seats are carried unfilled. The city homepage confirms the mayoralty and three council seats are filled by election on November 3, 2026. Name variants: the audit prints ''Kellogg'' and ''Kate Steele''; a county certification prints ''Kellog'' and ''Kate Gurley-Steele'' -- the city audit forms are used.'
