  note: 'City of Cottage Grove, council minutes, January 26, 2026, and Elections page (structure): A mayor (two-year term) and six councilors (four-year terms): four ward councilors and two at-large, all elected by all city voters. The Ward 1 (Hyink), Ward 2 (Lammerman) and second at-large (Settelmeyer) assignments rest on the factory lead, corroborated by Lane County election coverage (Hyink won the vacant Ward 1 seat in 2024; Settelmeyer won an at-large vacancy in 2024); the Ward 3, Ward 4 and Wilson at-large assignments are city-printed. All seven holders are confirmed in the city''s January 26, 2026 minutes.'
