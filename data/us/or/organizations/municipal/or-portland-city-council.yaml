  note: 'City of Portland, City Council page and leadership listing (roster by district; Dunphy President, Clark Vice President), and charter Section 3-101 (initial term classes): The post-2025 form of government: a separately elected mayor and twelve councilors, three elected from each of Districts 1-4. Under charter Section 3-101 the mayor and Districts 1-2 councilors elected in November 2024 serve four years (through December 31, 2028) and Districts 3-4 an initial two years (through December 31, 2026). The City Administrator is appointed, not elected, and is not modeled; the separately elected City Auditor is outside the council and likewise not modeled here. Jamie Dunphy is Council President (voted in January 2026) and Olivia Clark is Vice President; Elana Pirtle-Guiney was the first President (elected January 2, 2025).'
