  note: 'City of Stayton, council minutes, September 21, 2026 and joint work session minutes, March 2, 2026 (rosters as printed); Resolution 25-008: A mayor and five councilors, confirmed in official city documents (the September 21, 2026 minutes and March 2, 2026 joint work session minutes). The minutes print ''Leonard Hays'' (not ''Hayes''); Resolution 25-008 prints ''Stephen Sims'' where the minutes print ''Steve Sims''. Luke Bauer, who appears in the Resolution 25-008 roster, is gone from the 2026 minutes: non-city coverage reports Bauer was appointed January 6, 2025 to David Giulio''s vacated seat and Hays was appointed in November 2025 to replace him -- reported, not city-confirmed, and flagged in Hays''s note; Bauer is not modeled. No term expiries are printed in the city documents read, so starts are modeled only for the mayor (elected at the November 2022 general election per the city''s reporting).'
