  note: 'Union County Clerk, 2022 local candidate information and sample ballot (Positions 1 and 3) and certified final results, November 5, 2024 (Positions 2, 4, 5): Summerville has NO separately elected mayor: the Union County Clerk''s official 2022 candidate information gives every other Union County city a MAYOR section but Summerville only a COUNCIL section, and neither the 2022 nor the 2024 ballot carries a mayor contest; the Blue Book lists the Position 1 holder, Sheri Rogers, as mayor -- consistent with a mayor chosen by the council from its members. That inference is flagged here. Her membership therefore sits on the Mayor post only, and Position 1 is built with no membership. Certified 2022 totals were not separately read; Positions 1 and 3 rest on the clerk''s candidate list and sample ballot, where Rogers and Smith were the sole filed candidates for four-year terms.'
