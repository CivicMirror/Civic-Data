  note: 'City of Pendleton, council page (structure) and council minutes, February 4, 2025, July 21, 2026 and September 1, 2026 (appointments and roster): ''The Council is composed of eight members who are elected to four-year terms. The Mayor is also elected to a four-year term'' (city council page) -- two seats in each of Wards 1-3 plus two at large. The ward/slot mapping and term classes rest on the factory lead and are flagged as such; the membership itself is confirmed in the September 1, 2026 minutes. The Ward 2 Slot 1 seat has turned over twice since the factory snapshot (Brandsen stepped down mid-2025; Butler held it by October 2025; Hull was appointed July 21, 2026) and only the current holder is modeled. The ''Mayor Turner'' lines in some 2025 minutes are a stale template header; those minutes'' bodies and the ordinance signature blocks style McDonald as Mayor throughout.'
