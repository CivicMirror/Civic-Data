  note: 'City of Shady Cove, council minutes, September 29, 2026 (roster as styled) and city elections documents (recall, ballot, term endings): Mayor Lena Richardson was REMOVED at the July 7, 2026 recall election (Jackson County, Measure 15-242R). The city took mayoral applications (deadline August 19, 2026) and the council appointed Councilor Cheryl Singleton as Mayor in August 2026 for the remainder of 2026; the office is elective and stands on the November 3, 2026 ballot for a two-year term beginning January 1, 2027. Singleton''s council seat was filled the same meeting she was confirmed in the minutes (September 29, 2026) by Art Stirling''s appointment. Richardson is not modeled. The factory''s snapshot is outdated in every particular: it showed the mayoralty vacant, missed Stirling, carried invented ''At-Large Slot'' labels, and its June/August 2026 start dates for the councilors are contradicted by the minutes (Mitchell, Nuckles, Winfrey and Singleton-as-councilor all appear by July 2, 2026) -- no councilor starts are modeled.'
