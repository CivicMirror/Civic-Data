  note: 'City of Myrtle Point, codified charter, Chapter III (structure), council agenda, April 1, 2025 (mayor) and agenda header, c. June 2024 (councilor roster): Charter structure: a mayor elected each biennial election for two years and six councilors elected at large for four-year terms, three per biennial election (charter Chapter III); seats are unlabeled. Three councilor seats are carried unfilled: the newest roster-bearing city document read (an agenda header, c. June 2024) names Michael Hogan (Council President), Berea Gibbons and Gary Sullivan in them, but their class expired in December 2024 and no city document read names the current holders; the factory''s Ryland Parker, Matt Wells and Howard Wilson for those seats rest only on the factory lead and are not minted.'
