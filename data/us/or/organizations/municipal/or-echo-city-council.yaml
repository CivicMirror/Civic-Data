  note: 'City of Echo, ''Echo voters approve recall of Mayor Chad Ray'' (city post, June 2026): A mayor (two-year term) and six councilors elected at large to four-year terms; the charter prints no seat numbers (the factory''s ''At-Large Slot'' labels are invented). Mayor Ray was recalled on June 9, 2026; Council President Anderson stepped up as acting mayor and her council seat was filled by Hampton''s appointment, so Anderson''s membership is modeled on the Mayor post only (the Baker City pattern). The factory stamped Hampton''s July 14, 2026 appointment date onto Sonnenburg, Enright and Rollins as well; the city''s post shows all three already seated and voting that day, and no starts are modeled for them.'
