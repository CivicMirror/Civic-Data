  note: 'City of Central Point, Mayor & Council page (structure: four wards + two at-large members): The council is a mayor, four ward representatives (Wards I-IV) and two at-large members, all on four-year terms; the city does not number the at-large seats (the factory''s ''At Large 2'' is a factory construction). There has been mid-biennium turnover: the 2025-27 budget roster printed Grey Zimmerman (Ward III) and Mike Parsons (At-Large), but the June 11, 2026 minutes show Sarah Roberts and Michael Quilty sitting instead; Quilty appears in May 2025 only as a citizen budget-committee member. Roberts''s incumbency is official but her Ward III assignment rests on the factory lead. No individual term dates are printed on the city sources read and no starts are modeled. City minutes print ''Kelley Johnson''; the budget cover''s ''Kelly Johnson'' is not used.'
  retrieved: '2026-10-25'
