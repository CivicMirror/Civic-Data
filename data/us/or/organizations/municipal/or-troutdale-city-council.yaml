  note: 'City of Troutdale, elections page (confirmed incumbents) and Multnomah County page (Ripma elected November 2024): A mayor and six councilors elected at large in one pooled contest (no numbered positions). THREE councilor seats are carried unfilled: the factory''s Carol Allen, Glenn White and John Leamy are corroborated only by non-official meeting transcripts (White as council president for 2025 and 2026; one transcript garbles Leamy as ''John Langdon''), and the city''s live council pages carry stale rosters that were not used -- none of the three is minted. Ripma resigned his council seat on taking the mayoral oath, and the council set an appointment timeline for that vacancy; which of the unfilled seats it is cannot be told from the sources read.'
