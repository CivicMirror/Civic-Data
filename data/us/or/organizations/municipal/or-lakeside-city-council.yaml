  note: 'Coos County Clerk, Certified - Final Official Totals Report, November 5, 2024 General Election (certified November 27, 2024; City of Lakeside contests, p. 4 -- read firsthand from the rendered report): Council-Manager form: a mayor elected to a two-year term and six councilors in two staggered four-year classes of three; seats are unnumbered and candidates declare which term-expiration class they file for (city Candidate Manual). The city publishes NO current roster (its council page names nobody and its only roster page is the stale 2021-2022 one), so this council is seated from the Coos County Clerk''s certified November 5, 2024 results, read firsthand. RECALL HISTORY: Mayor Kinsey and Councilors Hurn, Ritter and Smith were recalled on November 28, 2023 (news reports of the county tally); the appointments that followed are not traced in any city document read, and ONE seat of the January-2027 class is carried unfilled for that reason -- Pointer (elected 2022) and Armstrong (who won the class''s two-year remainder seat in November 2024) are its confirmable holders. Wood was appointed to a vacant council seat on May 18, 2023 (city minutes) before her election as mayor. The factory''s roster for this city was an unverified seed and is not used; its ''Nichole (Nikki) Harden'' is a real and distinct person -- Nicole Raylee Harden, ballot name Nikki Harden -- not a duplication of Mayor Nikki Wood (registered name Nikki Taylor Wood).'
  retrieved: '2026-10-25'
