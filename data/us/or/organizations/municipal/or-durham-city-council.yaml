  note: 'City of Durham, City Council page (charter structure and roster as printed): Five councilors elected at large to four-year terms; there is NO separately elected mayor. The charter (as the city prints it): ''At the first meeting of each year, the Council chooses from its membership a chairperson, who shall hold the office of Mayor for one year.'' Drake''s mayoral membership is that chair role on the same five-member body (the Baker City pattern); the factory''s ''At-Large Seat 1-5'' labels are invented and are not used.'
