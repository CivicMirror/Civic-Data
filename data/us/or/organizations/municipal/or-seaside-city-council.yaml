  note: 'City of Seaside, 2026 Municipal Elections page (structure, ballot table, vacancy notice and filed candidates): A seven-member council including the mayor: a mayor elected citywide (four-year term) and six council positions -- one for each of Wards 1-4 and one at-large position for each ward pair (city elections page). THE WARD 3 SEAT IS VACANT: its holder, Seamus McVey, was recalled on April 8, 2026; the city is accepting applications for appointment and the seat ''will not appear on the 2026 General Election ballot'' (city elections page). McVey is not modeled. The factory''s uniform January 1, 2027 end dates are an artifact; the real classes are the city''s printed mix of four-year terms and unexpired two-year terms. The city prints no individual term dates, so starts are modeled only where a seating is documented.'
