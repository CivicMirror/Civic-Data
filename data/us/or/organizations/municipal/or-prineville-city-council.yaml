  note: 'City of Prineville, City Council page and council member bio pages (Uffelman styled Mayor): The mayoralty changed mid-term in 2026: Mayor Jason Beebe resigned effective June 15, 2026 (the city''s announcement, for personal reasons), and Council President Steve Uffelman assumed the mayor''s duties under the city charter -- one report styles it an appointment to complete the term, which runs through December 31, 2026; the office is on the November 3, 2026 ballot and Uffelman has not filed for it. Beebe is not modeled. Uffelman''s assumption vacated his council seat: meeting-coverage summaries report the council appointed Ashley Thrasher to it on September 16, 2026 by a 4-2 vote, but no city document read in this pass records the appointment, so she is NOT minted and the seat is carried unfilled.'
