  note: 'City of Rivergrove, charter Sections 7 and 9 and council agendas/minutes through August 2026; city SEL 805 filing (''Chris Barhyte, Mayor''): Rivergrove''s mayor is SELECTED BY THE COUNCIL: the body is five elected members, and under Charter Section 9 the council chooses a chairman from its membership at its first meeting of each odd-numbered year to serve a two-year term as mayor. Barhyte''s membership therefore sits on the Mayor post only. City documents print surnames only for the four councilors -- their first names (Bill, Doug, Leah, Curt) rest on the factory lead alone and are flagged in each note, following the pattern used where a roster is surname-grade.'
