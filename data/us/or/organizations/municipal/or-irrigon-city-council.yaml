  note: 'City of Irrigon, Audit Report 2024-25, ''Mayor and City Council -- June 30, 2025'' (roster with term expirations): A mayor and SIX councilors (city audit, June 30, 2025). ''Mayor Pro Tem'' is not a separate office: the audit styles Councilor Cano as Mayor Pro Tem, a role that rotates among councilors (Calvert held it in the June 30, 2024 audit). The factory seed is corrected here: its ''Martin Brown Jr.'' appears on no city source and is not minted, it omitted Serratos and Bishop, and its ''Benji Calvert''/''Tom Roberts'' are nickname forms against the audit''s Benjamin Calvert/Thomas Roberts. Councilor starts are the January of the class implied by the audit''s printed expirations (four-year terms); the audit does not print the mayor''s term length, so no mayoral start is modeled.'
