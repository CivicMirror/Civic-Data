  note: 'City of Rainier, City Council page (roster with printed term expiries) and City Charter Section 7: An unusually large small-city council: a mayor (two-year term, Charter Section 9) and SEVEN councilors in numbered Positions #1-#7 (Charter Section 7), confirmed on the city''s council page with printed expiries for all eight members. Starts are the January of the class implied by each printed expiry. Two currency flags from local reporting, neither changing the roster the city itself prints: Ratkie was reportedly appointed October 6, 2025 to a Position 4 vacancy (no start is modeled for her), and Kreger reportedly resigned in October 2026 while the city page still lists him. Position #7''s assignment to Langner follows the roster order and the charter''s stagger classes.'
