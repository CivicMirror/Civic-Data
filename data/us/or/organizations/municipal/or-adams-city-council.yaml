  note: 'City of Adams, The Adams American newsletter, September 2026 (city site): The council is a mayor (two-year term) and five numbered council positions (four-year terms). The city''s newsletter does not print position numbers for most sitting councilors, so the five positions are modeled as one five-seat Councilor post: four seats are held (Stewart, Rost, Thompson, Chase) and one -- Position #5, vacated when Colvard became Mayor -- stands open (letters of interest were taken to October 16, 2026). Charles Vickery was Mayor into 2026 and is not modeled: his departure is undocumented.'
