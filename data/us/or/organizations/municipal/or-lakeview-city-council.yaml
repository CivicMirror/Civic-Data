  note: 'Town of Lakeview, official statement (March 2026 resignations), FY2026-27 budget resolution 1181 (O''Brien as Mayor) and vacancy notice, October 6, 2026: A mayor and four councilors (the body is styled the Town Council; no seat labels are printed). The council was rebuilt by appointment in spring 2026 after a mass resignation: Councilors Collins and Tracy vacated March 24, 2026, Mayor Kevin Sims resigned March 31, 2026, and the remaining council appointed replacements, the last positions filled April 14, 2026. Only two holders are verified from town sources -- Mayor O''Brien (budget Resolution 1181; the October 6, 2026 vacancy notice is addressed to him) and Councilor Calvin (a continuing member) -- so they alone are minted. The factory''s other three names (Gina Sticklen, Junior Gabriel, Greg McCully) rest ONLY on the factory lead and are NOT minted; a town vacancy notice of October 6, 2026 announces one councilor vacancy without naming the departed member, so one of the four councilor seats stood vacant then and the record cannot show which. Pre-resignation members Wishart, Tracy and Collins are not modeled.'
