  note: 'City of McMinnville, City Council page (roster, expirations, Benner appointment and Payne resignation as printed): A directly elected mayor (four-year term) and six councilors, two from each of Wards 1-3 (the city prints no ''Slot'' numbers -- the factory''s are its own). Starts are the January of the class implied by the printed December 31 expirations. The Ward 2 seat in the 2028 class is VACANT: Dan Tucholsky sat as recently as the December 17, 2025 minutes and no longer appears on the council page; the vacancy instrument was not read, so the seat is carried unfilled with no ended membership.'
