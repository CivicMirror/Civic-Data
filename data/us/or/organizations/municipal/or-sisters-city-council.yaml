  note: 'City of Sisters, The Sisters Roundup city newsletter (January 8, 2025 selections of Mayor and President): Sisters has FIVE council seats in total -- not a mayor plus five. All five members are elected as councilors at large (three seats up every two years; the top two vote-getters receive four-year terms and the third a two-year term), and every two years the council SELECTS a Mayor and a Council President from among its own members. The city''s newsletter records the January 8, 2025 selections: Jennifer Letz as Mayor and Sarah McDougall as President. Letz''s membership therefore sits on the Mayor post only. Term classes are from coverage of the certified results (Nugget News), consistent with the factory endpoints, and are flagged as such in the notes.'
