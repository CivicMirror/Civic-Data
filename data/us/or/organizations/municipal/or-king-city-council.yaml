  note: 'City of King City, 2006 Charter Sections 4.03, 4.08 and 4.09, and council minutes, May 20, 2026 (roster): King City has NO separately elected mayor: under the 2006 Charter (Section 4.03) the council is seven councilors elected at large to four-year terms, and at the first meeting of each odd-numbered year the council elects a mayor (Section 4.08, two-year term, serving at the council''s pleasure) and a council president (Section 4.09) from its own membership. Kazmierski''s single membership therefore sits on the Mayor post (the Baker City pattern); her councilor seat is carried in the org structure only. No term dates are printed for any member on the city sources read, so no starts are modeled.'
