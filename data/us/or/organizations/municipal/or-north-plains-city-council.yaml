  note: 'City of North Plains, City Council page (''Vacant - Mayor''; roster with printed term endings): The Mayor and six City Councilors ''are elected by registered voters'' (city council page), seats unlabeled. THE MAYORALTY IS VACANT: the page prints ''Vacant - Mayor'' with the term ending December 31, 2028, and the post is built with no membership. City documents establish that Aaron Dumbrow was mayor by January 20, 2026 (he signed Resolution 2330) and that the city solicited mayoral applications in November 2025 after a mayoral resignation; the fuller chronology (Goodwin resigned July 2025; Dumbrow resigned July 2026; acting mayor Hagedorn resigned August 20, 2026) comes from a local advocacy blog, is NOT official, and no departed holder is modeled. The factory''s Mandy Hagedorn no longer holds a council seat; the sixth councilor is Micheal Shurts (city spelling). Starts are the January of the class implied by the printed endings.'
