  note: 'City of Detroit, Staff Directory (City Council roster as printed): Seven-member council: a mayor and six councilors, with no seat labels and no term dates printed on the city''s directory. The mayor is chosen by the council from among its members (charter method, corroborated by the Canyon Weekly''s 2022 charter-revision and November 2024 election coverage; the city publishes no readable charter text online). Page was re-elected as a councilor in November 2024 and now serves as Mayor; his mayoral membership is modeled on the Mayor post only (the Baker City pattern), so the Councilor post carries the other six members.'
