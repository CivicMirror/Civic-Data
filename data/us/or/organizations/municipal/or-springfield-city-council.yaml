  note: 'City of Springfield, council agenda packet, October 5, 2026 (current roster as printed), FY26 Proposed Budget (the earlier Blackwell/Doyle roster) and the city''s 2018 election packet (four-year terms; nominated by ward, elected at large): A mayor and six ward councilors; councilors serve four-year terms, are nominated by ward and elected at large citywide. TWO seats turned over mid-term: Victoria Doyle (Ward 5) resigned in August 2025 and Buck was appointed interim that October; Beth Blackwell (Ward 4) resigned at the end of December 2025 and Cuadros was appointed interim in April 2026 to serve through the end of 2026, the November 3, 2026 election filling the remainder of that term (ending December 31, 2028). Neither departed holder is modeled. Forward information, NOT modeled: news coverage reports Webber, Moe and Buck won the May 19, 2026 primary for new four-year terms beginning January 2027, and reports the mayoral term as running through December 31, 2028.'
