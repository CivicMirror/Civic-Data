  note: 'City of Tangent, government page, fall 2025 Seat 1 vacancy notice, and February 2026 council packet roll call: A mayor elected to a two-year term and four councilors in numbered Seats 1-4 on four-year terms. Seat 1 turned over: the city''s earlier listing had Carol Korn there; a city vacancy notice in fall 2025 advertised Seat 1 with the remaining term ending December 31, 2028, and the February 2026 council packet roll call records Garry Pullen at Seat 1 as the vacancy appointee (Korn is not modeled). A non-official listing (GoodParty) shows a ''Leslie Harrison'' at Position 1 -- no city document confirms her and the city''s own roll call shows Pullen, so she is not minted. No term dates are printed for Seats 2-4, so no starts are modeled for them.'
