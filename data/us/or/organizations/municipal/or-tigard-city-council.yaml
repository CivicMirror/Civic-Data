  note: 'City of Tigard, Meet the Council page (charter expansion, 2024 classes, Hu''s appointment) and council vacancy page (Anderson): The May 2024 charter added two council positions, for six councilors plus the mayor (and a non-voting youth councilor, not an elected office and not modeled). The city prints NO seat numbers -- the factory''s ''At-Large Seat 1-6'' labels are its own and are dropped. The mayoralty is an elected office currently held by appointment: ''Former Councilor Yi-Kang Hu was appointed as Tigard Mayor on October 7, 2025'' (Meet the Council page, read firsthand) after the elected mayor''s departure, which the pages read do not name; the departed mayor is not modeled. The office is on the November 3, 2026 ballot with Hu running as incumbent. Hu''s vacated council seat was filled by the council''s appointment of Tom Anderson for the partial term January 1, 2026 through December 31, 2026.'
