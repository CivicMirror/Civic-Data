  note: 'City of Maywood Park, Elections page (''City Council as of March 3, 2026''; appointment history; mayor-selection mechanics): A five-member council elected at large; there is NO separately elected mayor -- at its first meeting each odd-numbered year ''the Council will select a Chairman who will serve as Mayor for a 2-year term'' and elect a Council President (city Elections page). Akers''s single membership therefore sits on the Mayor post; his councilor seat is the fifth seat of the Councilor post. At the November 2026 election the two highest vote-getters take four-year terms and the third a two-year term.'
