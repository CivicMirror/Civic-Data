  note: 'City of West Linn, press release, January 3, 2023 (Bialostosky appointed interim mayor; Baumgardner voted Council President), Charter Ch. IV Sec. 18 (the council elects its President from its membership), elections page (the two seats on the November 3, 2026 ballot; Bonnington a filed incumbent): A mayor and FOUR councilors, at large and unlabeled, four-year staggered terms (two elected per cycle). ''Council President'' is NOT a separate office -- Charter Ch. IV Sec. 18 has the council elect a President from its membership each year, and the factory''s separate President seat was its own error; Baumgardner is a councilor serving as president. The two seats on the November 3, 2026 ballot are Groner''s and Bonnington''s; the Baumgardner and Bryck classes (to December 31, 2028) follow by elimination and are flagged in their notes. Councilor Scott Erwin (in the March 2024 roll call) departed at an undocumented point in 2024-2025 and was replaced by Bonnington; Erwin is not modeled.'
