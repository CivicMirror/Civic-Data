  note: 'City of Wilsonville, City Council page and the official explanatory statement for Resolution No. 3125 (''The City Council consists of the Mayor and four City Councilors''); Charter ch. 4 Sec. 18 (Council President filled from the membership; Berry elected January 6, 2025): FIVE members in total: a mayor and FOUR councilors, all elected at large to staggered four-year terms -- the factory''s count was right, but its ''Council President'' row is not a separate seat: Berry is a councilor serving as president, a role the council fills from its membership under Charter ch. 4 Sec. 18. O''Neil, Shevlin and Cunningham were sworn in January 6, 2025 for terms expiring December 31, 2028; Berry and Scull sit in the class expiring December 31, 2026.'
