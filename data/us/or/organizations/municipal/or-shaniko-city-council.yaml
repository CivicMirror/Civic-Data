  note: 'City of Shaniko, ''Information and Procedures Regarding City Elective Offices'' document for the November 2026 election (roster, terms, vacancy) and March 7, 2026 city announcement: A mayor and four councilmembers, all on printed terms in the city''s elective-offices document for the November 2026 election; ONE councilmember seat is printed ''Vacant'' (a two-year term expiring December 31, 2026) and the city homepage likewise posts a council-vacancy application. The factory missed the vacant seat, misspells Kegel as ''Kegal'', and expands Marquart to ''Zachary Forrest Marquart'' where the city prints ''Zachary Marquart''. The document also lists an ELECTED City Recorder (Krista Miller) -- a non-council elected office noted here as a research item, not built in this council pass. The March 7, 2026 city announcement speaks of ''appointing Mayor Haskett''; his four-year term expiring December 31, 2026 is modeled from January 2023 with the announcement''s wording disclosed.'
