  note: 'City of Monroe, City Council page (roster with printed expirations; Sheets listed first as mayor): A directly elected mayor (two-year term) and six councilors elected citywide to four-year terms. The city prints no seat numbers -- the factory''s ''At-Large Slot 1-6'' labels are its own and are dropped. The page prints no inline role labels; Sheets''s identification as mayor rests on list order plus the factory lead. Felty''s expiry is anomalous -- the city prints April 27, 2030, against the factory''s 2029 endpoint and a factory start suggesting a vacancy appointment the city page does not state -- so no start is modeled for him and the conflict is recorded in his note.'
