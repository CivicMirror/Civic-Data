  note: 'Grant County Clerk, certified abstract of the November 5, 2024 general election (Dayville contests): Built from the Grant County Clerk''s certified abstract of the November 5, 2024 general election -- the town publishes no readable roster. The abstract decides the mayoralty and Positions 1 and 5: Hettinga was elected mayor and Inscore was elected to Position 5, while Position 1 drew no filed candidate and 22 write-in votes whose winner the abstract nowhere names, so Position 1 is built with no membership. Positions 2, 3 and 4 (attested by the November 2026 OregonVotes contest list) likewise have no confirmable holders and are built as unfilled posts. The League of Oregon Cities directory lists the mayor with four councilors against this five-position set, suggesting one position is vacant or unlisted.'
