  note: 'City of Millersburg, council minutes, January-April 2026 (identical roll calls), Council Rules of Procedure CP-1002 and charter Section 10 (mayor selection): A five-member council that appoints the mayor from among their number: the Council Rules of Procedure (CP-1002) state the council appoints the mayor, and charter Section 10 has the council elect the mayor every two years. Cowan''s single membership therefore sits on the Mayor post (the Baker City pattern); his councilor seat is the fifth seat of the Councilor post. Term expirations exist only in the factory lead, so no starts are modeled. City minutes print ''Dick Perdue''; the factory''s fuller ''Richard Perdue'' is flagged in his note.'
