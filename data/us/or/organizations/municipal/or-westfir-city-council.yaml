  note: 'City of Westfir, April 2026 newsletter directory and minutes through 2026 (roster); special-meeting minutes, December 30, 2024 (Watson appointed to Seat 1; the Seat 3 vacancy declared); January 2025 newsletter, ''Westfir Without a Mayor'' (Mayor-elect Anderson''s resignation): A mayor and four councilors in numbered Seats 1-4. THE MAYOR HOLDS BY APPOINTMENT: Shawn Anderson was elected mayor in November 2024 and resigned for personal reasons before taking office (city newsletter, January 2025); Watson -- whom the council had appointed to Council Seat 1 on December 30, 2024 for the two years remaining in that term -- is signing minutes as Mayor by February 5, 2025, but the appointment instrument and date were not read, so no start is modeled; Anderson is not modeled, and Watson carries no council membership (Seat 1 passed to Mouracade by an instrument likewise not read). SEAT PAIRING IS FLAGGED: no single official document pairs each councilor''s name to a seat number; the pairing follows the seat-ordered January 2025 and April 2026 newsletter directories and class consistency (Seat 1 expires January 2027 per the December 30, 2024 minutes; Seat 3 was the November 2024 councilor-elect seat, declared vacant December 30, 2024 after Councilor-elect Jon O''Neill resigned, and runs to January 2029; O''Neill is not modeled). Huey was elected Council President on January 6, 2025 -- a councilor role, not a separate seat.'
