  note: 'City of Salem, ''Contact a City Councilor'' page and council pages (roster by ward with printed term expiries): A separately elected mayor (two-year term) and one councilor from each of eight wards (four-year staggered terms). Starts are the January of the class implied by each printed expiry. The council page styles the Ward 5 holder ''Dr. Irvin M. Brown''; the honorific is not part of his name. Forward information only: the May 2026 primary chose successors for the seats expiring December 31, 2026, who take office in January 2027 -- they are not modeled.'
