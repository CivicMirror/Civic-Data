  note: 'City of Stanfield, budget narrative (seven-member council, staggered four-year terms) and council minutes, August 19 and September 16, 2025 (membership as seated); FY2023-24 budget (printed class expirations): A seven-member council (mayor plus six councilors), council-manager form, staggered four-year terms -- the factory''s January 2030 end dates, which imply five-year terms, are wrong and were not used. Classes follow the FY2023-24 budget''s printed expirations: the December 2028 class (Challis, Tyrrell, Parrish) and the December 2026 class (Benage, Sperr). WHICH of Haigh and Zielke sits in which class is unresolved in the sources read, so neither carries a start; city minutes print surnames only, so their first names (Crystal Zielke, Angi Haigh) rest on the factory lead alone and are flagged in their notes, and the factory''s ''Butch Parrish'' is an apparent nickname -- city budgets print Ralph Parrish.'
