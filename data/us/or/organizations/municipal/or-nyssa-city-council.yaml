  note: 'City of Nyssa, Directory page (updated September 29, 2026: Esplin as Mayor, DeLeon as Council President): Nyssa''s mayor is chosen by the council, not separately elected: the county clerk''s November 2026 candidate page lists no Nyssa mayor race (while listing one for Ontario), and the mechanism tracks ORS 221.120/221.130 (the council appoints one of its members as mayor for a two-year term). Nyssa''s charter text itself could not be read online, so the finding rests on the ballot evidence plus the statutory scheme, disclosed here. The chair rotates: Resolution 1452-22 (December 2022) is signed ''Betty A. Holcomb, Mayor'', and Holcomb now sits as a councilor. MAJOR factory correction: the factory seated Esplin as a mere ''Slot 1'' councilor and omitted Juan Ramos entirely. The city prints no term dates, so no starts are modeled (the factory''s ''Edmondson from 2026-08-08'' is a scrape artifact).'
