  note: 'City of Coquille, council minutes (October 7, 2024; February 24, 2025) and resolution adopted May 19, 2025 (city document portal): The factory''s legacy seed (a mayor plus only four councilors) is materially incomplete: the city''s own minutes show a mayor and SIX councilors. The minutes print surnames only. Three councilors are minted below with first names resting on the factory lead (Cooper, Corbus, Westrum). Two more councilors are confirmed by surname in the October 7, 2024 minutes -- Chappelle and Waddington -- but their first names rest only on non-official listings, so they are NOT minted and three of the six seats stand unfilled on the record. The factory''s Patrick Flynn appears in no official city document read and is not minted. Mayor Flaherty is confirmed in full name in the signature block of a city resolution adopted May 19, 2025.'
