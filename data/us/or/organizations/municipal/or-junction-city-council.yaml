  note: 'City of Junction City, council minutes, July 14, 2026, and 2026 General Election Packet (structure): A mayor (two-year term) and six councilors (four-year terms), all elected at large and UNNUMBERED (city charter as carried in the city''s 2026 election packet). The packet puts the mayoralty, three four-year councilor terms and one two-year UNEXPIRED councilor term on the November 3, 2026 ballot. The sixth councilor seat is carried unfilled: Ken Jamieson sat through the December 16, 2025 minutes but appears in no 2026 minutes read. No individual councilor term classes are published, so councilor starts are not modeled. Minutes print the mayor''s full name, Kenneth Wells (the factory''s ''Ken Wells'' is the short form).'
