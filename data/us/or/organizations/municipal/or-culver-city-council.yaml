  note: 'City of Culver, special council meeting agenda and minutes, January 15, 2025 (swearing-in, verbatim): The factory seed (a mayor plus only three councilors, no positions) is wrong: Culver has a mayor and SIX councilors in numbered positions. Positions 3, 4 and 5 were sworn in on January 15, 2025 (Mock new; Ough and Thody re-elected). The remaining three councilors -- Dave Beck, Luke Middleton and Tim Woods -- hold Positions 1, 2 and 6 in some order; no city document read prints the mapping, so those three posts are built without memberships. Charles Rushing (appointed January 2023) appears in the January 15, 2025 minutes'' roll call but not in that meeting''s agenda or swearing-in; he is treated as departed and not modeled.'
  retrieved: '2026-10-25'
