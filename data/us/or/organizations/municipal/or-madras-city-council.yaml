  note: 'City of Madras, Mayor & City Council page and election information (mayor''s printed term), council minutes, December 10, 2025 (six councilors): A directly elected mayor (two-year term) and six councilors with unlabeled seats; no councilor term dates are printed in the city sources read, so councilor starts are not modeled. TWO seats are vacant: Lamar Yoder (omitted from the factory entirely) resigned April 28, 2026 and Mike Seibold resigned August 3, 2026, both with terms ending December 31, 2026; the council authorized temporary appointments in August 2026 and interviewed applicants September 1, 2026, but no city document read confirms appointees were seated, so both seats are carried unfilled. Gabriel Soliz IS a Madras councilor (December 3, 2025 Redevelopment Commission joint minutes, which he chairs) -- the resemblance to the Jefferson County treasurer of the same name is a coincidence of names, verified against the city''s own minutes.'
