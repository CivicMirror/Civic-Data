  note: 'City of Woodburn, charter Secs. 7-9 (six ward councilors, three elected per biennial election to four-year terms; a mayor elected at large to a two-year term) and the city''s current council page (the Ward 1 vacancy notice): WARD 1 IS VACANT: the city''s current council page carries a ''Vacancy-Ward 1'' notice seeking applications, the appointee to serve the remainder of the term expiring December 2028. The city''s GIS ward map (updated August 11, 2026) still names Orlando Bravo, and August 2025 minutes show him voting, so Bravo held the seat through at least August 2025; his departure is documented nowhere read, he is not modeled, and the vacancy posting is taken as the city''s current statement.'
