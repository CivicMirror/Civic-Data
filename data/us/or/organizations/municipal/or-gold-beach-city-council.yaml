  note: 'City of Gold Beach, council packets, February 3, 2026 (roll call with positions) and September 1, 2026 (voting members; City Recorder''s Election Update): A mayor and five councilors in numbered positions. Positions 1, 3 and 5 are four-year terms expiring December 15, 2026 (city public notice, June 4, 2026; newly elected officials take office December 15, 2026). There has been heavy mid-term turnover: Position 3 stood vacant on July 9, 2025, and the February 3, 2026 packet''s Position 5 holder, Anthony Vieira, no longer appears by September 1, 2026, when Summer Matteson sits in the fifth seat (her assignment to Position 5 is inferred from the packet''s member list, not roll-call-printed). The documents read do not state whether Southern, Stephenson or Matteson was appointed or elected, so no starts are modeled for them. Vieira is not modeled: his departure is undocumented. No candidate filed for Position 5 at the November 2026 election.'
