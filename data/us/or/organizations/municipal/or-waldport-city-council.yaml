  note: 'City of Waldport, official council agenda packets, December 10, 2025, June 11, 2026 and August 13, 2026 (roster as printed, incl. the Ordinance 832 vote line) and the Lincoln County Clerk''s November 2026 candidate list (classes): A mayor (two-year term, expiring end of 2026; Lambert is not seeking re-election) and six at-large councilors in four-year terms; the city prints no position numbers. ONE councilor seat is VACANT: Rick Booth resigned at the conclusion of the September 10, 2026 council meeting (reported by the Lincoln Chronicle, September 15, 2026, quoting his resignation letter) and no successor appointment appears in city records; the seat is on the November 3, 2026 ballot with the other two seats of the 2026 class. Booth is not modeled. The 2026 class (Woodruff, Severson and the vacant seat) expires end of 2026; the 2028 class (Dunn, Morris, Townsend) end of 2028.'
