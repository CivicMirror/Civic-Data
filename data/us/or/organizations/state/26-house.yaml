  note: 'Oregon Secretary of State, Elections Division, November 5, 2024 General Election Abstract of Votes (certified county-by-county abstract), published through the Oregon State Archives records system and linked from the Secretary of State''s Election Results & History page. For State Representative, District 26: Courtney Neron (D) 20,931 votes, marked ** as elected; Jason E Fields (R) 16,345; miscellaneous write-ins 31. Courtney Neron won by a plurality of 4,586 votes. Party labels are as printed in the abstract: (D) Democratic, (R) Republican. Members of the 83rd Legislative Assembly were sworn in on January 13, 2025. Courtney Neron Misslin resigned on May 9, 2025, after her appointment to the State Senate. Sue Rieke Smith was appointed by the Clackamas, Washington and Yamhill county commissions on June 6, 2025, and was sworn in on June 9, 2025; she serves the remainder of the term.'
