  note: 'Oregon State Senate Democratic Caucus (oregonlegislature.gov), ''Senator Lisa Reynolds Takes the Oath of Office'' (December 9, 2024): Reynolds, appointed to succeed Treasurer-elect Elizabeth Steiner, was sworn in as the Senator for District 17.'
