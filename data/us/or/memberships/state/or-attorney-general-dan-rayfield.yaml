  note: 'Oregon Secretary of State, Elections Division, November 5, 2024 General Election Abstract of Votes (certified county-by-county abstract), published through the Oregon State Archives records system and linked from the Secretary of State''s Election Results & History page. For Attorney General: Dan Rayfield (D) 1,156,489 votes, marked ** as elected; Will Lathrop (R) 967,964; miscellaneous write-ins 2,612. Rayfield won by a plurality of 188,525 votes. Party labels are as printed in the abstract: (D) Democratic, (R) Republican. Rayfield was sworn in on December 31, 2024, a week before his elected term began, when Ellen Rosenblum resigned the office early; the next election for the office is November 7, 2028.'
