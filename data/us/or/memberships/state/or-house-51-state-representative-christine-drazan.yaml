  note: 'Oregon Secretary of State, Elections Division, November 5, 2024 General Election Abstract of Votes (certified county-by-county abstract), published through the Oregon State Archives records system and linked from the Secretary of State''s Election Results & History page. For State Representative, District 51: Christine Drazan (R) 27,872 votes, marked ** as elected; miscellaneous write-ins 1,737. Christine Drazan won by a plurality of 27,872 votes. Party labels are as printed in the abstract: (R) Republican. Members of the 83rd Legislative Assembly were sworn in on January 13, 2025. Christine Drazan resigned on October 23, 2025, after her appointment to the State Senate. Matt Bunch was appointed by the Clackamas County Commission on November 17, 2025, and serves the remainder of the term.'
