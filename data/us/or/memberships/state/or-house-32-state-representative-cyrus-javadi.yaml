  note: 'Oregon Secretary of State, Elections Division, November 5, 2024 General Election Abstract of Votes (certified county-by-county abstract), published through the Oregon State Archives records system and linked from the Secretary of State''s Election Results & History page. For State Representative, District 32: Cyrus B Javadi (R) 20,409 votes, marked ** as elected; Andy Davis (D) 18,692; miscellaneous write-ins 68. Cyrus B Javadi won by a plurality of 1,717 votes. Party labels are as printed in the abstract: (R) Republican, (D) Democratic. Members of the 83rd Legislative Assembly were sworn in on January 13, 2025. Cyrus Javadi changed his party registration from Republican to Democratic on September 5, 2025; his 2024 candidacy is recorded as printed in the abstract.'
