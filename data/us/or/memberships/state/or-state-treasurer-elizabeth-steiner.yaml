  note: 'Oregon Secretary of State, Elections Division, November 5, 2024 General Election Abstract of Votes (certified county-by-county abstract), published through the Oregon State Archives records system and linked from the Secretary of State''s Election Results & History page. For State Treasurer: Elizabeth Steiner (D) 1,050,119 votes, marked ** as elected; Brian J Boquist (R) 919,794; Mary King (WF) 155,473; miscellaneous write-ins 1,882. Steiner won by a plurality of 130,325 votes. Party labels are as printed in the abstract: (D) Democratic, (R) Republican, (WF) Working Families. Steiner was sworn in on January 6, 2025; the next election for the office is November 7, 2028.'
