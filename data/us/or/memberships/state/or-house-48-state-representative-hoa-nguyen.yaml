  note: 'Oregon Secretary of State, Elections Division, November 5, 2024 General Election Abstract of Votes (certified county-by-county abstract), published through the Oregon State Archives records system and linked from the Secretary of State''s Election Results & History page. For State Representative, District 48: Hoa H Nguyen (D) 14,451 votes, marked ** as elected; John Masterman (R) 12,773; miscellaneous write-ins 69. Hoa H Nguyen won by a plurality of 1,678 votes. Party labels are as printed in the abstract: (D) Democratic, (R) Republican. Members of the 83rd Legislative Assembly were sworn in on January 13, 2025. Hoa Nguyen died in office on October 9, 2025. Lamar Wise was appointed by the Multnomah and Clackamas county commissions on November 5, 2025, and serves the remainder of the term.'
