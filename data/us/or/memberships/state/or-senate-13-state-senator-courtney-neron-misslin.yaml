  note: 'Oregon Secretary of State, Elections Division, November 8, 2022 General Election Abstract of Votes (certified county-by-county abstract), published through the Oregon State Archives records system and linked from the Secretary of State''s Election Results & History page. For State Senator, District 13: John D Velez (R) 27,045; Aaron Woods (D) 37,474 votes, marked ** as elected; miscellaneous write-ins 69. Aaron Woods won by a plurality of 10,429 votes. Party labels are as printed in the abstract: (R) Republican, (D) Democratic. Senators elected in 2022 were sworn in on January 9, 2023. Aaron Woods died in office on April 19, 2025. Courtney Neron Misslin, then the District 26 state representative, was appointed by the Clackamas, Washington and Yamhill county commissions on May 7, 2025, and serves the remainder of the term.'
  retrieved: '2026-10-23'
- url: https://gowestassociation.org/2025/05/12/oregon-capitol-update/
  note: 'GoWest Association, Oregon Capitol Update (May 12, 2025): county commissioners appointed Representative Courtney Neron to the Oregon State Senate following the passing of Senator Aaron Woods; Washington County''s Board of Commissioners notice records the appointment meeting on May 7, 2025.'
  retrieved: '2026-10-23'
