  note: 'Oregon Secretary of State, Elections Division, November 8, 2022 General Election Abstract of Votes (certified county-by-county abstract), published through the Oregon State Archives records system and linked from the Secretary of State''s Election Results & History page. For State Senator, District 26: Raz Mason (D) 27,850; Daniel G Bonham (R) 40,351 votes, marked ** as elected; miscellaneous write-ins 90. Daniel G Bonham won by a plurality of 12,501 votes. Party labels are as printed in the abstract: (D) Democratic, (R) Republican. Senators elected in 2022 were sworn in on January 9, 2023. Daniel Bonham resigned effective October 5, 2025. Christine Drazan, then the District 51 state representative and House Republican leader, was appointed by the Clackamas, Multnomah, Hood River and Wasco county commissions on October 23, 2025, and serves the remainder of the term.'
