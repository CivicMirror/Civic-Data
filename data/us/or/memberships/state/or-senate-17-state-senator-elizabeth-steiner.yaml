  note: 'Oregon Secretary of State, Elections Division, November 8, 2022 General Election Abstract of Votes (certified county-by-county abstract), published through the Oregon State Archives records system and linked from the Secretary of State''s Election Results & History page. For State Senator, District 17: John Verbeek (R) 12,377; Elizabeth Steiner Hayward (D) 46,647 votes, marked ** as elected; miscellaneous write-ins 86. Elizabeth Steiner Hayward won by a plurality of 34,270 votes. Party labels are as printed in the abstract: (R) Republican, (D) Democratic. Senators elected in 2022 were sworn in on January 9, 2023. Elizabeth Steiner resigned the seat on November 6, 2024, after her election as State Treasurer. Lisa Reynolds was appointed by the Multnomah and Washington county commissions on November 14, 2024, and was sworn in on December 9, 2024; she serves the remainder of the term.'
