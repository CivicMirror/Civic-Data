  note: 'Oregon Secretary of State, Abstract of Votes, November 8, 2022 General Election: for Judge of the Circuit Court, 2nd District, Position 11: Beatrice Grace 81,099; Marty Wilde 50,888; miscellaneous write-ins 1,084. Won the November 8, 2022 General Election for the term beginning 2023-01-02. Lauren S Holland won the May 2022 primary for this position but did not take the seat; the circumstances are a held research item on issue #170. An earlier winner at this position in the 2020-2024 abstracts, Lauren S Holland (2022-05-17), is recorded with a candidacy only by design: she won the May 2022 primary but retired before the term began, so no membership is recorded for her. Grace''s appointed span from August 9, 2022 is recorded in a separate membership (research step on issue #170, October 2026).'
