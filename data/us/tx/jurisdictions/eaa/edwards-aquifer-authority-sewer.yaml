  note: 'Edwards Aquifer Authority (SPD Public ID 103227509). Enumerated via the Texas Comptroller''s SPDPID under Entity Type ''Underground Water Conservation District'' and listed under Bexar County only, but confirmed via issue #32 research to be governed by its own unique enabling act (the Edwards Aquifer Authority Act), not Water Code Ch. 36, with a board spanning single-member districts in Bexar, Comal, Guadalupe, Hays, Caldwell, Medina, Atascosa, and Uvalde counties -- far larger than the raw sheet''s single-county attribution. 15 of the board''s 17 total seats are popularly elected; the other 2 are appointed non-voting members (South-Central Texas Water Advisory Committee; a rotating Medina/Uvalde county commissioners court seat) and are out of scope for this elected-boards-only audit.'
