# at-large across both counties -- each county elects its OWN 3
# directors to the shared board (6 elected seats total, not 3). The
# original structure-seed pass assumed the generic single-county
# 3-seat model without checking whether the elected seats also split
# per-county for the one joint district in the elected-seat scope.
# See the PRAD Board of Directors Nomination Packet
# (actx.edu/files/filecabinet/folder56/PRAD_Board_of_Directors_Nomination_Packet.pdf,
# fetched 2026-09-02), which tracks separate "Potter County Board of
# Directors" and "Randall County Board of Directors" rosters, each
# with its own Elected Director 1/2/3. Replaces the 3 generic
# potter-randall-tx-cad/director-place-N Posts.
