    returns 404 for every link and the Wayback Machine holds no snapshot),
    so the tally itself was not read firsthand; a delegated read of that
    report shows Roy''s tally line asterisked, indicating a possible write-
    in win. Minted ELECTED on the convergent official record (warning +
    reorganization seating + successive official rosters + superintendent
    confirmation) under Walter''s ruling of 2026-10-26.'
