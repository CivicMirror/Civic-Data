    Report''s warning (Article 2) warned a Barnet director for a three-year
    term at that meeting. Supt. Matt Foster (CCSU) confirmed on 2026-10-26
    that Roy is currently serving. DISCLOSURE: the certified April 2, 2024
    vote totals are printed only in the district''s 2024-25 Annual Report,
