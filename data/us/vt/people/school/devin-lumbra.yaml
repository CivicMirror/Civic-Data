    2027), Rachael Tatro (Clerk, Enosburgh, 2027), Joshua Muir (Enosburgh,
    2028), Devin Lumbra (Richford, 2028), Akua Smith (Vice Chair, Enosburgh,
    2029), Gabrielle Elwood (Richford, 2029). All six are named across the
    September 8 and October 13, 2026 minutes. Seats are residency-allocated
    (Enosburgh 3 / Richford 3) but elected by the whole district (modified
    at-large; State Board default articles Art. 10(A) ''Hybrid Model'',
    expanded 4 to 6 seats in 2019 -- the 2019 amendment tally itself was not
    located in an official document). Lumbra''s current membership is
    ELECTED: he was appointed March 11, 2025 to a vacant Richford seat and
    then elected March 3, 2026 to its remaining two years.'
