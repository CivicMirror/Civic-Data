  note: 'Mount Anthony Union HSD No. 14: eleven directors, residency
    allocated Bennington 4 / North Bennington 2 / Pownal 2 / Shaftsbury 2 /
    Woodford 1 (FY22 directory), elected by all district voters by
    Australian ballot (modified at-large). Only the three members whose
    published terms (2027) run past the March 2026 election are minted.
    HELD: the three members whose terms expired 2026 (McEnaney, Aiken,
    Fredrickson -- the March 3, 2026 return is the missing document), the
    three whose terms expired at the March 4, 2025 election (Johnson,
    Sekora, Wallace -- re-election/succession undocumented), and the two
    unexpired-term seats filled March 4, 2025 (winners unnamed in any
    fetched document; missing: the March 4, 2025 annual meeting minutes /
    election return and the annual report for the March 3, 2026 meeting).
    SVSU/North Bennington/MAU Annual Report for the March 2025 annual
    meeting (official): the MAUHSD directory lists nine directors with term
    expirations -- Mulligan (Chair) 2027, McEnaney (Vice-Chair) 2026, Aiken
    (Clerk) 2026, Fredrickson 2026, Johnson 2025, Sekora 2025, Thurber 2027,
    Olmstead 2027, Wallace 2025 -- for an 11-seat board (SVSU FY22 Annual
    Report: "The MAUHS Board is comprised of 11 Directors who each serve 3
    year terms"). The March 4, 2025 warning (Art. B, same report) elects
    five seats by Australian ballot from all district voters, including two
    unexpired-term seats (a NBGSD seat to 2026; a Pownal seat to 2027) --
    i.e., two seats stood vacant at that election.'
