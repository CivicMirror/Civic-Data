  note: 'Lake Region Union High School District: eleven directors elected by
    the whole district electorate at a single floor annual meeting with
    seats allocated by residency (16 V.S.A. section 748 modified at-large;
    allocation as published in the 2023-2024 Annual Report: Albany 1, Barton
    3, Brownington 1, Glover 1, Irasburg 2, Orleans 2, Westmore 1). Only the
    three members whose current terms are established by a fetched official
    document are minted; the remaining seats were HELD pending the
    district''s annual-meeting records (White, Kinsley, Piette and
    Michiewicz were resolved by the March 18, 2026 minutes on 2026-10-26;
    Coe, Postman, Maxwell and a possible 11th seat remain held)026 roster
    table and the March 18, 2026 annual meeting minutes. David Blodgett
    (Orleans, re-elected 2025) has departed; Sarah Kinsley appears in his
    place by an undocumented route. Lake Region Union High School District
    2023-2024 Annual Report (official, via OCSU): "The Lake Region Union
    High School Board is made up of 11 members from the sending towns of
    Albany, Barton, Brownington, Glover, Irasburg and Westmore," with the
    last full roster and term expirations (allocation: Albany 1, Barton 3,
    Brownington 1, Glover 1, Irasburg 2, Orleans 2, Westmore 1).'
  retrieved: '2026-10-22'
