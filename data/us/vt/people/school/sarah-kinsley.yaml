  note: 'LRUHS board packet, December 2, 2024 (official, via OCSU): warning
    for the March 19, 2025 annual meeting, Article 6 -- elect four directors
    (former Barton ISD, Albany, Glover, former Orleans ISD) for three-year
    terms from the district''s legal voters at a single floor meeting; the
    packet annotates the seats with the sitting members Cahill, Carbonetti,
    Racine, Blodgett. The March 23, 2026 reorganization minutes (April 6,
    2026 packet) seat ten members with Carbonetti as Chair.'
  retrieved: '2026-10-22'
- url: https://files-backend.assets.thrillshare.com/documents/asset/uploaded_file/3488/Ocsu/233ce4ff-338e-4f68-a6e7-dfae3822e45b/03-18-26-LRUHS-Annual-Meeting-2026.pdf?disposition=inline
  note: 'Lake Region Union High School District annual meeting minutes,
    March 18, 2026 (official; hosted on the Orleans Central SU site and
    supplied by Lisa Worden, OCSU, on 2026-10-26 after she unblocked the
    file''s view). Article 6 (floor meeting; slate motion carried, clerk to
    cast one ballot for each): Bernard White, Jr. (former Barton
    Incorporated SD seat) elected to a three-year term; Sarah Kinsley
    (Irasburg) to a three-year term; Jerry Piette (Irasburg) to a one-year
    term; Linda Michiewicz (Westmore) to a three-year term. Article 4
    introductions name the sitting board. The Coe, Postman and Maxwell seats
    were not before this meeting and remain HELD (their current terms are
    still not established by a fetched official document), as does the
    possible 11th seat.'
