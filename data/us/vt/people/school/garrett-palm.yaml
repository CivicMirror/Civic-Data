- url: http://norwich.vt.us/wp-content/uploads/2020/06/SB-packet-06-10-20.pdf
  note: 'Dresden Articles of Agreement (December 17, 2002, as reproduced in
    the Town of Norwich Selectboard packet of June 10, 2020), Article C: the
    Dresden board ''shall consist of eleven (11) members, seven (7) of whom
    shall be residents of Hanover and elected by the Hanover School
    District, and four (4) of whom shall be residents of Norwich and elected
    by the Norwich Town School District'' -- directors are deemed elected to
    Dresden by their election to the member-district boards; the person
    elected to Norwich''s two-year seat in even-numbered years sits on the
    Dresden board with ''all the rights of a member... except the right to
    vote''. The compact permits at-large seats (16 V.S.A. sections 774, 775)
    but Article C provides none. The seven Hanover (New Hampshire) seats are
    OUT OF SCOPE for this dataset (Walter''s ruling, 2026-10-22) and no post
    is modeled for them; the Norwich seats are modeled here, and no separate
    Norwich School District board post is built.'
  retrieved: '2026-10-22'
