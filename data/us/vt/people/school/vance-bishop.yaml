  note: 'PAHRTSD board page (official, fetched 2026-10-22) labels the seats:
    the three DIRECTLY ELECTED community at-large seats -- "Vance Bishop -
    ACSD at Large," "Kim Farnham, Board Chair - MAUSD at Large," "Dan
    Rossignol - ANWSD at Large" -- alongside the out-of-scope seats (4
    partner-high-school representatives and the WIB employer seats). The
    board structure (11 voting members: 4 partner reps, 3 community at-large
    elected, 4 employer members nominated by the Workforce Investment Board
    and appointed by the board; 3-year terms) is the district''s standing
    description via the Addison County Workforce Alliance
    (https://addisoncountyedc.org/news/join-board-hannaford-career-center).
    Election model: each at-large seat is elected by ITS OWN sending
    district''s voters at that district''s annual meeting -- proven by
    ACSD''s official FY27 Budget Book minutes ("ARTICLE 2: To elect a new
    ACSD At-Large Board Member for Patricia A. Hannaford"); the RTSD''s own
    warnings never put directors on the district ballot. NO term ends are
    published for the three elected members (resolving documents: the three
    sending districts'' annual meeting minutes). The voter-approved section
    1572(b) agreement itself was not located -- if it provides for direct
    election of the partner seats, those four seats would come into scope.
    Only the elected seats are built (Walter''s tech-center ruling).'
