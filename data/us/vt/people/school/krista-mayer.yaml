- url: https://files-backend.assets.thrillshare.com/documents/asset/uploaded_file/3488/Ocsu/afdfe40d-a479-45da-b6bd-d4bb05464893/038-09-26-LRUEMS-Annual-Meeting.pdf?disposition=inline
  note: 'Lake Region Union Elementary-Middle School District annual meeting
    minutes, March 9, 2026 (official; signed by District Clerk Shelia R.
    Martin and accepted by Moderator Kristin Atwood; hosted on the Orleans
    Central SU site and supplied by Lisa Worden, OCSU, on 2026-10-26).
    Article 6 warned seven seats. Outcomes: Krista Mayer (Glover) elected to
    a three-year term; Brian Arant (Irasburg) to a three-year term; Samantha
    Johnson (former Orleans ISD) elected -- the warning framed a ONE-year
    term while the minutes'' outcome sentence says ''two-year term''; the
    warned term governs and her end is recorded as 2027 (Walter''s ruling,
    2026-10-26; conflict disclosed). Megan Valley, already seated for
    Westmore to 2027, was elected to the Brownington two-year seat, and her
    membership is extended to 2028. The minutes are INTERNALLY INCONSISTENT
    at Article 6B (former Barton ISD, two-year term): the nomination
    recorded is Bernard White, Jr., but the outcome sentence names Jessica
    Torrence as elected -- that seat remains HELD pending the district''s
    clarification (requested 2026-10-26 draft F6). The Albany three-year
    seat (Urie declined) and the Westmore three-year seat (Lafebvre
    declined) were left VACANT, nominations tabled.'
  retrieved: '2026-10-26'
