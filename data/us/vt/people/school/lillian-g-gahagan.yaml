  note: 'Rivendell ISD board agenda packet, April 7, 2026 (official HighBond
    portal, doc 7055): the February 2026 minutes'' town-labeled rosters name
    the full 11-member board (Fairlee 3, Orford NH 3, Vershire 2, West
    Fairlee 2, At-Large 1); the certified 2025 tally (minutes signed by
    District Clerk Brenda Gray) elects Ludwig (Fairlee, 3-yr) and
    Zwikelmaier (West Fairlee, 3-yr) and Gahagan (At-Large, 1-yr, 174
    votes); the certified 2026 tally elects Bouquillon (Fairlee, 57), Osgood
    (Vershire, 20) and Gahagan re-elected (At-Large, 117). Per Walter''s
    ruling for interstate districts, only the Vermont-side seats are built
    -- the Orford (NH) seats are OUT. The 2026 filing notice (Town of
    Fairlee) lists the Fairlee seat expiring 2026 as held by Jennifer
    Hallmartel "(Appointed)" -- she sat through Feb. 17, 2026 and Bouquillon
    was elected to the seat; her appointment date and predecessor are
    undocumented, so she is NOT minted. Powers/Thames/Cadwell ends are
    unpublished in fetched sources (the certified April 13, 2024 minutes
    that would fix them at 2027 sit behind a BoardDocs 403) -- minted with
    no ends off the current minutes.'
