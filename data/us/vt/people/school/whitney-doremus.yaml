  note: 'Grand Isle Supervisory Union, ''School Board Members - 26-27''
    roster sheet (official; supplied by Superintendent Lisa Ruud by email on
    2026-10-28 in response to CivicMirror''s records request for the Bedard
    appointment minutes -- the minutes themselves were not supplied): the
    South Hero section lists Anna Bedard, seated 2026, ''Expires May 2027'',
    and the GISU board list annotates her ''(replace Tim Maxham)''. Her mode
    is APPOINTED: Maxham''s seat fell vacant effective August 1, 2026 and
    the board''s vacancy notice filled it by interim appointment only, so no
    election could have seated her. Her END IS HELD: the vacancy notice runs
    the appointment to March 2027 (when voters elect a director for the
    final year of the term ending March 2028), while the GISU sheet says May
    2027 -- the appointment minutes would settle it. The same sheet lists
    Whitney Doremus (Vice Chair) ''expires 2027'', supplying the end our
    build lacked. The sheet''s ''Year appointed'' column is unreliable where
    it conflicts with certified returns (it dates Monterosso to 2023 against
    the certified March 2026 return) and is relied on here only for
    membership and expiries.'
