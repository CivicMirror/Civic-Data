  note: 'Bellows Falls Union High School District annual-meeting warning
    (board-approved February 16, 2026, in the June 8, 2026 board agenda
    packet): the signature block lists all ten directors with term-end years
    -- Chris Hodsden (Chair), Jamie Storrow, June Streeter, Kim Keefe, Mary
    Howard Hall, Paul Obuchowski, Ginger Driscoll, Emily Bragonier, Ben
    Wallace, Emily Ferenc. Directors are elected by their member districts,
    not at the union meeting (16 V.S.A. section 706k(a)); the March 9, 2026
    board minutes list the same ten in attendance. The current per-town
    allocation of the ten seats could not be re-verified (the last full
    allocation on record is 2020: Rockingham 5, Westminster 3, Grafton 1,
    Athens 1; only Bragonier = Westminster is confirmed current), so the
    board is modeled as one ten-seat post.'
