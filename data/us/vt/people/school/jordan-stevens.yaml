    approved by the School Board and Moderator) -- Article 6, ''To elect a
    School Director for a three-year term'': Jordan Stevens was nominated by
    Joyce Stevens, seconded by Kris Sperber; hearing no other nominations,
    nominations were closed and the voice vote was all in favor. Stevens is
    ELECTED to the three-year term, end ''2029'' (the minutes record the
    election by sole nomination + closure + unanimous voice vote rather than
    using the word ''elected''; no tally exists). Article 7 records thanks
    to Ray Rice for 18 years on the board -- Rice did not stand again; his
    seat is the one Stevens fills.'
