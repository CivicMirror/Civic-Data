  note: 'Vermont Elections Database (Vermont Secretary of State), contest page ''2024
    Nov 5, General Election, State Senate, Orleans District'' (district totals): Samuel
    A. Douglass (Republican) 7,168 votes; Katherine Sims (Democratic) 4,895; write-ins
    38. The contest page''s cited official source is the Secretary of State''s ''November
    5, 2024 General Official Results.pdf''. State senators serve two-year terms; the
    November 3, 2026 general election decides the next term. Samuel Douglass resigned
    the seat in October 2025 (the Senate directory records the resignation date as
    October 27, 2025). Governor Phil Scott appointed John Morley III to fill the vacancy,
    effective December 5, 2025.'
