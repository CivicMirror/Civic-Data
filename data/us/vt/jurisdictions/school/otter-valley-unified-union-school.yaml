  note: '16 V.S.A. section 603(a)(4)(E) inventory: Otter Valley Unified Union School
    District, a unified union district in the Rutland Northeast Supervisory Union
    (member towns: Brandon, Goshen, Leicester, Pittsford, Sudbury, Whiting). Operates
    PK-12. NO POSTS are built: the seat structure is established (residency town
    seats for Brandon, Leicester, Pittsford, Sudbury and Whiting -- Goshen has no
    town seat -- plus at-large seats, per the board''s Oct. 21, 2025 agenda and
    the SU''s Dec. 4, 2025 seats-up notice), but the total board size and per-town
    seat counts are established by no fetched official source, and the town seats''
    electorate (town-only vs. district-wide) is not verbatim-established. The seven
    certified March 3, 2026 winners (SU results post, March 4, 2026) are Kevin Thornton,
    Lesley Bienvenue, Kevin White, Rhiannon Banks-Morgan, Gabriel McGuigan, Jessica
    Fjeld and Katelynne Hill -- the post does not assign them to seats, and the
    continuing members appear in no fetched official roster, so NO memberships are
    minted. Resolving documents: the district''s Articles of Agreement, the FY2026
    Annual Report board directory, or the March 2026 warning / a member town''s
    sample ballot.'
