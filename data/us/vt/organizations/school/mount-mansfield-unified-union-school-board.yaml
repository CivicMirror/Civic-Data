  note: '16 V.S.A. section 603(a) inventory: Mount Mansfield Unified Union School
    District, a unified union district that is its own supervisory district (AOE
    SU012; member towns: Bolton, Huntington, Jericho, Richmond, Underhill). Formed
    November 4, 2014 as a Modified Union district; Huntington acceded by the June
    6, 2019 merger vote. Operates PK-12. NO POST is built: the board''s seat count
    and per-town allocation since Huntington''s accession are not established by
    any fetched official document (the 15-seat population-apportioned figure exists
    only in 2014 news coverage), and no current member is verified by an official
    source. Resolving documents: the district''s current board roster (mmuusd.org
    School Board section), the Articles of Agreement as amended in 2019, and the
    five town clerks'' March 3, 2026 returns.'
