  note: 'Kingdom East UUSD: fifteen directors, seats allocated by town
    residency across the eight member towns, elected by the whole district
    electorate on a single commingled Australian ballot (16 V.S.A. section
    730(a)(2) modified at-large). NO memberships are minted yet: the current
    roster could not be tied to any fetched official document -- the board
    page roster does not extract as text, and the district''s 2026 Annual
    Report PDF returned an empty body. The only firsthand-verified current
    member is Chair Lindsay Carpenter (district superintendent-search page).
    The exact resolving documents are the 2026 KESD Annual Report (which
    should also carry the per-town allocation and the March 3, 2026 warning)
    and the Articles of Agreement adopted March 7, 2017. A Newark seat fell
    vacant in fall 2025 (to be appointed until the March 3, 2026 election,
    per the district''s November 2025 board flyer). Kingdom East School
    District board page (official): "The fifteen-member Board, with
    representation from our eight member towns." The district''s Revised
    2023 Warning warns all eight towns to one district vote; the district
    states its votes "are commingled and not reported by town" (2019 bond
    post); the 2021 Annual Report warning (Article 3) elects directors by
    residency seat (that year: Concord, Lunenburg, Lyndon, Newark, Sutton
    x2, Wheelock) by Australian ballot -- the 16 V.S.A. section 730(a)(2)
    modified at-large pattern.'
  retrieved: '2026-10-22'
