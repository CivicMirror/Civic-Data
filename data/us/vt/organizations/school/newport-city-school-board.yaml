  note: 'North Country Supervisory Union, Newport City School Board page
    (official; the source NCSU Executive Assistant Tiffany Gray pointed to
    in her 2026-10-28 reply to CivicMirror''s records request): the
    2026-2027 roster is Maryellen Maclure (Chair), Carrie Ann Roberge (Vice
    Chair), Mary Ellen Prairie (Clerk), Elizabeth (Betsy) Daly and Jacques
    Nadeau -- five members, establishing the board at FIVE seats (the
    2025-2026 roster was the same five except Debra Prue in place of
    Nadeau). NO MEMBERSHIPS ARE MINTED YET: the page publishes no term ends
    and no member-level seating document was fetched for any of the five;
    Nadeau''s arrival coincides with the school''s advertised board vacancy
    (appointment to the March 2027 town meeting, per the Newport City
    Elementary homepage notice) but no minutes recording his appointment
    were fetched, so his mode is undocumented; and NCSU''s own pages spell
    two names inconsistently (the board page''s ''Maryellen Maclure'' /
    ''Mary Ellen Prairie'' against the Full Board page''s ''Mary Ellen
    Maclure'' / ''Maryellen Prairie''), so canonical name forms await a
    ballot or annual-report source. Resolving documents: the board''s
    September/October 2026 minutes (Nadeau''s appointment) and the
    district''s FY2027 annual report or March 2026 warning (term expirations
    and name forms). A follow-up request for those documents has been
    drafted for the district (unsent).'
