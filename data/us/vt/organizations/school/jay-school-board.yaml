    by email on 2026-10-25 in response to CivicMirror''s records request;
    the document is headed ''UNOFFICIAL MINUTES''): the school-district
    article records that Jessica Whitaker was nominated by Molly Dockter,
    seconded by Janet Butler, and ''was elected Jay School Board member to
    finish out two years of a three-year term'' -- the seat Jeffrey Morse
    had held (his published term ran to 2027; the minutes do not record his
    departure). Minted ELECTED, end ''2027'', on Walter''s ruling of
    2026-10-26 that the unofficial minutes are acceptable for this seat.'
