- url: https://www.ncsuvt.org/33946_3
  note: 'Jay School District: three directors at-large under 16 V.S.A.
    section 423(a) ("three elected members that serve three-year terms" --
    Town of Jay school-board page), elected from the floor at the annual
    school district meeting. One membership is HELD: Jessica Whitaker holds
    the third seat in the SU''s listings from 2024-2025 forward, but no
    fetched official document records how she was seated (Jeffrey Morse,
    whose published term ran to 2027, no longer holds it -- his departure
    and her appointment/election are undocumented; the March 4, 2025 meeting
    minutes and the board minutes recording any appointment are the missing
    documents). North Country Supervisory Union Jay/Westfield Joint School
    Board page (official): lists Jay''s three directors identically for
    2024-2025, 2025-2026 and 2026-2027 -- Kimberly Arnold, Molly Dockter,
    Jessica Whitaker (the joint board comprises the two districts'' elected
    directors, per the Town of Jay school-board page). The town page roster
    (Dockter 2026, Morse 2027, Arnold 2025) is stale -- it predates
    Whitaker''s seating and both recent re-elections.'
  retrieved: '2026-10-22'
- url: http://www.jayvt.com/vertical/sites/%7BD46CBAAF-C206-4678-BD37-4293256D9148%7D/uploads/Town_Report_2023_Combined_PDF(1).pdf
  note: 'Town of Jay Town Report 2023 (official): abstract of the March 7,
    2023 school district meeting minutes -- Article 2 elected Molly Dockter
    to a 3-year term; Article 3 elected Kimberly Arnold "to fill the
    remaining two-years of a three-year unexpired term" (the seat Tracey
    Hinton had vacated). The March 5, 2024 warning warns one 3-year director
    seat; the town school-board page states: "The Jay School District has
    three elected members that serve three-year terms."'
  retrieved: '2026-10-22'
