  note: 'Ludlow-Mount Holly UUSD: eight directors, residency allocated
    Ludlow 4 / Mount Holly 4, elected by the whole district electorate on a
    single Australian ballot (16 V.S.A. section 730(a)(2) modified at-large;
    Mount Holly merger Q&A quoting the articles). No per-member term
    expirations are published in any fetched current document -- all
    memberships carry no end (missing: the March 3, 2026 warning and the
    towns'' certified returns). Two memberships are HELD: June Capron and
    Katie Murphy are verified current members (roll calls of August 20 and
    September 22, 2026) who filled the two seats the March 2026 ballot left
    open (both still "Open Seat" in the June 10, 2026 packet), almost
    certainly by appointment -- but no fetched document records their
    appointments or which town''s seat each holds (missing: the board
    minutes between June 10 and September 22, 2026). Two Rivers SU site
    (official), hosting the 2025-2026 LMHUUSD Annual Report: board signature
    block of eight members (Ludlow: Beth Merrill, Jamie Dickey, Jenn
    Michalke, Kaitlyn Benson; Mount Holly: Julie McKenzie, David Martin,
    Kelly Tarbell, Katie Kleczkowski). The March 11, 2026 meeting packet''s
    membership table shows the post-election board: Ludlow -- Michalke,
    Benson, Merrill, one Open Seat; Mount Holly -- Tarbell, Martin, Michel,
    one Open Seat. Roll calls of August 20 and September 22, 2026 add June
    Capron and Katie Murphy (see the post note).'
  retrieved: '2026-10-22'
