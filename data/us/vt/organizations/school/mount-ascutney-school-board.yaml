  note: 'Mount Ascutney SD: six directors, residency allocated Windsor 3 /
    West Windsor 3, elected by the voters of both towns (modified at-large
    "Hybrid Model"). NO memberships are minted: the newest fetched official
    roster is the March 13, 2023 board agenda (Burrows, McMullen, McGraw,
    Roisman, Yates, Pedrick) and the board has since turned over -- only
    Bill Yates is corroborated as current by a 2026 official document (Act
    170 committee minutes, October 14, 2026), and the March 2026 re-
    election-and-resignation of Amy McMullen plus the pending appointment to
    her seat are known only from news leads. Resolving documents: the
    board''s March-May 2026 minutes on wsesu.net and the adopted 2017
    Articles of Agreement. Town of West Windsor Selectboard minutes, May 11,
    2017 (official): the Articles of Agreement discussion for the merger
    records the board design -- "3 Windsor and 3 West Windsor members, but
    they would have to be voted on by both towns" (the "Hybrid Model") --
    the 16 V.S.A. section 730(a)(2) modified at-large pattern. The
    district''s 2021 Annual Report lists six "Mount Ascutney School Board
    Directors" (3 Windsor + 3 West Windsor by address). The adopted 2017
    Articles of Agreement themselves were not located.'
