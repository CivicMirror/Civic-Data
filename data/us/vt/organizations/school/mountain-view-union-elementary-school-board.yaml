  note: '16 V.S.A. section 603(a)(7)(I) inventory: Mountain View Union Elementary
    School District, a union elementary district (16 V.S.A. section 748) in the
    Orleans Southwest Supervisory Union (member towns: Greensboro, Hardwick, Stannard,
    Woodbury). Created by State Board order under Act 46 (operational July 1, 2019);
    operates PK-6. NO POST is built: the board has 10 town-designated seats (the
    board''s October 23, 2025 vacancy announcement names one Greensboro seat and
    one Hardwick seat), but the seats-per-town apportionment is established by no
    fetched official source, and no member''s town or term end is published officially
    (the April 2026 superintendent letter names the 10 members without towns). Resolving
    documents: the district''s articles / State Board Act 46 order, or the February
    24, 2026 annual meeting warning/minutes.'
