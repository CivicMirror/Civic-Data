  note: 'Mountain View Union Elementary School District Annual Report 2026
    (official, Orleans Southwest SU): the pre-meeting board table (board as
    published January 2026) lists Samantha Friend (Chair) 2026, Terri Vest
    (Vice Chair) 2027, Darren Usinowicz (Clerk) 2026, Kyle Anderson 2028,
    Laura Cannon 2026, Simon Cohen 2026, Adam Gann 2026, Heather Meacham
    2027, Meghan Shatney 2026, Juliana Swank 2026. The 2026 warning (Article
    2) elects directors FROM THE FLOOR at the February 24, 2026 annual
    meeting: Greensboro 1x 3-year + 1x 1-year-remaining, Hardwick 2x 3-year
    + 1x 1-year-remaining, Stannard 1x 3-year, Woodbury 1x 3-year (seven
    seats). The same report''s February 25, 2025 annual-meeting minutes
    record: Kyle Anderson (Hardwick, 3-year) ELECTED 49-7; Meghan Shatney
    (Hardwick, 1-year-remaining) ELECTED 30-16-12; Simon Cohen (Stannard,
    1-year-remaining) ELECTED unanimously; Heather Meacham (Woodbury,
    2-years-remaining) ELECTED 38-20. Mountain View UESD board (Orleans
    Southwest SU, official sources): ten town-designated seats -- Hardwick
    5, Greensboro 2, Woodbury 2, Stannard 1 (apportionment derived from the
    district''s 2024-2026 annual-report warnings and election minutes; no
    articles document was fetched). Directors are elected FROM THE FLOOR by
    the district-wide electorate at the February annual meeting (only the
    budget goes to Australian ballot), so the district is modeled as ONE
    10-seat post with the allocation stated here. All ten current members
    were minted 2026-10-27 (the district was structure-only): four with
    directly published ends (Vest 2027, Anderson 2028, Meacham 2027,
    Usinowicz 2029), Cohen at 2029 by the seat arithmetic disclosed in his
    source note, and five ELECTED with ends held (Friend, Gann, Shatney,
    Cannon, Swank -- re-elected February 24, 2026 per the superintendent''s
    ''everyone returned'' letter, but which warned seat length each took is
    unpublished). Cannon''s and Swank''s towns are likewise unpublished (one
    holds a Greensboro seat, the other a Hardwick seat). The February 24,
    2026 annual-meeting minutes (expected in the 2027 annual report) would
    close every held end.'
  retrieved: '2026-10-27'
