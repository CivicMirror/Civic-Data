  note: 'Winooski SD School Board page (official, re-verified 2026-10-22):
    Mace (President) "3 Year Term Expires: 3/2029"; Millar (Vice President)
    3-year exp. 3/2028; Essiba 2-year exp. 3/2028; Bowers 2-year exp.
    3/2027; Livermore (Secretary) "(Interim/3 Year Term Expires: 3/2027)."
    The charter (16 V.S.A. App. ch. 23 section 23-2) fixes five trustees
    elected at large -- three 3-year seats and two 2-year seats -- matching
    the page''s seat classes exactly, and empowers the board to appoint to a
    vacancy until an election fills the remainder. Livermore took Isaiah
    Donaldson''s seat mid-term in fall 2025 (he is listed in the October
    2025 newsletter; she attends from Nov. 12, 2025) and the district''s own
    page still labels her Interim -- minted APPOINTED (interim). The
    appointment record was located 2026-10-29: the minutes of the Sept. 29,
    2025 special meeting (indexed on the district''s minutes page, which
    labels them ''(Unofficial)'') record the appointment, and are cited on
    Livermore''s own membership, recorded per Walter''s 2026-10-29 ruling
    (the Jay/Whitaker unofficial-minutes precedent). Excluded: Allyssa
    Ravelin, the elected District Treasurer under section 23-3(2)(D) (a
    district officer, not a trustee), and two student members. Donaldson
    gets no ended record -- his departure mechanism is undocumented.'
  retrieved: '2026-10-22'
