  note: 'Georgia (GEMS) School Board page (Franklin West SU, official): five
    directors -- Carl Laroe (Chair), J.C. Thouin (Clerk), Grady Ballard,
    Lisa Mattos, Richard Dickinson. NO MEMBERSHIPS ARE RECORDED for this
    district: two official FWSU vacancy notices show TWO seats filled by
    appointment on April 14, 2026 and ONE more on May 5, 2026 (all to March
    2027), and no fetched official source names the appointees or identifies
    which of the five page-listed members are elected and which appointed.
    The exact missing documents are the GEMS board minutes of April 14 and
    May 5, 2026. Laroe, Thouin and Ballard are documented as sitting
    directors on March 10, 2026 (signatures on the FY27 revote warning). The
    board is five directors at-large (16 V.S.A. section 423(a)-(b); FWSU''s
    official 2017 Alternative Structure Application to the State Board of
    Education states each Franklin West district ''maintains a 5-person
    board of school directors''.)'
