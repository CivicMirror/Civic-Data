  note: 'Town of Reading, 2026 Warning (printed in the February 2026 Informer): Article
    1 elects by Australian ballot on March 3, 2026 a Moderator (one year), Town Clerk
    (three years), Town Treasurer (three years), a Selectperson (three years), Trustees
    of Public Funds, a Cemetery Commissioner, and Library Trustees; Article 3 elects
    the Treasurer as collector of delinquent taxes; Articles 5 and 6 ask the voters
    to authorize appointing the Treasurer and the Clerk. Rayna Bishop held the seat
    to 2026; the 2026 outcome is published nowhere official, so the post is created
    without a membership'
