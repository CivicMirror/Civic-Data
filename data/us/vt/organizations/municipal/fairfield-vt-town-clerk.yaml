  note: 'Town of Fairfield Selectboard minutes, April 13, 2026 (draft): ''Ron made
    a motion to appoint Demetrius Bolduc as Fairfield Town Clerk, as authorized pursuant
    to 17 V.S.A. Chapter 2651e. Damian seconded. All in favor.'' Bolduc was sworn
    in at the same meeting. Linda Hodet, the elected clerk, had stepped down and sits
    in the attendance list as Interim Town Clerk; the board welcomed Bolduc as the
    new Town Clerk and thanked Hodet for her years of service. Fairfield''s voters
    approved converting the town clerk to an appointed office under 17 V.S.A. §2651e
    at the March 3, 2026 annual town meeting. CORRECTION (2026-10-26): the batch-8
    build recorded Bolduc as elected with the mode unverified, working from the June
    22, 2026 minutes only; the April 13 minutes establish the appointment, and he
    is recorded as appointed.'
  retrieved: '2026-10-26'
- url: https://outside.vermont.gov/dept/sos/Elections_Division/voters/guide_vermonts_town_clerks_treasurers_county.pdf
  note: 'Vermont Secretary of State, Elections Division, ''Guide to Vermont''s Town
    Clerks, Treasurers, & County Clerks'' (January 2026): lists Linda Hodet as Town
    Clerk of Fairfield (January 2026). Hodet stepped down in early 2026, served as
    Interim Town Clerk, and was succeeded by the appointed Bolduc on April 13, 2026.'
  retrieved: '2026-10-18'
