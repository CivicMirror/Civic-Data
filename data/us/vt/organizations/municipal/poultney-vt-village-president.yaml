  note: '24 App. V.S.A. ch. 269 (Village of Poultney): sections 302(a) and 303(b):
    a Village President is elected at the annual village meeting from among the trustees,
    and under section 502(d) the President is chairman of the Board of Trustees; under
    section 302(d) the President also serves as Village Moderator, so no separate
    moderator post is created. The only roster naming a president rests on a restricted
    clerk reply and a second public source styles the same man Vice-Chair, so the
    post is created without a membership'
