  note: 'Vermont Secretary of State, Elections Division, Official Report of the Canvassing
    Committee -- United States and Vermont Statewide Offices, General Election, November
    5, 2024 (canvassed under 17 V.S.A. sections 2368-2371). For Lieutenant Governor:
    John S. Rodgers 171,854 votes (46.09%, a plurality); David Zuckerman 165,876;
    Ian Diamondstone 13,671; write-in 1,013. No candidate received the major part
    of the votes, so under Chapter II, section 47 of the Vermont Constitution the
    General Assembly elected the office by joint ballot on January 9, 2025, choosing
    Rodgers 158-18 over Zuckerman; Rodgers was sworn in the same day. Party labels
    are not printed in the canvass report; Rodgers'' Republican affiliation is as
    printed in the Elections Division''s Official Returns of Votes for the same election.
    The November 3, 2026 general election decides the next term.'
  retrieved: '2026-10-16'
