  note: 'Morgan School District: three directors at-large under 16 V.S.A.
    section 423(a). Only two memberships are minted; the third seat''s
    2026-2027 status is undocumented (Janet Selby held it in 2025-2026 and
    vanishes from the 2026-2027 block with no successor or vacancy
    documented -- missing: the Morgan March 2026 annual meeting /
    reorganization minutes and the Town of Morgan Annual Report officers
    list). No term expirations are published for any member. North Country
    SU Morgan School Board page (official): year blocks -- 2024-2025:
    Danielle Blake (Chair), Sean Selby, Tammy Lacourse; 2025-2026: Blake
    (Chair), Janet Selby, Lacourse; 2026-2027: ONLY Blake (Chair) and Tammy
    Lacourse (Vice Chair, Clerk). No term expirations are published for any
    member. The NCSU Full Board page corroborates Blake and Lacourse
    ("LaCourse" there) as the current directors.'
