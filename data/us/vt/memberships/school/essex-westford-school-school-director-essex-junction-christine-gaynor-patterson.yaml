- url: https://www.ewsd.org/page/schoolboard
  note: 'Essex Westford School District ''Meet the School Board'' page
    (official): ''EWSD has 10 elected School Board members representing
    Essex Town, Essex Junction, and Westford... School Directors are elected
    by voters in the communities they represent. Board seats have three-year
    terms.'' The allocation (Essex Town 4, Essex Junction 4, Westford 2) is
    from the Articles of Agreement (Art. 9) approved November 3, 2015 and is
    confirmed in every annual-meeting warning 2022-2026; no consolidated
    current articles document was located (the 2015 study-committee text
    controls, corroborated in current operation). Westford''s two directors
    carry a 0.5 weighted board vote each under Art. 9; its current
    application is undocumented post-2022.'
  retrieved: '2026-10-22'
- url: https://www.ewsd.org/article/2822090
  note: 'Essex Westford official results article, April 15, 2026: Scott
    Brown and Dawn Irwin (Essex Junction), Jemima Talbot (Essex Town) and
    Marilyn McConnell (Westford) elected April 14, 2026 -- matching the
    board page''s term-end 2029 group. The April 9, 2025 results article
    likewise matches the 2028 group (Carpenter, Taylor, Verasamy). The same
    April 2026 vote moved the annual meeting to March from 2027; the board
    page''s April term-end labels are minted as published.'
  retrieved: '2026-10-22'
