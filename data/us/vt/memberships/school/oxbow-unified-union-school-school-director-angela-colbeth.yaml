- url: https://resources.finalsite.net/images/v1777899233/oesuorg/qsval9rm2z2up7ghranq/OUUSD2026AnnualMeetingMinutes.pdf
  note: 'Oxbow UUSD Annual Meeting Minutes, April 28, 2026 (official; the
    district''s own posted record, marked draft until approved): Article 5
    elects "two school directors of said District, one (1) to represent the
    Town of Bradford for a three-year term to expire 2029 and one (1) to
    represent the Town of Newbury for a three-year term to expire 2029" --
    Tim Ross (Newbury) and Angela Colbeth (Bradford) elected unanimously by
    voice vote. The board is six directors (three representing Bradford,
    three Newbury) elected by the whole district electorate at the single
    annual meeting -- modified at-large.'
  retrieved: '2026-10-22'
- url: https://www.oesu.org/fs/pages/714
  note: 'Orange East SU Oxbow board page (official): five members with towns
    and terms -- Ballou (Bradford) 2024-2027, Cottrell (Newbury) 2024-2027,
    Corti (Newbury, Chair) 2025-2028, Hatch (Bradford) 2025-2028, Colbeth
    (Bradford) 2026-2029. All six directors (incl. Tim Ross) signed the
    district''s June 16, 2026 revote warning. The page OMITS Tim Ross
    (Newbury, elected April 28, 2026 to expire 2029 per the annual meeting
    minutes); the omission reads as a stale page, disclosed on his
    membership.'
  retrieved: '2026-10-22'
