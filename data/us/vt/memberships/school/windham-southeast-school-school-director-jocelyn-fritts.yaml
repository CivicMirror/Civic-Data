  note: 'WSESD Members page (official, fetched 2026-10-22): Stanford
    (Dummerston, Chair) exp. Mar. 2028; Price (Brattleboro, Vice Chair)
    2029; Schibley (Brattleboro, Clerk) 2028; Beekman (Putney) 2027; McAdoo
    (Putney) 2029; Fritts (Guilford) 2028; Smith (Dummerston) 2029; Remer
    (Guilford) 2027; Savage (Brattleboro) 2027 -- and Leavy (Brattleboro)
    exp. 2027, HELD (below). Structure: the Articles of Agreement (as
    amended Nov. 19, 2019), Art. 11 -- ten members, Brattleboro 4 /
    Dummerston 2 / Guilford 2 / Putney 2, 3-year terms; Art. 10(A)/(C) --
    town-allocated seats "elected ... by a vote of the electorate of the
    entire New Union District" with ballots combined district-wide (modified
    at-large, the Articles'' "Hybrid Model"); the official Jan. 27, 2026
    Election Warning set three 3-year seats (Brattleboro, Dummerston,
    Putney) for Australian ballot on Town Meeting Day. HELD: Rich Leavy --
    he holds the Brattleboro seat Tim Maciel vacated mid-2026 at Maciel''s
    March 2027 expiry; the district announced the vacancy and sought
    applicants, but the board minutes recording an appointment vote were not
    fetched (a mid-term seat change with the predecessor''s term still
    running) -- resolving document: the WSESD board minutes, spring-fall
    2026. Tim Maciel: a member through the March 17, 2026 annual meeting
    minutes, absent from the current page -- ended 2026. Jessica Everlith
    (Dummerston): the district''s vacancy announcement described an
    appointment serving until a March 4, 2025 election "to complete the
    remainder of the term, which is through March 2026"; she serves as a
    member from May 2025, signed the Jan. 2026 warning, and was thanked for
    her service March 17, 2026 -- minted ELECTED ended 2026 under the
    appointment-to-election pattern (her post-March-2025 service can only
    rest on the remainder election); the appointment vote and the 2025
    return were not fetched. Two student representatives on the page are
    excluded.'
