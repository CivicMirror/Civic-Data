  note: 'Peacham SD board members page (official, fetched 2026-10-22):
    Hibbert (Chair) expires 2027; Clough (Vice Chair) 2027; Maclean 2028;
    Dedam 2028; Devine (Clerk) 2029. The board has five directors (section
    423 as expanded under 423(b); the expansion vote itself was not
    fetched). The Town of Peacham''s school-board page is STALE (it lists
    Diana Senturia in Dedam''s seat and Clough as chair, while the
    district''s Oct. 5, 2026 minutes show Hibbert chairing) -- the district
    page governs. Resolving documents for the Dedam flag: the Peacham School
    Meeting Minutes 2026 and any spring-fall 2026 appointment minutes (both
    town-posted PDFs failed text extraction this session).'
