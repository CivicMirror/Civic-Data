  note: 'Caledonia Cooperative board minutes, April 11, 2024 (APPROVED; the
    reorganization meeting nine days after the April 2, 2024 annual
    meeting): Daniel Gingue sits as a Waterford director and is elected the
    board''s Vice-Chair, and no appointment to his seat is recorded, in a
    district whose minutes do record appointments (cf. Marciel Greene, May
    11, 2026). The 2024 Annual Report shows his prior term expiring in 2024
    and its warning (Article 5) warned a Waterford director for a three-year
    term at that meeting. Supt. Matt Foster (CCSU) confirmed on 2026-10-26
    that Gingue is currently serving. DISCLOSURE: the certified April 2,
    2024 vote totals are printed only in the district''s 2024-25 Annual
    Report, whose sole web copy is unreachable (the district''s legacy file
    handler returns 404 for every link and the Wayback Machine holds no
    snapshot), so the tally itself was not read firsthand; a delegated read
    of that report shows Gingue re-elected with counted votes. Minted
    ELECTED on the convergent official record (warning + reorganization
    seating + successive official rosters + superintendent confirmation)
    under Walter''s ruling of 2026-10-26.'
  retrieved: '2026-10-26'
