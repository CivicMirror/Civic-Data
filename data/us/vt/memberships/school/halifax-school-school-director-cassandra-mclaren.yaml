  note: 'Halifax School Board page (Windham Southwest SU, official), terms
    verbatim: Paul Blais (Chair, 3-year term expires 2029), Wade Ryan (Vice
    Chair, expires 2028), Cassandra McLaren (Clerk, expires 2028). The same
    three reorganize the board in the March 11, 2026 minutes and sit in the
    June 17, 2026 minutes. The board is the section 423(a) default three
    directors at-large; the district''s January 23, 2025 warning put two
    seats up together (the stagger), won by Ryan and McLaren.'
