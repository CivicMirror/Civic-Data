  note: 'Wolcott Town School District 2026 Annual Meeting Materials
    (official annual report, via OSSU): p. 2 publishes the board with term
    ends -- Waring 2027, Morin 2026, LaChance 2027, Davey 2026, Kaiser 2028
    (board size five documented three times in the volume; the section
    423(b) vote adding two seats is not itself in a fetched document); the
    2026 warning (pp. 3-4) Art. 2 puts up exactly one 3-year and one 2-year
    seat -- the two seats expiring 2026; the certified March 4, 2025 minutes
    (pp. 22-24) record Davey elected 1-year, LaChance 2-year, Kaiser 3-year,
    matching the table. Post-election currency: the OSSU superintendent''s
    spring 2026 newsletter lists the same five after the March 3, 2026
    meeting ("everyone returned"). RESOLVED 2026-10-29: the March 3, 2026
    annual meeting minutes (Minutes of the Annual Town School District
    Meeting for the Town of Wolcott, Art. 2), supplied by Town Clerk Belinda
    Harris Clegg by email on 2026-10-28 and read firsthand, record Sheena
    Davey elected School Director for a term of three years and Melissa
    Morin elected School Director for a two year term, each by voice vote —
    Davey end 2029, Morin end 2028, both now set.'
