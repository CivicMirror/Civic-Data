  note: 'Mountain View Union Elementary School District Annual Report 2026
    (official, Orleans Southwest SU): the pre-meeting board table (board as
    published January 2026) lists Samantha Friend (Chair) 2026, Terri Vest
    (Vice Chair) 2027, Darren Usinowicz (Clerk) 2026, Kyle Anderson 2028,
    Laura Cannon 2026, Simon Cohen 2026, Adam Gann 2026, Heather Meacham
    2027, Meghan Shatney 2026, Juliana Swank 2026. The 2026 warning (Article
    2) elects directors FROM THE FLOOR at the February 24, 2026 annual
    meeting: Greensboro 1x 3-year + 1x 1-year-remaining, Hardwick 2x 3-year
    + 1x 1-year-remaining, Stannard 1x 3-year, Woodbury 1x 3-year (seven
    seats). The same report''s February 25, 2025 annual-meeting minutes
    record: Kyle Anderson (Hardwick, 3-year) ELECTED 49-7; Meghan Shatney
    (Hardwick, 1-year-remaining) ELECTED 30-16-12; Simon Cohen (Stannard,
    1-year-remaining) ELECTED unanimously; Heather Meacham (Woodbury,
    2-years-remaining) ELECTED 38-20.'
