  note: 'Rebecca Midthun sits as a Charleston director from the March 13,
    2024 reorganization meeting onward (NCSU board page; October 14, 2026
    minutes). Ryan Besaw, who held the third seat into early 2024, is absent
    from the February 14, 2024 minutes and no appointment motion for Midthun
    appears in any minutes from February 2024 to February 2026 -- she is
    recorded as elected at the March 5, 2024 annual meeting on that minutes
    chain. Her exact term end is UNRESOLVED (2026-remainder vs. fresh term;
    the March 2024 warning/results and a March 2026 Charleston return are
    not posted), so no term end is stated for her seat.'
