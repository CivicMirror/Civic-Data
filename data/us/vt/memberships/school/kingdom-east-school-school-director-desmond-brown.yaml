  note: 'Kingdom East UUSD official results page, ''Kingdom East FY27 Budget
    Results'' (published 2026-03-09): Article 3, March 3, 2026 Australian
    ballot -- Amy McQuade ELECTED Burke, 3-year (write-in winner, 69
    qualifying write-ins); Kurt Martin ELECTED Concord, 3-year (write-in,
    59); Desmond Brown ELECTED Lunenburg, 3-year (785 yes); Lawrence Golden
    ELECTED Lyndon, 3-year (959 yes); Steve Smith ELECTED Lyndon, 2-year
    (867 yes); Bill Coleman ELECTED Newark, 3-year (852 yes); John W. Simons
    ELECTED Sheffield, 2-year (813 yes). The warned Lunenburg 1-year and
    Lyndon 1-year seats went UNFILLED (no write-in reached the 30-vote
    minimum) and remain vacant. The page''s article header says ''Ten (10)
    school directors'' but enumerates nine contests; the 2026 warning
    (revised 2/3/26, in the 2026 Annual Report) warns nine -- nine governs.'
  retrieved: '2026-10-28'
- url: https://irp.cdn-website.com/6417ac47/files/uploaded/2026+KESD+Annual+Report-Final.pdf
  note: 'Kingdom East UUSD 2026 Annual Report (official): the Board
    Directory (p. 2, the pre-election roster) lists fifteen seats with towns
    and term expirations -- Burke: Alyssa May 2028, Abigail Montgomery 2026;
    Concord: Patricia Shine 2027, Kurt Martin (Appointed 2025) 2026;
    Lunenburg: Desmond Brown (Appointed 2025) 2027, James Peyton 2026;
    Lyndon: Lindsay Carpenter 2028, Larry Golden (Appointed 2025) 2027, Chad
    Simpson 2026, Steve Smith (Appointed 2025) 2028; Newark: seat vacant,
    expiring 2026; Sheffield: April Brown (Appointed 2025) 2028; Sutton:
    Candace Houghton 2028, Jake Simpson 2027; Wheelock: Norma Twombley 2027.
    Members the directory does NOT mark ''(Appointed)'' are carried as
    ELECTED. The same report''s 2026 warning (pp. 31-32, revised 2/3/26)
    warns nine seats, matching the nine contests in the district''s results.
    Carpenter signs the warning as Chair (Feb. 3, 2026) and the Board Report
    letter as School Board Chair.'
  retrieved: '2026-10-28'
