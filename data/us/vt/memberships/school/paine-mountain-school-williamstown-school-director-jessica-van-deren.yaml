  note: 'Paine Mountain SD board page (official; footer "updated 10.5.26"):
    seven seats -- Northfield 4, Williamstown 3 -- with holders and terms:
    Van Deren (Williamstown, Chair) Mar 2024-2027; Path (Northfield)
    2024-2027; one Northfield seat labeled VACANT (2024-2027 cohort); Morris
    (Northfield, Vice Chair) 2025-2028; Duke (Williamstown) 2025-2028;
    Macijeski (Northfield, Clerk) 2026-2029; Dwinell (Williamstown)
    2026-2029. Election model is proportional (town-only electorates):
    Williamstown''s signed Jan. 21, 2026 warning elects "Two (2)
    Williamstown School Directors each for a Three (3) Year Term" by
    Australian ballot in Williamstown; Northfield''s 2025 warning mirrors
    it. FLAG (carried, not smoothed): the warnings seat three directors per
    year but the page''s 2025 and 2026 cohorts hold only two each -- one
    winner per year is unaccounted for (prime candidate: Horace Duke, whose
    published 2025-2028 span would be 2026-2029 if he was the second 2026
    Williamstown winner). Resolving documents: the Williamstown School
    Meeting Minutes of March 3, 2026 (town-posted, unscanned-text fetch
    failed), the Northfield 2026 minutes, and the district''s March 2026
    reorganization minutes.'
