  note: 'Troy School Board minutes, Oct. 13, 2026 (official, via the NCSU
    Troy board page): "GASTON made a MOTION to the TES School Board Appoint,
    Ali Carpenter and Holly Wyllie to the School Board to fill two
    vacancies. - Approved, All in Favor" (appointment authority: 16 V.S.A.
    section 424). The current roster (NCSU page, 2026-2027 section) is
    Bathalon (Chair), Pepin (Vice Chair), Campbell-Morin, Carpenter, Wyllie.
    Documented chain: the March 10, 2026 reorganization seated Bathalon,
    Holly Pepin, Campbell-Morin, Damon and Phillips after the March 3, 2026
    annual meeting (Pepin and Campbell-Morin first appear there, replacing
    Amanda Pepin and Allyson Bathalon -- minted ELECTED off the post-
    election board, the confirming annual-meeting minutes not fetched);
    Damon and Phillips resigned in June 2026 (June 9, 2026 minutes); the
    board sat at three through September. Robert Langlands was appointed
    Sept. 23, 2026 but appears in NO later record and the Oct. 13 minutes
    still describe "two vacancies" -- he is NOT minted (no evidence he ever
    served). NO term ends are published for any Troy director in any fetched
    source. Same people: Bathalon is the Troy selectboard record; Wyllie is
    the Troy justice of the peace record.'
