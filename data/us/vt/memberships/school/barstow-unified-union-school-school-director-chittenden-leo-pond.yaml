  note: 'Barstow Unified Union School District board page (Rutland Northeast
    Supervisory Union, official): ''School Board Officers'' -- Tony Roberts
    (At-Large - Chittenden, 2027, Chair); Justine Calnan Cavacas
    (Chittenden, 2027, Clerk); Deborah Singiser (At-Large - Chittenden,
    2029); Leo Pond (Chittenden, 2028); Gregory Smith (Mendon, 2028). The
    board is five directors -- Chittenden 2, Mendon 1, At-Large 2 -- the
    town seats elected by that town''s voters only and the at-large seats by
    both towns, per the district''s formation articles as amended November
    6, 2018 (second at-large seat added). Corroborated by the board''s
    October 5, 2026 special-meeting minutes (Roberts, Singiser, Pond and
    Cavacas present) and, for Cavacas and Singiser, by RNESU''s official
    March 4, 2026 results post naming them elected on March 3, 2026.'
