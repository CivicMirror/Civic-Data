  note: 'Elmore-Morristown UUSD board page (Lamoille South SU, official):
    five directors -- David Bickford (Chair, Morristown resident, term
    expires 2028), Ann Marie Dryden (Elmore, 2028), David McAllister (Clerk,
    Morristown, 2027), Richard Shanley (Morristown, 2029), Peggy Sprague
    (Elmore-or-Morristown seat, 2027). The board sits at five since the
    voters'' 2023 expansion from four (the seat Sprague won March 5, 2024).
    All seats are elected DISTRICT-WIDE (modified at-large, 16 V.S.A.
    section 730(a)(2)) -- proven arithmetically by the certified March 4,
    2025 results: Dryden drew 1,336 votes for the Elmore-resident seat on
    only 257 Elmore ballots. Shanley''s 2026 re-election rests on the 2026
    warning + the board page''s 2029 expiry + his 2026 minutes service; no
    certified 2026 results sheet is posted. NOTE: the articles AOE hosts for
    ''Lamoille South'' are the SUPERSEDED default articles of the dissolved
    LSUU (6 seats incl. Stowe) -- do not use them.'
