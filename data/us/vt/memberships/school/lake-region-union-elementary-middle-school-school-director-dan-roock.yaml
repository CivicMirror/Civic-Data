  note: 'Lake Region Union Elementary-Middle School District: fourteen
    directors -- two per member area (Albany, Barton, Brownington, Glover,
    Irasburg, Westmore, and the former Orleans ISD area) -- elected by the
    whole district electorate at a single floor annual meeting with seats
    allocated by residency (16 V.S.A. section 748 modified at-large; March
    9, 2026 warning, Article 6). Only the six members whose published terms
    run past March 2026 are minted; the eight seats whose terms expired in
    2026 are HELD pending the March 9, 2026 annual meeting minutes and the
    March 30, 2026 reorganization minutes (per the OCSU Live Feed, the
    Albany, Westmore and Orleans seats were still unfilled after that
    meeting). Lake Region Union Elementary-Middle School District 2025-2026
    Annual Report (official, via OCSU): board roster with "TERM EXPIRES" as
    published -- Albany: Neil Urie 2026, Dan Roock 2027; Barton: Freddi Very
    2028, Jessica Torrence* 2026; Brownington: Debbie Brunelle 2027, Amber
    Hastings* 2026; Glover: Krista Mayer 2026, Sarah Elliott 2027; Irasburg:
    Tiffany Ovitt 2028, Brian Arant* 2026; Orleans: Samantha Johnson* 2026,
    Matthew Lapham* 2026; Westmore: Megan Valley 2027, Kalli Lafebvre 2026
    (*appointed for 2025-2026). Its warning for the March 9, 2026 annual
    meeting (Article 6) elects eight directors by residency seat from the
    district''s legal voters at a single floor meeting.'
  retrieved: '2026-10-22'
- url: https://core-docs.s3.us-east-1.amazonaws.com/documents/asset/uploaded_file/3488/OCSU/5302260/2024-2025_Lake_Region_Union_Elementary-Middle_School_Annual_Report.pdf
  note: 'LRUEMSD 2024-2025 Annual Report (official): the prior-year roster
    corroborates the 2025 elections -- Very re-elected to 2028, Ovitt
    (appointed for 2024-2025) elected to 2028, and the vacant Glover seat
    filled by Sarah Elliott to 2027 per the 2025 warning''s Glover two-year
    term; the OCSU Live Feed confirms the Albany, Westmore and Orleans seats
    were left unfilled at the March 9, 2026 meeting.'
