  note: 'Craftsbury School Board roster sheet (district''s own, linked from
    the Orleans Southwest SU board page): five directors -- Kasey Allen
    (Chair, 2-year seat, term end 2027), Cedar Hannan (Vice Chair, 3-year,
    2029), Isaac Jacobs (3-year, 2027), Michelle Menard (Clerk, 2-year,
    2028), Anna Schulz (3-year, 2028) -- the section 423(a)-(b) shape (three
    3-year seats, two 2-year seats), elected at-large. The same five are
    present in the September 9 and October 14, 2026 board minutes, and the
    superintendent''s April 2026 newsletter states ''everyone returned'' at
    the March 3, 2026 election. (The town report''s officers table once
    prints ''Cedrus Hannan'' -- a typo; district sources uniformly read
    Cedar Hannan.)'
