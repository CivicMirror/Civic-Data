  note: 'Fletcher School Board page (Franklin West SU, official): five
    directors -- Jess Graff (Chair), David Clark, Stephanie Sheldon-Purinton
    (Clerk), Allison Stafford, Morgan Lawton. The board is five directors
    at-large (16 V.S.A. section 423(a)-(b); FWSU''s official 2017
    Alternative Structure Application to the State Board of Education states
    each Franklin West district ''maintains a 5-person board of school
    directors''.) No term expirations are published in any fetched official
    source (the missing document is the Fletcher FY27 Combined Warning /
    2026 annual meeting record), so no ends are asserted. The one documented
    appointment (a 2024 vacancy) returned its seat to election in March
    2025; there is no evidence any current member is an appointee, and all
    five are recorded elected on the district''s own roster.'
