  note: 'WSWSU TVUUSD board page (official, fetched 2026-10-22): the seven
    directors with published terms/expirations -- Corey (Chair) 2028, Larsen
    (Vice Chair) 2028, Hartnett (Clerk) 2027, Kingsley 2027, Dornburgh 2027,
    Bullock 2029, Haeckel (1-year term) 2027 -- the same seven who signed
    the FY27 warning (Jan. 21, 2026) and attended the March 18, 2026
    reorganization (no turnover at the March 3, 2026 election). Election
    mechanics: the FY27 warning''s Article V elects 3 directors for 3-year
    terms by Australian ballot; the district''s March 4, 2025 Certificate of
    Votes refers director results to the two towns'' own returns ("See Town
    of Wilmington and Town of Whitingham results") -- per-town tallying
    consistent with the proportional model. FLAGS: (1) the per-town seat
    allocation (news reports Whitingham 3, implying Wilmington 4) and each
    member''s town are established by no fetched official source -- the
    Articles of Agreement are the resolving document, so the board is
    modeled as ONE post; (2) Haeckel''s 1-year term: the FY27 warning warned
    only 3-year seats, and whether he was elected in March 2026 to a 1-year
    remainder (the pattern the 2025 certificate documents) or appointed is
    unestablished -- minted ELECTED off the current roster with this flag;
    the towns'' March 3, 2026 returns resolve both flags.'
