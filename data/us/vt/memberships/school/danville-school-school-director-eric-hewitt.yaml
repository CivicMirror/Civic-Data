  note: 'Danville School District board members page (official): five
    directors -- Clayton Cargill (Chair, term expires 2027), David Towle
    (Vice-Chair, 2027), Tim Sanborn (2027), Eric Hewitt (2028), Kay Freedy
    (2029). The March 3, 2026 annual meeting minutes elect Freedy (3-year
    seat) and Sanborn and Cargill (the two section 423(b) one-year seats) by
    voice vote; Towle and Hewitt are continuous incumbents on the section
    423 stagger whose current-term election minutes (March 2024 / March
    2025) were not fetched -- no appointment document exists for either in
    any fetched record. The board is five directors at-large (16 V.S.A.
    section 423(a)-(b)).'
