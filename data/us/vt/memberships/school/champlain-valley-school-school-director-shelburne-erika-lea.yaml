  note: 'The district''s twelve seats are allocated by town and elected by
    each town''s voters only (Charlotte 2, Hinesburg 2, Shelburne 3, St.
    George 1, Williston 4), per the CSSU study committee''s own presentation
    (''12-Member Board. Board members elected by town based on 2010
    census'') and confirmed by the Town of Hinesburg''s March 3, 2026
    warning, whose ballot carries only Hinesburg''s own ''Champlain Valley
    School District Director for a term of 3 years''. The verbatim 2016
    articles of agreement were not retrieved; the composition sources agree.'
