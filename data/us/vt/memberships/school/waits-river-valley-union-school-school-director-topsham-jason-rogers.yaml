  note: 'OESU Waits River Valley board page (official, fetched 2026-10-22)
    and the district''s 2025-2026 Annual Report officers list -- the two
    newest rosters agree: Aebi (Corinth) 2026-2029, Tkac (Corinth)
    2025-2028, Emerson (Topsham, Chair) 2025-2028, Rogers (Topsham)
    2026-2029, Thurston (Topsham) 2025-2027. Model (town-only electorates):
    Topsham''s March 5, 2024 town meeting minutes (Art. 8) elect a Waits
    River Valley director by floor nomination for a 3-year term; the
    district''s May annual meeting elects officers only (2025/2026 warnings,
    Art. 1). Thurston: appointed by the Topsham Selectboard March 11, 2024
    for one year after Appleton''s resignation; her current published term
    (2025-2027, both rosters) brackets an election at Topsham''s March 2025
    town meeting (minutes not fetched) -- minted ELECTED (the appointment-
    to-election pattern). HELD: Alexis Ruggles (Corinth) -- she replaced
    Goyette-Stevens between the board''s Jan. 8 and Feb. 12, 2026 meetings
    with no appointment or election in the board minutes (by district
    practice the Corinth Selectboard would appoint; its Jan.-Feb. 2026
    minutes are the resolving document), and her end conflicts (2027 OESU
    page vs. 2029 Annual Report). NOT minted: Goyette-Stevens (departed, end
    undocumented), Nancy Ertle (retired 2025), Kara Appleton (resigned March
    2024), Heather Lawler (the OESU Superintendent -- not a director). The
    3+3 allocation rests on the uniform rosters; the articles were not
    fetched.'
