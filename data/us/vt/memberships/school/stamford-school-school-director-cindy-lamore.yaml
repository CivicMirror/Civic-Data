  note: 'Windham Southwest SU Stamford Board page (official, current version
    fetched 2026-10-22) with the board''s approved March 24, 2026
    reorganization minutes: five directors -- Lamore (Chair, 2-year term,
    2027), Thomas (Vice Chair, 2-year, 2028), Rower (Clerk, 3-year, 2028),
    Desautels (3-year, 2027), Caruso (3-year, 2029). The March 2026 warning
    warned one 2-year and one 3-year seat. FLAG (seat arithmetic): the pre-
    election SU page labeled Danielle Smith''s 3-year seat "Expires 2028,"
    yet her seat was evidently the one filled in March 2026 for a fresh
    3-year term (Caruso) -- either the older page mislabeled her expiry or
    she departed mid-term; the current roster rests on two post-election
    official sources. Smith is recorded ended 2026. Stamford''s published
    structure mixes standing 2-year and 3-year seats, recorded as published.
    The vice chair is minted "Beth Thomas" (current page + 2026 minutes;
    older records render "Beth Thomas Phelps"). Resolving document for the
    arithmetic: the district''s 2026 annual-meeting return.'
