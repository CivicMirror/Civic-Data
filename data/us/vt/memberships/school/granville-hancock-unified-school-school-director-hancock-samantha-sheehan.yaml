  note: 'Granville-Hancock Unified District 2026 Annual Meeting Warning (the
    district''s own document, White River Valley SU site): the district
    elects at its May annual meeting -- Granville 1 director for a 3-year
    term, Hancock 1 for a 3-year term, Granville 1 for two years (remainder
    of a 3-year term). The board is six directors, three per town, elected
    by town-only electorates (the section 730(a)(1) pattern; AOE State Board
    Item Q-3, 2017: members ''elected by the voters of each town...
    allocated at three members each'').'
  retrieved: '2026-10-22'
- url: https://wrvsu.org/pages/2ec91ffc-bb89-4644-9398-82178a4d5a16
  note: 'Granville-Hancock board page and approved minutes (White River
    Valley SU, official): May 18, 2026 reorganization seats Peters (Chair),
    Sheehan (Vice Chair), Deering (Clerk) and Neale; Anderson seated and
    voting June 16, 2026; August 25, 2026 minutes appoint Rachel Alberico to
    the vacant Granville seat. Term expirations are from the 2026 warning''s
    signature block and the Town of Granville officials page (Peters 2027,
    Neale 2027, Deering 2028, Sheehan 2029). Which Granville seat Anderson
    won on May 12, 2026 (the 3-year seat vs. the 2-year remainder) is not
    stated in any fetched minutes -- the missing document is the May 12,
    2026 annual meeting minutes -- so Anderson and Alberico carry no term
    end.'
  retrieved: '2026-10-22'
