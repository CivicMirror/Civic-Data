- url: https://www.mrpsvt.org/members
  note: 'Montpelier Roxbury Public Schools members page (official): nine
    directors with towns and expirations -- Montpelier: Mia Moore (Chair)
    2027, Tim Duggan (Vice Chair) 2028, Scott Lewins 2027, Jake Feldman
    2028, Kristin Cantu 2029, Justin Tease 2029, Ella Yeargin 2029; Roxbury:
    Kasey Kathan (Clerk) 2027, Rhett Williams 2028.'
  retrieved: '2026-10-22'
- url: https://www.montpelier-vt.org/DocumentCenter/View/11685/MONTPELIER-VT-PROOF-030425
  note: 'City of Montpelier official ballot proof, March 4, 2025: "FOR
    SCHOOL DIRECTOR, For a Term of 3 Years, Vote for not more than TWO: TIM
    DUGGAN, JAKE FELDMAN" -- exactly the two roster members expiring 2028,
    confirming the town-only Montpelier electorate (Montpelier charter, 24
    V.S.A. App. ch. 5 section 509(a)) and the roster. The 9-seat structure
    is corroborated by the City''s director-compensation articles totaling
    $9,700 (nine directors) in FY19, FY23 and the 2025 ballot; the December
    2016 study-committee draft''s 8 seats (Montpelier 6 x 2 weighted votes +
    Roxbury 2) are a SUPERSEDED draft and were not used. FLAG: the adopted
    June 20, 2017 Articles of Agreement were not fetched verbatim, and the
    City''s March 3, 2026 results were not fetched (the 2029 expirations
    rest on the district page).'
  retrieved: '2026-10-22'
