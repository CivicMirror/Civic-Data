  note: 'Fairfax board meeting summaries (official): the March 9, 2026
    summary records two open seats after the March 3, 2026 election (the
    3-year race and the 1-year-remainder race were write-in only and seated
    no winner) and that ''Two new members will be appointed at the April
    meeting.'' Ed Nasta and Danielle Rothy are the two members added to the
    board page after that date and are recorded APPOINTED. The April 2026
    meeting minutes naming them and assigning the seats (one holds the
    3-year seat to 2029, the other the 1-year remainder to 2027) were not
    posted -- the assignment is UNRESOLVED and no term is asserted for
    either.'
