  note: 'Mountain View UESD Annual Report 2026 (official, OSSU): the
    February 25, 2025 minutes elect Simon Cohen (Stannard) to a 1-year-
    remaining term (ending 2026), and the 2026 warning puts exactly ONE
    Stannard seat -- a 3-year term -- to the February 24, 2026 floor
    election. Cohen is Stannard''s only member and is on the post-meeting
    board (superintendent''s April 2026 letter), so he was re-elected to
    that 3-year seat, end ''2029'' (derived from this seat arithmetic and
    disclosed as such). He is the Simon Cohen of the existing Stannard Town
    School District record (same town, same supervisory union).'
  retrieved: '2026-10-27'
