  note: 'Windsor Southeast SU, Mount Ascutney School Board page (official;
    rendered page verified 2026-10-26): lists Amy McMullen as a member, term
    year 2027. Minted AS SHOWN per Walter''s ruling, 2026-10-26, with this
    conflict disclosed: Vermont Standard news reports (March-April 2026;
    news, not an official source) say McMullen was re-elected to a three-
    year term on March 3, 2026 (def. Kaitlyn Gould; recount 255-222) and
    then resigned the board (and her Windsor town clerk and district clerk
    posts), with the board interviewing candidates (Gould, Megan M. Reed,
    May Paquin) for an appointment to her seat -- a March 2026 election
    would ordinarily run to 2029, not 2027, and a resignation would
    ordinarily end the membership. The district''s current official roster
    nevertheless lists her as a sitting member with a 2027 year; the
    board''s March-May 2026 minutes would settle it. IDENTITY: same person
    as the Town of Windsor justice of the peace record -- a Windsor resident
    (the district''s 2021 Annual Report lists her as a Windsor member and
    its chair). Page supplied by Laurie Brown, WSESU, in reply to a
    CivicMirror records request, 2026-10-26.'
  retrieved: '2026-10-26'
