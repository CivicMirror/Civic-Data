    to a 2-year term (2,594, end 2028); Michelle Boyer to "2 Years Remaining
    on a 3 Year Term" (2,676, end 2028) -- her remainder-term seat documents
    a mid-term vacancy in the March-2025 cohort (the departed holder and any
    interim appointment are unidentified in fetched sources). The other four
    directors (Abshere, Chair; Lawrence, Vice Chair/Clerk; Chittenden;
    Galvez) are established by the board''s Oct. 7, 2026 minutes (full board
    acting; the two extra "present" names are non-voting student
    representatives) -- their term ends rest on the city clerk''s certified
    March 4, 2025 return, which was not fetched, so NO ends are minted for
    them. Charter: the board was expanded from five to seven by the voters
    on March 5, 2024 (3,815-977; H.886), all elected at large. FLAGS:
    Chelsea Tillinghast (elected 2024, term to 2027) is off the board with
    no resignation/appointment document fetched -- no record is minted for
    her; Hoffman and Boyer appear in July 2025 minutes before their March
    2026 elections, consistent with undocumented vacancy appointments --
    their current seats rest on the certified 2026 returns.'
