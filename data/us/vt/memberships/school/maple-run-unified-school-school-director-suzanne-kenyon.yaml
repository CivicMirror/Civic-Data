  note: 'Maple Run USD: ten directors, residency allocated St. Albans City 4
    / St. Albans Town 4 / Fairfield 2, elected at large by the whole
    district electorate (16 V.S.A. section 730(a)(2) modified at-large; the
    district''s warnings say so verbatim). The Articles of Agreement were
    not fetched verbatim -- the model rests on two consecutive official
    warnings plus the board page (three concordant official sources; a
    voter-formed district, no default-articles trap). Maple Run USD Warning
    for the March 3, 2026 annual meeting (official), Article I: "To elect,
    at large, by the legal voters of the Maple Run Unified School District,
    two (2) Directors from St. Albans Town for a three (3) year term. To
    elect, at large, by the legal voters of the Maple Run Unified School
    District, one (1) Director from St. Albans City for a three (3) year
    term." The March 4, 2025 warning is identical in form (Fairfield, Town,
    City).'
  retrieved: '2026-10-22'
- url: https://www.maplerun.org/page/board-of-directors
  note: 'Maple Run USD Board of Directors page (official): all ten members
    with "Represents" town and "Current Term Expires" -- City: Gonnella-
    French 2027, Brooks 2028, Gunderson 2027, Kenyon 2029; Town: Frost 2027,
    Palczewski 2028, McCarthy 2029, Williamson 2029; Fairfield: Jerose 2028,
    Dubie 2027. The expirations reconcile seat-for-seat with the 2025 and
    2026 warnings.'
