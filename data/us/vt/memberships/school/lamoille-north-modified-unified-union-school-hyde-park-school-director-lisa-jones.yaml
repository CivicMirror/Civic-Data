- url: https://resources.finalsite.net/images/v1770388071/lnsuorg/c9dcrhigjjx4a1x9q0lo/LNMUUSD2026AnnualReport.pdf
  note: 'LNMUUSD 2026 Annual Report (official): "Board of Directors & Terms"
    table -- 19 seats apportioned Belvidere 1, Cambridge 6, Eden 2, Hyde
    Park 4, Johnson 5, Waterville 1, with a term-end year for each member
    (pre-election). The FY27 warning (same district) warns no director seats
    -- directors are elected on the member towns'' own ballots; its budget
    ballots are commingled district-wide, yet the March 9, 2026 minutes
    speak of "three open Johnson board seats," proving the seats are town
    seats on town ballots (16 V.S.A. section 730(a)(1) pattern). The
    Articles of Agreement were not located.'
  retrieved: '2026-10-22'
- url: https://resources.finalsite.net/images/v1773771818/lnsuorg/l91zzu0jyi167hi3lh49/LNSU-LNMUUSDBoardMeetingMinutes03-9-2026.pdf
  note: 'LNMUUSD board minutes, March 9, 2026 reorganization (official):
    members present by town, and the appointment of Liz Kauffman to one of
    the three open Johnson seats (motion passed unanimously). The April 13,
    2026 minutes list Elizabeth Aloisio and Scott Meyer as Johnson members
    (appointments between March 9 and April 13; the appointment minutes were
    not posted). The December 8, 2025 minutes record Tiffany Cochran
    appointed to the open Eden seat of the late David Whitcomb.'
  retrieved: '2026-10-22'
