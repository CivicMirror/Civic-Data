  note: 'RSUD Warning for May 6, 2026 (official warning text, district legal
    notice): Art. 11 warns one Rochester 3-year seat, one Stockbridge 3-year
    seat, and "Stockbridge 1 director for the remainder of a one (1) year
    term" -- town-only electorates under the March 2021 articles amendment
    (the 2017 articles as adopted, AOE State Board Item P-1, set 3 Rochester
    + 3 Stockbridge residency seats elected district-wide; the signed May 7,
    2024 warning, Art. 12, runs the same town-separate form).'
  retrieved: '2026-10-22'
- url: https://stockbridgevt.gov
  note: 'Town of Stockbridge Annual Report 2025 (official), "2025 Town
    Officials - Elected," Term Through column: Wildt 2027, Meagher 2026,
    Bebo-Long 2027 (Rochester); Edgerton 2026, Budukiewicz 2027, Bessett
    2027 (Stockbridge). The column CONFLICTS with the articles'' one-seat-
    per-town-per-year stagger (two Rochester seats at 2027, none at 2028):
    only Wildt''s 2027 is independently corroborated (re-elected May 2024),
    so Bebo-Long and Budukiewicz are minted with NO ends and the conflict
    flagged rather than smoothed. HELD: Edgerton and Meagher -- their
    published terms expired at the May 6, 2026 election and the certified
    returns were not fetched. Patrick Hudson (Stockbridge) was re-elected in
    May 2024 to 2027 and is gone by March 2026; his seat is the one warned
    for its 1-year remainder in May 2026 (his departure year is not tightly
    bracketed, so no ended record is minted).'
  retrieved: '2026-10-22'
