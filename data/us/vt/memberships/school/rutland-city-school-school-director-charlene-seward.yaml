  note: 'Rutland City Board of School Commissioners reorganization minutes,
    March 17, 2026 (official): the Mayor administered the oath to four
    ELECTED commissioners for three-year terms -- Brandi Barclay, Courtney
    Collins Whitcomb, Herbert Ogden, Jennifer Rondinone (terms to March
    2029); continuing members with published terms (FY2025 City Annual
    Report): Bossi 2028, Lennox-Levins 2028, Seward 2027, Stoodley 2027,
    Sweet 2027. Item C: the Mayor recommended Ryan Carney and Cathy Solsaa
    "to fill the two vacant school board seats for a term ending March 2027"
    under charter section 30.2; the April 14, 2026 agenda carries the
    section 30.2 vote and oath (both "Term Expires 3/2027"), and both sit in
    the May 2026 minutes -- the appointments took effect. Dena Goldberg and
    Lauren Weiss finished their terms in March 2026 (March 10, 2026
    minutes); the minutes'' "stepping in when needed" phrasing indicates
    they were themselves earlier section 30.2 appointees -- their seating
    documentation was not fetched and no ended records are minted for them.'
