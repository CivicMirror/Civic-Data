  note: 'Mountain View UESD Annual Report 2026 (official, OSSU): the
    February 25, 2025 minutes elect Meghan Shatney (Hardwick; spelled
    ''Megan Shatney'' in the motion, ''Meghan'' in the board table) to a
    1-year-remaining term ending 2026, and the superintendent''s April 2026
    letter lists her on the post-meeting board (''everyone returned''), so
    she was re-elected on February 24, 2026; which Hardwick seat length she
    took is unpublished, so her end is HELD.'
  retrieved: '2026-10-27'
