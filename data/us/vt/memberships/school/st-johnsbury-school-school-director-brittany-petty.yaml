  note: '2025 Town of St. Johnsbury Annual Report (official), pp. 65-66: the
    March 3, 2026 warning elects three directors -- one for 3 years, one for
    2 years, one for "the remaining 1 year of a 3 year term" -- and the
    Elected Officials list publishes Petty 2027 and Stavseth 2028 (neither
    on the 2026 ballot). The district''s official results post (stjsd.org,
    Mar. 5, 2026) names the winners: "Three-Year Term: Abigail Campbell;
    Two-Year Term: Colleen Morris; One-Year Term: Joseph Achilles." The
    January 2026 warning''s signature block names the same five as the
    current board page -- NO turnover at the 2026 election. The warned
    remainder-length terms imply a prior vacancy-appointment history for the
    Morris/Achilles seats, undocumented in fetched sources (resolving
    documents: 2024-2025 board minutes); both now hold elected seats. (The
    report''s jumbled two-column extraction places the names Turek and Fox
    adjacent to the directors list -- neither signed the warning nor appears
    on the board page; neither is treated as a director. VSBA''s "Campbell
    ends 2028" is stale against the district''s own 2026 results.)'
