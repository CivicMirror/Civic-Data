    11: 15 members, 3 per town; Art. 10(A)/11: seats allocated per town but
    "voted on by the entire electorate" with comingled votes -- modified at-
    large (the articles'' "Hybrid Model"). The district''s March 12, 2026
    committee-assignments memo corroborates 13 of the 15 at the
