  note: 'Mount Ascutney SD: six directors, residency allocated Windsor 3 /
    West Windsor 3, elected by the voters of both towns (modified at-large
    "Hybrid Model"). Memberships minted 2026-10-26 (Walter''s ruling) from
    the district''s current official roster on the Windsor Southeast SU site
    -- the Mount Ascutney School Board page, supplied by the SU office
    (Laurie Brown) in reply to a records request and verified rendered
    2026-10-26: Davis McGraw (Chair) 2028, Elizabeth Burrows (Vice Chair)
    2027, Megan Reed (Clerk) 2029, Bill Yates (Treasurer) 2028, Elizabeth
    Frederick 2029, Amy McMullen 2027 -- all ELECTED with the term years as
    shown. The March 13, 2023 board agenda fetched earlier (Burrows,
    McMullen, McGraw, Roisman, Yates, Pedrick) is superseded (Roisman and
    Pedrick have since left the board); Bill Yates is independently
    corroborated as current by a 2026 official document (Act 170 committee
    minutes, October 14, 2026). Conflicts from news leads are disclosed on
    the McMullen and Reed memberships. Town of West Windsor Selectboard
    minutes, May 11, 2017 (official): the Articles of Agreement discussion
    for the merger records the board design -- "3 Windsor and 3 West Windsor
    members, but they would have to be voted on by both towns" (the "Hybrid
    Model") -- the 16 V.S.A. section 730(a)(2) modified at-large pattern.
    The district''s 2021 Annual Report lists six "Mount Ascutney School
    Board Directors" (3 Windsor + 3 West Windsor by address). The adopted
    2017 Articles of Agreement themselves were not located.'
  retrieved: '2026-10-22'
