  note: 'Rockingham SD signed 2026 warning (official; approved Jan. 5,
    2026): the signature block publishes the five directors with term years
    -- Deschenes-Desmond 2027, Kibbe 2028, Holloway 2027, DeMasi 2026,
    Contee 2026. The extraction of the warning skips the director-election
    article (Art. 4). The board''s organization minutes of March 9, 2026
    (WNESU HighBond portal) record the board seated after the Feb. 28, 2026
    annual meeting: Deschenes-Desmond Chair, Contee Vice Chair, DeMasi Board
    Clerk, with Kibbe and Holloway. FLAG: DeMasi''s and Contee''s warning
    term years expired at the Feb. 28, 2026 meeting and no fetched document
    records their re-election -- they are minted off the post-election
    roster with NO ends (the Derby/Fletcher pattern); the resolving document
    is the Feb. 28, 2026 annual meeting minutes. Board size five rests on
    the uniform five-director record (the section 423(b) expansion vote was
    not fetched).'
