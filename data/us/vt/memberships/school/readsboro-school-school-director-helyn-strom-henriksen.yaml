  note: 'Readsboro SD board page (official): Florence (Chair) "3-Year Term,
    Expires 2029"; Strom-Henriksen (Vice Chair) expires 2028; Irace expires
    2027 -- the same three names and offices appear in the district''s 2026
    Annual Report. The 2026 warning''s Article I elects one director for
    three years by Australian ballot. FLAG: the certified March 3, 2026
    return naming the Article I winner was not fetched -- Florence''s 2029
    expiry on the district''s own current page is the roster evidence (the
    Milton pattern). The voters approved closing Readsboro Central School on
    March 3, 2026 (warning Arts. V-VI); the district is non-operating
    effective July 1, 2026 (the district''s own post-vote school-choice page
    corroborates; the same certified return would settle it officially).'
