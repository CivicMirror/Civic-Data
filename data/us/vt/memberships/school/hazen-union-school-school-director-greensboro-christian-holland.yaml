    Board (Hazen)'', Christian Holland is listed with a regular 3-year term
    expiring 2027 (alongside Jan Terwiesch, (3 yr) (2028)); the report''s
    Selectboard Appointments list (p. 4) does not include him. Minted
    ELECTED on this elected-officers listing (Walter''s ruling, 2026-10-25).
    No election return naming Holland was located -- Greensboro''s March 3,
    2026 warning elects town officers only -- so no exact election date or
    vote total is asserted; the regular 3-year term expiring 2027 implies
    election in the normal 2024 cycle.'
