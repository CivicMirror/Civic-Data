  note: 'Orange Southwest SD: eight directors, residency allocated Randolph
    4 / Brookfield 2 / Braintree 2, elected by Australian ballot in all
    three towns on a single district warning (modified at-large, 16 V.S.A.
    section 730(a)(2) pattern). No term ends are minted (see the flag in the
    sources). Orange Southwest SD board minutes, July 8, 2026 (official):
    "Board attending: Aimil Parmelee [Chair], Ryan Anderson, Anne Kaplan,
    Ray Zapata, Rachel Fish, Rachel Gaidys, Martha Hafner, Bev Lauchner."
    The March 11, 2026 minutes (first post-election meeting) seat the same
    eight with Zapata new and Sam Hooper gone; the January 15, 2026 warning
    is signed by the pre-election eight (incl. Hooper).'
  retrieved: '2026-10-22'
- url: https://www.ourherald.com/articles/legal-notices-112/
  note: 'OSSD Warning 2026 (official legal notice, recorded with the
    district clerk January 15, 2026): Articles VII-VIII vote by Australian
    ballot in all three towns "One School Director from the residents of
    Randolph, Vt. for a term of three years" and "One School Director from
    the residents of Brookfield, Vt. for a term of three years" -- residency
    seats, district-wide vote (modified at-large). The board is 8 seats
    (Randolph 4, Brookfield 2, Braintree 2, the formation structure). FLAG:
    the district publishes no roster with towns or expirations; cohort
    expirations (2024 winners 2027, 2025 winners 2028, 2026 winners 2029)
    follow from the warnings but the winner pairings rest on newspaper
    reporting (lead) -- so NO ends are minted. The Lauchner/Zapata residency
    pairing (Zapata to Hooper''s Brookfield seat, Lauchner re-elected to
    Randolph) is an inference, not used to split posts. Missing: the OSSD
    Articles of Agreement; the district clerk''s certified March 3, 2026
    returns.'
  retrieved: '2026-10-22'
