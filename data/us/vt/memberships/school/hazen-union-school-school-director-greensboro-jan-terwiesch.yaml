    Chair, term end 2029), Terri Vest (2029), Patrick Kane (2028), Sabrina
    Morrison (Clerk, 2027); Greensboro: Jan Terwiesch (2028), Christian
    Holland (1-year term, 2027); Woodbury: Steven Freihofner (Chair, 2029),
    Laura Murphy (2028). The same eight are listed in the August 18, 2026
    board agenda. Seats are town-allocated with TOWN-ONLY electorates (Union
    High School District No. 26, 16 V.S.A. section 748; Hardwick''s official
    2026 open-offices notice puts two Hazen 3-year seats on Hardwick''s own
    Australian ballot). Christian Holland was HELD at build time (the roster sheet''s ''1-year
    term'' gloss left his seating uncertified) and was MINTED ELECTED on
    2026-10-25 under Walter''s ruling, on Greensboro''s official 2026
    Town Report (p. 3, ''Greensboro Town Elected Officers'': listed
    under ''Union 26 School Board (Hazen)'' with a regular 3-year term
    expiring 2027; he does not appear in the report''s Selectboard
    Appointments list, p. 4), with the term-length conflict disclosed in
    his own source notes. The district''s articles of agreement were not
    fetched; the allocation rests on the roster sheet + town notices.'
