  note: 'Taconic and Green RSD Special Meeting Warning, Sept. 21, 2026
    (official; signed by the board): the current 13-member roster -- Wilson
    (Chair), Freeman (Vice Chair), Chandler (Clerk), Dale, Langsett,
    Lechthaler, Moskowitz, Ralph, Salsgiver, Thompson, Tuff, Wilde, J.
    Wilson -- and the district''s nine member towns verbatim. The election
    model and four ends are proven by the certified March 2025 results
    recorded in Weston''s town meeting minutes: four directors from any of
    the four largest towns (Danby, Dorset, Londonderry, Manchester) elected
    district-wide to 3-year terms expiring March 2028 -- Wilson (1,081),
    Chandler (1,021), Ralph (960), Moskowitz (935) -- and a Peru seat voted
    district-wide (Agneesens, 2,462 votes) for a 1-year term expiring March
    2026: modified at-large with residency-reserved seats (one per member
    town plus four reserved for residents of the four largest towns).
    Agneesens does not appear on the Sept. 2026 roster -- recorded ended
    2026. Debra Lyneis (Weston''s director through 2025) is likewise absent,
    but her departure is undocumented -- no record minted. Ends and towns
    for the other nine members are published in no fetched source (resolving
    document: the FY27 district Annual Report board table or the March 2026
    certified results). Freeman is Landgrove''s director per Landgrove''s
    March 2, 2026 town meeting minutes.'
