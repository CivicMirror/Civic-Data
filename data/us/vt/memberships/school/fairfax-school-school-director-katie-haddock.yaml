  note: 'Fairfax School Board page (official): five directors -- Emily Aiken
    (Chair), MacKenzie Geary (Clerk), Katie Haddock, Ed Nasta, Danielle
    Rothy. The board is five directors at-large (16 V.S.A. section
    423(a)-(b): three 3-year seats, two 2-year seats). Aiken was re-elected
    March 3, 2026 to the 2-year seat (sole printed candidate; the board''s
    March 9, 2026 summary confirms); Geary holds a 3-year term to 2028
    (March 10, 2025 reorganization summary); Haddock''s term runs to 2027
    (Town Report 2025 officers list).'
