  note: 'Sandgate SD FY27 warning (official, Town of Sandgate site): Article
    3 elects "one School Board Director for a three-year term by Australian
    ballot March 3, 2026"; the signature block names the board -- Celeste
    Keel (Chairperson), Eric Weissleder (Vice Chairperson), Allan Tschorn
    (Clerk) -- the same three who signed the 2024 warning. The March 3, 2026
    annual meeting minutes record all school board members in attendance but
    do not record the Article 3 ballot result. FLAG: which member''s term
    was up in 2026 and the winner are established by no fetched document
    (resolving document: the Town Clerk''s certified March 3, 2026 return);
    the three are minted with NO ends off the current roster.'
