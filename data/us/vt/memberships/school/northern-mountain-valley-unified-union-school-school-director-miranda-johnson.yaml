  note: 'Northern Mountain Valley UUSD: eight directors, residency allocated
    two per member town (Bakersfield, Berkshire, Montgomery, Sheldon),
    elected by the whole district electorate on one Australian ballot
    (modified at-large, 16 V.S.A. section 730(a)(2) pattern; the district''s
    warnings and official ballots say so in form). Term ends are minted only
    for the three March 2025 ballot winners; the five continuing members
    carry no end (none published). NMV UUSD official ballot, March 4, 2025
    (Sheldon sample ballot, official): one district ballot electing "One (1)
    school director for a three-year term, ending March 2028, who resides in
    the Town of Bakersfield" (Audrey Shea), "One (1) school director for the
    remaining two years of a three-year term, ending March 2027, who resides
    in the Town of Montgomery" (Michelle Schaap), and "One (1) school
    director for a three-year term, ending March 2028, who resides in the
    Town of Montgomery" (Mary Niles) -- residency seats, district-wide
    electorate (modified at-large). The 2024 warning (FNESU Annual Report
    2023-2024) is in the same form.'
  retrieved: '2026-10-22'
- url: https://files-backend.assets.thrillshare.com/documents/asset/uploaded_file/4341/Fnesu/338fabf2-7289-43fa-ab3a-e122abf106d1/FNESU_AnnualReport_2023-2024_Print.pdf
  note: 'FNESU Annual Report 2023-2024 (official): "NMV UUSD School
    Directors" -- Niles (Chair, Montgomery), Norris (Vice Chair, Sheldon),
    Paquette (Clerk, Bakersfield), Dziedzic (Berkshire), Barnard
    (Montgomery), Hango (Berkshire), Johnson (Sheldon), O''Rourke
    (Bakersfield) -- 8 directors, 2 per town. As updated by the 2025 ballot
    above: Shea holds the Bakersfield seat O''Rourke held, and Schaap the
    Montgomery remainder seat Barnard held. FLAG: the March 3, 2026 winners
    for the three 2026-expiring seats and the Articles of Agreement were not
    fetched (missing: the FNESU Annual Report 2025-2026; the March 3, 2026
    ballot/results). No departures are recorded for Barnard or O''Rourke --
    their exits are documented only by their seats'' re-election.'
  retrieved: '2026-10-22'
