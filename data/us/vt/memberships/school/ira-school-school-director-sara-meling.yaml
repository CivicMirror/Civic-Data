- url: https://legislature.vermont.gov/statutes/fullchapter/16/009
  note: 'Ira School District: three directors at-large under 16 V.S.A.
    section 423(a) (no section 423(b) expansion in any town record; Ira Town
    Plan: the School Board "is comprised of three people"). The district is
    non-operating -- it tuitions all grades PreK-12 with K-12 school choice
    (Ira School Board Report, Town of Ira 2022 Annual Report). 16 V.S.A.
    section 423(a): each town school district has three directors, one
    elected by ballot at each annual meeting for a three-year term. No
    section 423(b) expansion appears in any town record: every Town of Ira
    officers list from 2022 through 2025 carries exactly three School
    Director rows.'
  retrieved: '2026-10-22'
- url: https://townofira.com/town-clerk
  note: 'Town of Ira Town Clerk page (official), hosting the town officers
    lists and election results: "Town Officers, As of March 2025 Election"
    (School Directors: Philip Lapp, elected March 2025 to the balance of the
    2023 term ending 2026; Sarah Meling, "November 2024, 3 Year, 2027"; Jeff
    Barden, elected March 2025, ends 2028) and the "2026 Town & School
    Election Results" (School Director, 3-year term: Philip Lapp -- re-
    elected March 2026, term to 2029). The district is non-operating
    (PreK-12 tuition / K-12 choice), per the Ira School Board Report in the
    Town of Ira 2022 Annual Report.'
  retrieved: '2026-10-22'
