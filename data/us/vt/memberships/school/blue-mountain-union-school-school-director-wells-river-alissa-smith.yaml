  note: 'Blue Mountain Union School District board page (Orange East
    Supervisory Union, official): nine directors with towns and terms --
    Ryegate: Shawn Burroughs, James Jobin, Daniel LaCoss (Vice-Chair), Anna
    Morrison; Groton: Sasha Emerson, Megan Foy, Willis Page; Wells River:
    Kelsey Root-Winchester (Chair), Alissa Smith. The same nine sign the
    district''s March 12, 2026 budget-vote warning. Directors are elected by
    their own member towns (16 V.S.A. section 706k(a)); the member town is
    Wells River village (in Newbury), not the whole town of Newbury, per the
    district''s 2026 warning.'
