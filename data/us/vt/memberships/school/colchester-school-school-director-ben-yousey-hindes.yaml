  note: 'Colchester School District School Board Member Directory
    (official): five directors -- Lindsey Cox (Chair, 3-year term expiring
    March 2029), Nic Longo (Vice Chair, 3-year, 2028), Ben Yousey-Hindes
    (Clerk, 2-year, 2027), Laurie Kigonya (3-year, 2027), Jennifer Fath
    (2-year, 2028). The same five are in attendance in the October 6, 2026
    board minutes. The mix (three 3-year seats, two 2-year seats) is the 16
    V.S.A. section 423(a)-(b) town-district shape.'
