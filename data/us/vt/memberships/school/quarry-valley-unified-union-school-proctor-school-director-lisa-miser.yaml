- url: https://proctorvermont.com/
  note: 'Town of Proctor official site, ''2026 Election Results -- March 3,
    2026'': ''Quarry Valley School District Board Member, 3 years: Lisa
    Miser'' and ''Quarry Valley School District Board Member, 1 year:
    Vacant'' -- Proctor''s third seat (term expiring 2027; shown ''Not
    Filled'' in the Proctor Town Report 2024) was offered as a 1-year
    remainder and again went unfilled; it remains vacant. The Proctor Town
    Report 2024 lists Miser''s prior term as 3yr, elected 2023, expiring
    2026, so the 2026 result re-elects her to ''2029''.'
  retrieved: '2026-10-27'
- url: https://drive.google.com/uc?export=download&id=1BQE6BTsw812hyjCEPm7eUm-kuUjXMPWt
  note: 'QVUUSD Board minutes, September 10, 2026 (OFFICIAL; district Board
    Documents folder): the attendance list tags each member''s town
    (Moser/WR, Callahan/WR, Grabowski/WR, Miser/PR, Lohnes-Watulak/PR, P.
    Davenport/PO), and after executive session the board voted unanimously:
    ''MOTION to appoint Megan Ohl and Matthew Dingman for the two open
    Poultney seats until March 2027'' -- the seats left by Eric Hier''s July
    2026 resignation (term to 2027) and by the unfilled successor to Linda
    Smith (term expired March 2026), as defined in the August 13, 2026
    minutes. Both appointees must stand for election in March 2027.'
  retrieved: '2026-10-27'
- url: https://grcsu.org/board-information/
  note: 'GRCSU board-information page for Quarry Valley UUSD (official; the
    page Superintendent Christopher Sell pointed to in his 2026-10-26 reply
    to CivicMirror''s records request; updated 2026-10-13): current roster
    -- Michael Moser (Chair), Jessica Grabowski (Vice Chair), Sarah Lohnes-
    Watulak (Clerk), Tom Callahan, Lauren Davenport, Patricia Davenport,
    Lisa Miser, Meghan Ohl, Matthew Dingman -- nine seated of ten; the page
    publishes no towns or term ends. It spells the Poultney appointee
    ''Meghan Ohl'' where the September 10, 2026 appointment minutes spell
    ''Megan Ohl'' (the minutes govern the name form used here).'
  retrieved: '2026-10-27'
