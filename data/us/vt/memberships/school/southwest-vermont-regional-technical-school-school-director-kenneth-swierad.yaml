  note: 'SWVRTSD official 2026-27 Regional Governing Board roster (district
    document, fetched 2026-10-22): Cutler (Chair), Edelson, Johnson, Kinney,
    Orzehowski (Clerk), Randall, Sauer, Swierad (Vice-Chair), West, Wheeler,
    Williams. Under the district''s governance-plan By-Laws (Art. III
    sections 1-3) EVERY director is elected at-large by the district''s
    voters by Australian ballot for 3-year terms (the Nominations Committee
    only nominates) -- this district has NO appointed seats. Randall, Sauer
    and Wheeler''s ends are DERIVED: the Bennington town clerk''s certified
    March 3, 2026 results declare all three elected (Sauer 2,725; Randall
    2,636; Wheeler 2,520) and all terms are 3 years -- the derivation is
    stated here; the other eight members'' election years are published in
    no fetched official source (resolving documents: the district''s
    2024/2025 certified returns). HELD: a fourth seat was warned for March
    3, 2026 ("4 to be elected") but the certified return declares only three
    -- its disposition is undocumented (resolving documents: the March 2026
    warning and post-election board minutes). The By-Laws fix no board size
    (set by the unlocated Governance Planning Committee Report); seats are
    carried as the seated roster presents (11).'
