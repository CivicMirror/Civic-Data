  note: 'Newport Town School District: five directors at-large under 16
    V.S.A. section 423(a)-(b) (the section 423(b) expansion vote record
    itself was not fetched; the five-member board rests on the SU''s
    published rosters across five consecutive school years). No term
    expirations are published. North Country SU Newport Town School Board
    page (official): rosters by school year 2022-2023 through 2026-2027,
    five members every year (2026-2027: Cameron Thompson, Chair; Jill
    Raymond, Vice Chair; Dari Joi Glover, Treasurer; Heather LeBlanc; Tina
    Royer). The 2025-2026 roster has Reene Fontaine in LeBlanc''s place. No
    term expirations are published for any member.'
