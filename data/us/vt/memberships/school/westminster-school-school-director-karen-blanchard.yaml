  note: 'Town of Westminster 2025 Annual Meeting minutes (official ballot
    results): Town School Director, 3-year term -- Christine "Tine" Biolsi;
    Town School Director, 2-year term -- Margie Kearns Ferry. School
    directors are elected by Australian ballot on Town Meeting Day under
    Article 1 of the combined Town / Fire District #3 / School District
    warning (official 2026 warning: https://www.westminstervt.org/wp-
    content/uploads/2026/01/2026-Warning-for-Town-Report.pdf). FLAGS: (1)
    Cheryl Charles''s term end appears in no fetched official source
    (resolving document: the 2024 annual meeting minutes / town report
    officers list) -- minted with no end. (2) Karen Blanchard and Ron Bos-
    Lun: their March 2026 wins rest on the official sample ballot (Blanchard
    the printed candidate for the 2-year seat; the 3-year seat write-in-
    only) plus the March 5, 2026 reorganization minutes seating Bos-Lun as a
    "new board member" and both members'' continuous seating -- minted
    ELECTED with the ballot-derived ends (2028 / 2029), disclosed; the
    certified 2026 return (in the town''s 2026 Annual Meeting minutes, this
    town''s format) was not fetched. Turnover: the Oct. 2, 2025 minutes
    discuss a "School Board Opening" with an interim appointment to run
    until March 2026 after Charlie Hutchison''s 2025 death (the April 2,
    2026 agenda carries a memorial-service item); Mariah Perkins was
    appointed interim (Nov. 6, 2025 agenda; listed as a member Dec. 4, 2025)
    and resigned Jan. 8, 2026 (minutes).'
