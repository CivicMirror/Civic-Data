- url: https://www.wsdvt.org/school-board/
  note: 'Winooski SD School Board page (official, re-verified 2026-10-22):
    Livermore (Secretary) "(Interim/3 Year Term Expires: 3/2027)" -- the
    district''s own page labels her Interim under the charter''s vacancy
    appointment power (16 V.S.A. App. ch. 23 section 23-2). She took Isaiah
    Donaldson''s seat mid-term in fall 2025 (he is listed in the October
    2025 newsletter; she attends from Nov. 12, 2025).'
  retrieved: '2026-10-22'
- url: https://www.wsdvt.org/wp-content/uploads/2025/10/Special-Board-Meeting-Minutes-9-29-2025.pdf
  note: 'Minutes of the Winooski School Board of Trustees special meeting,
    Monday, September 29, 2025 (district-posted PDF; the district''s board-
    minutes index labels the document "(Unofficial)"): under item 9
    (Appointment of Trustee) the board entered executive session at 6:56 pm
    to deliberate appointing a board member to fill the vacancy, returned at
    7:27 pm, and Robert Millar moved "that we appointment Katie Livermore on
    the board." The minutes do not separately record the vote on the motion;
    Erik Johnson (WSD District Office Manager) confirmed by email on
    2026-10-29 that a vote was taken at that meeting with regard to
    appointing Kate Livermore. Recorded per Walter''s ruling of 2026-10-29
    (unofficial-labeled minutes accepted -- the Jay/Whitaker precedent),
    with the label and the unrecorded vote disclosed here. Her start is the
    appointment date, 2025-09-29.'
  retrieved: '2026-10-29'
