  note: 'Springfield Official Returns of Votes (official): March 3, 2026 --
    "SCHOOL DIRECTOR - 3 YEARS": Steve Geller elected (560 votes) over
    Boynton (236) and Stern (373); March 4, 2025 -- Jessica Austin (974) and
    Denise Hunter (970) elected. Town-district directors serve statutory
    3-year terms (the 2026 ballot prints the term), so Austin''s and
    Hunter''s ends are 2028 (election + the ballot''s term, as derived in
    the research). Current roster per the March 4, 2026 reorganization
    minutes and the 2026-27 Elm Hill handbook: Palmer (Chair), Karaffa (Vice
    Chair), Hunter (Clerk), Austin, Geller. Palmer''s and Karaffa''s term
    ends are published in NO fetched source (a district board-bios flipbook
    stating "2024-2027" surfaced only as a search snippet -- a lead, not
    used); resolving document: the March 5, 2024 Official Return. Jessica
    Cady-Burlew sat through Feb. 9, 2026, was not on the March ballot, and
    Geller took the seat -- recorded ended 2026 (a regular election
    transition).'
