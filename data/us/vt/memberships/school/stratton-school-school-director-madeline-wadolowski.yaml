  note: 'Stratton School District records supplied by the Town Clerk''s
    office (Candie Bernard, via Town Clerk Kent Young) on 2026-10-26 in
    reply to CivicMirror''s records request of 2026-10-25: (1) the Warning
    for the March 3, 2026 Annual School District Meeting (signed by
    directors Walker, D''Elia-Laskin, Frigo and Crowther) -- Article 2
    warned four director seats: one two-year term to complete a three-year
    term, one three-year term, and two one-year terms; (2) the signed
    minutes of the March 3, 2026 meeting (Minutes by Town Clerk David Kent
    Young; approved by the Stratton School Directors) -- Article 2 elected
    Joe Frigo to the last two years of a three-year term, Kellie D''Elia-
    Laskin to a three-year term, and Morgan Taylor to a one-year term; the
    second one-year seat drew no nominations and remained vacant (the
    minutes note discussion of filling ''the vacant school board
    position''); (3) the Stratton School Board minutes of April 21, 2026
    (draft) -- reorganization (Walker Chair, Frigo Vice-Chair, Taylor Clerk)
    and, at item 4, the board''s unanimous appointment of Madeline
    Wadolowski to the vacant seat. These documents GOVERN the roster.
    ''Maddie Mindich,'' minted 2026-10-22 from the SU page''s fifth member
    card, appears in none of them and her person and membership were removed
    on 2026-10-26.'
  retrieved: '2026-10-26'
- url: https://www.windhamcentral.org/stratton-board-members
  note: 'Windham Central SU "Stratton Board Members" page (official), read
    from the page''s raw HTML on 2026-10-22 (member names are dropped by
    rendered-text extraction) and re-checked 2026-10-26: five cards --
    Melissa Walker (Chairperson), term length 3, expiry 2027; Joe Frigo
    (Vice-Chairperson), term length 1, expiry 2026; Morgan Taylor (Clerk),
    term length 3, expiry 2029; Kellie D''Elia-Laskin (Member), term length
    3, expiry 2026; and a fifth card (''Maddie Mindich'') with no term data.
    The page is STALE: it still shows Frigo''s and D''Elia-Laskin''s terms
    expiring at the March 2026 election at which both were re-elected, and
    its Taylor expiry (2029) contradicts the signed meeting minutes (one-
    year term, ending 2027). It is retained as a source for Walker''s term
    only (her seat was not before the March 3, 2026 meeting). Board size
    five is as the SU page presents the board (a section 423(b) expansion
    implied, the vote itself not fetched).'
  retrieved: '2026-10-26'
