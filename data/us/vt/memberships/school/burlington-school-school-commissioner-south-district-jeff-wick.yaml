- url: https://www.bsdvt.org/school-board/members/
  note: 'Burlington School District board members page (official): the
    twelve current school commissioners with their wards/districts and term-
    end years -- the eight ward seats end 2028, the four city-district seats
    end 2027.'
  retrieved: '2026-10-22'
- url: https://legislature.vermont.gov/statutes/section/24APPENDIX/003/00163
  note: 'Burlington city charter, 24 App. V.S.A. ch. 3 section 163: ''The
    Board of School Commissioners of said City shall be composed of 12
    school commissioners. One commissioner from Ward One through Eight
    inclusive and one commissioner from each of the four districts shall be
    elected...'' Section 4 provides each seat is elected only by the voters
    of its own ward or city district, and section 164 sets two-year terms
    (district seats in odd years, ward seats in even years). Charter section
    165 fills vacancies by election only -- this board has no appointed
    members.'
  retrieved: '2026-10-22'
- url: https://www.burlingtonvt.gov/179/Election-Results
  note: 'City of Burlington published election results (clerk''s summary
    reports): the March 3, 2026 report names the eight ward winners (Golden
    591, Vanderputten 815, Amato 576, Zygmant 1,285, Campriello 1,197, Wool
    947, Ericksen 1,294, O''Toole 365) and the March 4, 2025 report the four
    district winners (Price 1,126, Waltz 1,415, Sowers 2,630, Wick 2,507) --
    all twelve match the district''s board page with no mismatches.'
  retrieved: '2026-10-22'
