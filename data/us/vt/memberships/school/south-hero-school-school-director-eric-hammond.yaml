  note: 'South Hero certified Official Return of Votes, school election
    March 3, 2026 (Town Clerk Naomi S. King): "SCHOOL DIRECTOR - 2 YEARS:
    RICHARD MONTEROSSO 460"; "SCHOOL DIRECTOR - 3 YEARS: ERIC HAMMOND 440."
    The 2025 town report abstract records Kathryn "Kaight" Althoff elected
    in March 2025 to a 2-year term (end 2027) and Timothy Maxham to a 3-year
    term (to 2028). Maxham''s seat fell vacant effective August 1, 2026 --
    the board''s vacancy notice (Folsom board page) seeks an interim
    appointee "until March, 2027," when voters will elect a director for the
    final year of the term ending March 2028; Maxham is recorded ended 2026.
    Anna Bedard appears as the fifth name on the district''s current-members
    list but NO fetched document names her appointment -- her membership is
    HELD (resolving document: the board''s Aug./Sept. 2026 appointment
    minutes). Whitney Doremus (Vice Chair) is an incumbent since at least
    the March 2023 reorganization; no term end is published for her in any
    fetched source.'
