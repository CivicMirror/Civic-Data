  note: 'Kingdom East UUSD 2026 Annual Report (official): the Board
    Directory (p. 2, the pre-election roster) lists fifteen seats with towns
    and term expirations -- Burke: Alyssa May 2028, Abigail Montgomery 2026;
    Concord: Patricia Shine 2027, Kurt Martin (Appointed 2025) 2026;
    Lunenburg: Desmond Brown (Appointed 2025) 2027, James Peyton 2026;
    Lyndon: Lindsay Carpenter 2028, Larry Golden (Appointed 2025) 2027, Chad
    Simpson 2026, Steve Smith (Appointed 2025) 2028; Newark: seat vacant,
    expiring 2026; Sheffield: April Brown (Appointed 2025) 2028; Sutton:
    Candace Houghton 2028, Jake Simpson 2027; Wheelock: Norma Twombley 2027.
    Members the directory does NOT mark ''(Appointed)'' are carried as
    ELECTED. The same report''s 2026 warning (pp. 31-32, revised 2/3/26)
    warns nine seats, matching the nine contests in the district''s results.
    Carpenter signs the warning as Chair (Feb. 3, 2026) and the Board Report
    letter as School Board Chair.'
