  note: 'Hardwick Gazette, ''Everything Passes at Marshfield Town Meeting'' (March
    24, 2026), reporting the town''s draft annual-meeting minutes officer by officer:
    Betsy Brigham (five-year term), Amy Monahan (four-year remainder), and Beth Stern
    (two-year remainder) were elected to the Budget Committee in 2026. The committee''s
    size is DERIVED: one seat is elected each year to a five-year term, so the board
    numbers five; the 2026 meeting filled the regular five-year seat plus two vacancy
    remainders. Two seats'' holders are unpublished and left unfilled. Marshfield''s
    Amy Monahan is a different person from Cabot''s town treasurer Amy Monahan'
