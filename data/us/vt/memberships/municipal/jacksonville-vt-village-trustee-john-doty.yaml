  note: 'Village of Jacksonville (official site of the Jacksonville Electric Company,
    the village''s municipal utility), ''Board of Trustees'' page: the page styles
    the body ''The Village of Jacksonville''s Board of Trustee[s]'' and lists the
    current trustees as Kenneth Bernard (term to 2027), Laura Allen, Interim (2028),
    John Doty, Treasurer (2029), Jenepher Burnell, President (2030), and Tyler Colford,
    Clerk (2031); the parenthetical roles are board offices, not separate posts. Allen
    is styled ''Interim''; the charter fills vacancies only at special meetings called
    for that purpose (section 3(a)), so she is recorded as a seated trustee with the
    styling disclosed'
