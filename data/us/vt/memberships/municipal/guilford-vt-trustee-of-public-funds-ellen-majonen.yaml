  note: 'Town of Guilford, Annual Town Meeting minutes, February 28, 2026, Article
    4 (as amended) elects exactly four officers -- a Cemetery Commissioner (5-year),
    two Library Trustees (4-year and 3-year), and a Trustee of Public Funds (3-year)
    -- and names four nominees, elected by one voice vote (''All in Favor''). Three
    nominees are assigned in the minutes to the cemetery and library seats; the fourth,
    Elly Majonen, takes the only unassigned office, Trustee of Public Funds. ''Elly''
    is the diminutive of Ellen Majonen, the town''s treasurer and delinquent tax collector
    -- her existing person record is reused. Minted elected with this elimination
    chain disclosed; see the sweep report on issue #163, which also flags that two
    library trustees from this same vote were recorded differently in an earlier batch.'
