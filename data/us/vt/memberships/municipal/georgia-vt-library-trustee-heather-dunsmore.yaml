  note: 'Town of Georgia, official election results page: ''Library Trustee - 1 year
    (Vote for 3) -- Ben Chiappinelli 555; Heather Dunsmore 432; Sarah Savich 392;
    Nicole Jamison 380; Deborah Mann 217.'' Chiappinelli and Heather Dunsmore were
    elected March 3, 2026 (Savich''s membership already stands).'
