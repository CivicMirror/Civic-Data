- url: https://mccmeetings.blob.core.usgovcloudapi.net/georgiavt-pubu/MEET-Packet-b3f9d3b6099441c0be6096609b70fbaf.pdf
  note: 'Georgia Public Library, Trustee Meeting packet for March 18, 2026 (supplied
    by Walter 2026-10-22), item B: Special Meeting minutes, March 10, 2026 -- the
    reorganized board is Ben Chiappinelli (Chair), Sarah Savich (Vice Chair), Kollene
    Caspers (Secretary), Terry Cleveland (Treasurer) and Heather Dunsmore, all present
    and voting. Item A (minutes, February 18, 2026) shows Cleveland and Caspers as
    trustees before the election -- they are the continuing members. The library website
    roster the sweep relied on was stale (it still listed Mann, who lost, and a ''Harvey''
    who appears in no minutes). Heather Dunsmore''s election also corrects the sweep,
    which seated Brian Dunsmore on the surname alone -- his library membership is
    removed in the same push; his other records stand.'
  retrieved: '2026-10-22'
