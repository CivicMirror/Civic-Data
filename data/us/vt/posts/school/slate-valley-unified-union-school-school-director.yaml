  note: 'Slate Valley UUSD board page (official, fetched 2026-10-22): the
    full roster by town with a published "Term Expiration: FY20xx" per seat
    -- Beaumont-Stannard FY2027, King FY2029 (Benson); Belden FY2028,
    Finnegan FY2029, Traverse FY2027 (Castleton); Hier FY2029, Casey FY2027,
    Stanton FY2028 (Fair Haven); Bravo FY2027, Reinke FY2028, Denbeaux
    FY2027 (Hubbardton); Cousineau FY2028, Stone FY2027 (Orwell); Hertzberg
    FY2029 (West Haven) -- and four seats the district itself labels open
    (Benson 1, Orwell 1, West Haven 2). Under the Articles of Agreement Art.
    10, terms expire at the March annual meeting, so FY20xx is minted as end
    20xx. The Articles (Art. 9) establish the model verbatim -- 18 members,
    three per town, "Voters in member towns vote on the same slate of
    candidates" with comingled Australian ballots -- modified at-large (the
    "Modified Unified" styling in some AOE lists traces to never-triggered
    contingency articles; all six towns approved in 2017).'
