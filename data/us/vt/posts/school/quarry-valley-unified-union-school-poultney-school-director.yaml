  note: 'Quarry Valley UUSD Articles of Agreement (official; linked from
    GRCSU''s Articles of Agreement page, grcsu.org/articles-of-agreement/):
    Article 9 -- board representation is proportional to population, initial
    membership Poultney 4 (pop. 3,432, 46%), Proctor 3 (1,741, 23%), West
    Rutland 3 (2,326, 31%), ten seats total, and each Proctor member carries
    a 0.67 weighted vote (2 votes total for Proctor); Article 10 -- three-
    year terms beginning and expiring on the district annual-meeting date
    (Town Meeting Day); Article 11 -- directors are nominated in, and
    elected on the Australian ballot of, the member town they represent. No
    fetched official document shows a post-2020-census recalculation of the
    4/3/3 split, and 2026 practice matches it (two Poultney vacancies;
    Proctor''s third seat vacant). This CORRECTS the original build''s 3/3/3
    model (nine seats). Minted 2026-10-27 from the clerk/SU replies of
    2026-10-26: five members on direct evidence (Miser, L. Davenport, P.
    Davenport elected with published ends; Ohl and Dingman appointed to
    March 2027) and four elected with term ends held (Moser, Grabowski,
    Callahan, Lohnes-Watulak -- their towns and incumbency are established
    by the 2026 minutes and the GRCSU roster, but no fetched official source
    publishes their current term ends; West Rutland annual-report officer
    cycles recorded in research suggest 2029/2027/2028/2028 respectively,
    recorded here as UNVERIFIED and not minted). Proctor''s third seat is
    vacant (term expiring 2027).'
  retrieved: '2026-10-27'
