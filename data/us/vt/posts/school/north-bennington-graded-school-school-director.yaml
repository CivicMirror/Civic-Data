  note: 'North Bennington GSD is governed by a five-member Prudential
    Committee under its charter (16 V.S.A. App. ch. 15, section 15-2),
    elected at large by the district''s voters (Village of North Bennington
    + Shaftsbury District 1) by Australian ballot, three-year terms with
    unexpired-term fills. Only one membership is minted (see the source
    note); the directory as last published (Feb. 2025) is: Mullineaux 2026,
    Patterson 2025, McNamara 2027, Kane 2025, Deponte-Disorda 2026.
    SVSU/North Bennington/MAU Annual Report 2024 (for the March 4, 2025
    meeting), NBGSD Directory: Raymond Mullineaux (Chair) term expires 2026;
    Matthew Patterson (Vice Chair) 2025; Kiernan McNamara (Clerk) 2027; Tim
    Kane 2025; Lani Deponte-Disorda 2026. The district''s charter (16 V.S.A.
    App. ch. 15, section 15-2): "The Prudential Committee shall consist of
    five persons," elected for three-year terms, vacancies filled at a
    warned meeting for the unexpired term only. The district has been non-
    operating since 2013 (tuitions PK-6 by school choice; Village of North
    Bennington education page). The March 4, 2025 and March 3, 2026 election
    results were NOT fetched -- the seats expiring 2025 (Patterson, Kane)
    and 2026 (Mullineaux, Deponte-Disorda) are therefore HELD, and only the
    member whose published term (2027) runs past the March 2026 election is
    minted (the standard applied to Mt. Anthony in batch 6). Resolving
    documents: the NBGSD 2025/2026 annual meeting minutes or the FY27
    SVSU/NB/MAU report''s NBGSD directory page.'
