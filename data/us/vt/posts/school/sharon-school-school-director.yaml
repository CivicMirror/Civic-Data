  note: 'Sharon SD Annual Meeting Warning, March 3, 2025 (official warning
    text, district legal notice): Article 6, "To elect One School Director,
    for the term of three (3) years" -- one 3-year seat per year at the
    floor annual meeting. The board is three directors: the district''s
    March 4, 2024 warning carried a petitioned Article 11 to increase the
    board from three to five under section 423(b), which FAILED 77-13
    (meeting report). The same three directors sign the Jan. 2024 and Jan.
    2025 warnings; the SU''s published plan lists Davis, Moore and
    Livingston as Sharon''s SU-board delegation, and Livingston''s Feb. 25,
    2026 legislative testimony is headed "Vice-Chair, Sharon School District
    Board." No official source publishes individual term ends (Davis''s 2027
    rests on a news report of the March 4, 2024 result and is NOT minted).
    Resolving documents: the 2025/2026 annual meeting minutes and the
    district''s FY27 Annual Report.'
