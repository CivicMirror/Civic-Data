  note: 'First Branch Unified School District board page (White River Valley
    SU, official): six directors -- Kathy Galluzzo (Chair, Tunbridge, term
    expires 2027), Susan Kay (Vice Chair, Chelsea, 2027), Stacy Dion
    (Tunbridge, 2028), Rebecca Savidge (Chelsea, 2028 per the page),
    Jacqueline Garran (Tunbridge, 2029), Alan Ackerman (Chelsea, 2029). The
    six are corroborated across the August 25, September 8 and October 6,
    2026 minutes. Seats are residency-allocated (Chelsea 3 / Tunbridge 3)
    but elected by the whole district at the annual meeting (modified at-
    large; AOE State Board Item Q-2, 2017, quotes the articles: members
    ''elected by the voters of the entire New Unified District''). The
    verbatim articles text itself was not located.'
