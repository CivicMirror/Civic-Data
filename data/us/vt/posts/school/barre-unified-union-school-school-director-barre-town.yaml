  note: 'Barre Unified Union School District amended Articles of Agreement
    (voter-approved February 19, 2019): ''The Board of School Directors
    shall have nine (9) members, with four (4) residing in and representing
    Barre City; and four (4) residing in and representing Barre Town; and
    one (1) elected at-large by the voters of both municipalities.'' The
    eight town seats are elected by that municipality''s voters only; terms
    are three years, staggered. (The State Board''s original November 2018
    default articles, still hosted by the AOE, set a four-member board and
    are superseded.)'
