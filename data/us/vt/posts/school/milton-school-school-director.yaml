  note: 'Milton School District: five School Trustees at-large under 16
    V.S.A. section 423(a)-(b) -- three 3-year seats plus the two additional
    seats the electorate voted (currently one 2-year and one 1-year). The
    district styles its board the Board of Trustees and its members School
    Trustees (board page and official ballot). Milton School District board
    page (official): Karen Stout (Chair, 3-year term expires 2027), Jeremy
    Metcalf (Vice-Chair, 3-year, 2029), Nick DeVita (2-year, 2028), Lindsay
    Lott (Clerk, 1-year, 2027), Melinda Young (3-year, 2028). The board is
    styled the Board of Trustees and its members School Trustees.'
  retrieved: '2026-10-22'
