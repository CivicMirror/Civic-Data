  note: 'Warning for the May 24, 2022 district meeting (Athens and Grafton,
    then the Windham Northeast Union Elementary School District), Article 6:
    the voters modified the articles of agreement to add one district-wide-
    elected resident seat per town, producing the current board of six --
    three seats allocated to Athens residents, three to Grafton residents,
    all elected by the district''s voters as a whole (modified at-large).
    The 2022 article framed the added seats as one term; the board has sat
    at six continuously since, and no fetched document makes the structure
    expressly permanent.'
  retrieved: '2026-10-22'
