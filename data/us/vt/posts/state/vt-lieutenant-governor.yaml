  note: 'Membership minted 2026-10-16 (the seat was briefly held vacant at
    Walter''s direction and released the same day). Vermont Secretary of State,
    Official Report of the Canvassing Committee, general election November 5,
    2024: for Lieutenant Governor, John S. Rodgers 171,854 votes (46.09%, a
    plurality), David Zuckerman 165,876, Ian Diamondstone 13,671, write-in
    1,013. No candidate received the major part of the votes, so under Chapter
    II, section 47 of the Vermont Constitution the General Assembly elected the
    office by joint ballot on January 9, 2025, choosing Rodgers (158-18); he
    was sworn in the same day. The membership is sourced to this canvass and
    the official site of the Office of the Lieutenant Governor. The November 3,
    2026 general election decides the next term.'
  retrieved: '2026-10-16'
