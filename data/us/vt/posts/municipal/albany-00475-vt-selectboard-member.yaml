  note: 'Office established for Vermont towns by 17 V.S.A. section 2646 (a selectboard
    of three members unless the town votes five). The Secretary of State''s selectboard
    directory publishes no Albany roster (''Note: Contact the Town Clerk for more
    information''), and the Town of Albany has no official website, so no official
    source found as of 2026-10-17 publishes the board''s current members; the post
    is created as structure only with the statutory three seats, and the memberships
    await the printed annual town report or a clerk records reply.'
