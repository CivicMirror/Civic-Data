  note: 'Vermont Secretary of State, Elections Division, ''Vermont Justices of the
    Peace'' listing (updated December 4, 2025): lists seven Newfane justices of the
    peace elected November 5, 2024: Priscilla Cottron, Gloria Cristelli, Fiona Chevalier,
    Lynn Forrest, Caroline Apple Gifford, Steve Levine, and Kate Gehring. The town
    report''s justice column names Cottron (spelled ''Cotton''), Cristelli, Gifford,
    and Levine, plus Sandra Dadik, Abigail Dillon, and Evelyn Sirois, omitting Chevalier,
    Forrest, and Gehring -- an equal-count name swap, so the certified listing governs
    and Dadik, Dillon, and Sirois (possible mid-term Board of Civil Authority appointees)
    are held as stragglers in this note. The listing publishes no vote totals or party
    labels and none are recorded'
