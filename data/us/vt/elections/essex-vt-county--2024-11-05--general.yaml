  note: 'Vermont Elections Database (Vermont Secretary of State), contest page ''2024
    Nov 5, General Election, High Bailiff, Essex County'' (county totals): no candidates
    qualified for the ballot; the only votes recorded are write-ins: 287. The canvass
    certified a write-in winner: Eric Engel, 89 write-in votes. The contest page''s
    cited official source is the Secretary of State''s ''November 5, 2024 General
    Official Results.pdf''. High bailiffs are elected biennially (Vermont Constitution,
    Chapter II, section 43); the November 3, 2026 general election decides the next
    term. The Elections Database names no candidate for this contest. The Hardwick
    Gazette''s post-election report of the area counties'' high bailiff results (November
    11, 2024) reports that Essex County voters wrote in Eric Engel 89 times, the highest
    write-in total, of 287 write-in votes cast; he is recorded here as the seat''s
    elected holder on that reporting. No party label attaches to a write-in candidacy.'
