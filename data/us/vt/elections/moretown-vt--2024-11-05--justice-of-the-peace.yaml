  note: 'Vermont Secretary of State, Elections Division, ''Vermont Justices of the
    Peace'' listing (updated December 4, 2025): the Moretown block lists four justices
    of the peace elected November 5, 2024: Bridget Harty, Stephen Magill, William
    Nowlan, and Kathryn O''Neill. The Town of Moretown''s 2025 Town Report officers
    table lists SEVEN justices of the peace -- the same four plus Ron Shems, Sam Rosenberg,
    and Sybil Schlesinger -- a superset of the listing, and the table proved seat-accurate
    for the selectboard, cemetery commission, and library trustees against the town''s
    2026 ballot. The town report governs and the seven are recorded as the winners.
    The listing publishes no vote totals or party labels and none are recorded'
