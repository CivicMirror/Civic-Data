  note: 'Vermont Secretary of State, Elections Division, ''Vermont Justices of the
    Peace'' listing (updated December 4, 2025): lists seven New Haven justices of
    the peace elected November 5, 2024: Kathleen Barrett, Tim Bouton, Gail Freidin,
    Al Karnatz, Marie Jewett, Pam Marsh, and Susan Smiley. The town''s 2025 annual
    report records that Gail Freidin (printed there as ''Gail Byers''; the listing''s
    form governs) resigned in November 2025 and Susan Smiley resigned in January 2026,
    so five of the seven winners currently serve and are the winners recorded here;
    Freidin and Smiley, as departed winners, are named in this note only (the Enosburgh/Maidstone
    pattern). The listing publishes no vote totals or party labels and none are recorded'
