  note: 'Vermont Elections Database (Vermont Secretary of State), contest page ''2024
    Nov 5, General Election, State Senate, Orange District'' (district totals): Larry
    Hart Sr (Republican) 7,230 votes; Mark A. Macdonald (Democratic) 5,523; write-ins
    43. The contest page''s cited official source is the Secretary of State''s ''November
    5, 2024 General Official Results.pdf''. State senators serve two-year terms; the
    November 3, 2026 general election decides the next term. Larry Hart resigned the
    seat: his resignation was submitted in October 2025 and took effect November 14,
    2025 (the Senate directory records November 14, 2025). Governor Phil Scott appointed
