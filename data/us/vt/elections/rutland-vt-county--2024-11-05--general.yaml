  note: 'Vermont Elections Database (Vermont Secretary of State), contest page ''2024
    Nov 5, General Election, High Bailiff, Rutland County'' (county totals): the contest
    page states ''No qualifying candidates in this contest'' and publishes no results
    data at all -- no candidate votes and no write-in total. No winner is named in
    the database and none is recorded here, and no holder is minted for the seat.
    The contest page''s cited official source is the Secretary of State''s ''November
    5, 2024 General Official Results.pdf''. High bailiffs are elected biennially (Vermont
    Constitution, Chapter II, section 43); the November 3, 2026 general election decides
    the next term. Before recording this contest winner-less, certification reporting
    was checked for a certified write-in winner (the check that found Orange County''s
    Chris Helali and Essex County''s Eric Engel): no source names a 2024 Rutland County
    high bailiff winner, so the seat is recorded with no winner and no holder, on
    the same footing as Grand Isle, Orleans, Windham and Windsor counties.'
  retrieved: '2026-10-17'
