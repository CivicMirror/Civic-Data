  note: 'Vermont Secretary of State, Elections Division, ''2025-2026 Vermont Justices
    of the Peace'' listing (updated December 4, 2025): lists ten Enosburgh justices
    of the peace elected November 5, 2024: Patricia Boucher, Timothy Stetson, Peter
    Perley, Sandra Murphy, Lucien Robtoy, Robert Young, Avis Gervais, Pierre Letourneau,
    Sarah Downes, and Angela Wright. The listing publishes no vote totals or party
    labels and none are recorded. Avis Gervais died July 26, 2025 (the Village of
    Enosburg Falls 2025 Annual Report is dedicated in part to her memory), so no person
    or membership is minted for her and her seat stands vacant; the nine surviving
    winners are recorded here.'
