  note: 'Vermont Secretary of State, Elections Division, ''Vermont Justices of the
    Peace'' listing (updated December 4, 2025): the certified listing names seven
    winners for South Hero''s seven justice of the peace seats. Note: ch. 148 sec.
    3 makes the town''s three listers and its delinquent tax collector Selectboard-appointed
    and sec. 4 makes the auditor appointed, so no posts are created for those offices;
    the town nevertheless balloted lister seats in 2025 and 2026, and those ballot
    winners are not recorded because the charter controls (flagged on issue #163)'
  retrieved: '2026-10-19'
