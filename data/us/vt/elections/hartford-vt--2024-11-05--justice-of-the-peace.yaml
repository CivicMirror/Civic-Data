  note: 'Vermont Secretary of State, Elections Division, ''2025-2026 Vermont Justices
    of the Peace'' listing (updated December 4, 2025): the SOS listing names the fifteen
    Hartford winners of the November 5, 2024 justice of the peace election; the first-listed,
    Rebecca White, is the sitting Windsor-district state senator and her existing
    person record is reused. No lister post: the charter''s contracted assessor performs
    the listers'' functions. No delinquent-tax-collector post: the Town Manager holds
    the duties (ch. 123A section 203(c)). No West Hartford Library trustee post: its
    trustees are town-elected on five-year terms but no official source fixes the
    board''s size (verified elected: Karen Powell and Mary Smith, 2025; Torrelee F.
    ''Fisher-Sass'' Sass, 2026).'
