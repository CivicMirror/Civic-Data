    Marianne N Blake, Janet Farley, Linda Farnsworth, Patricia Crikett French, Steve
    Giroux, Amy McMullen, David Morin, Sara Morin, Ryan Palmer, and Donna Sweaney.
    Ryan Palmer is Windsor County''s elected sheriff; his existing county-tier record
    is reused and the JP candidacy is appended to it'
