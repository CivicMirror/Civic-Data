- url: https://outside.vermont.gov/dept/sos/Elections_Division/election_info_resources/candidates/local_office_descriptions/vermont_justices_of_the_peace.pdf
  note: 'Vermont Secretary of State, Elections Division, ''Vermont Justices of the
    Peace'' listing (updated December 4, 2025): the Monkton block lists only five
    justices of the peace: Jane B. Low, Kathy Malzac, Jerry Schwarz, Kenneth Wheeling,
    and Valerie Mullin. The Town of Monkton''s own Directory of Town Officials --
    in both the 2025 Annual Town Report and the standalone directory updated August
    24, 2026 -- lists TEN justices of the peace, each marked ''Elected (November Election)''
    for the two-year term February 2025 to January 2027: Kristen Blanchette, Lynne
    Caulfield, Jane Low, Kathy Malzac, Renee McGuiness, Amy Moody, Norma Norris, Jerry
    Schwarz, Gail Vansteamberg, and William Vansteamberg. The town''s two concordant
    directories govern and the ten are recorded as the winners; Wheeling and Mullin
    appear in no town source and are not recorded as holders. The listing publishes
    no vote totals or party labels and none are recorded'
  retrieved: '2026-10-18'
