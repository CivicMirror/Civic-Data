  note: 'Vermont Elections Database (Vermont Secretary of State), contest page ''2022
    Nov 8, General Election, State''s Attorney (listed as District Attorney), Orleans
    County'' (county totals): Jennifer Barrett (Democratic/Republican) 8,041 votes;
    write-ins 673. The contest page''s cited official source is the official return
    vt-2022_11_08_General_ALL.pdf. The office serves a four-year term beginning February
    1 after the election (Vermont Constitution, Chapter II, section 50); the November
    3, 2026 general election decides the next term. Mid-term change: the 2022 winner,
    Jennifer Barrett, no longer holds the office; the Department page associates Farzana
    Leyva with the office but styles her Deputy State''s Attorney in its staff list
    (see county notes - resolve before building).'
