  note: 'Vermont Elections Database (Vermont Secretary of State), contest page ''2024
    Nov 5, General Election, High Bailiff, Orange County'' (county totals): no candidates
    qualified for the ballot; the only votes recorded are write-ins: 1,887. The canvass
    certified a write-in winner: Chris Helali, 446 write-in votes. The contest page''s
    cited official source is the Secretary of State''s ''November 5, 2024 General
    Official Results.pdf''. High bailiffs are elected biennially (Vermont Constitution,
    Chapter II, section 43); the November 3, 2026 general election decides the next
    term. The Elections Database names no candidate for this contest. Two write-in
    campaigns were waged for the seat (Chris Helali of Vershire and Tom Harty of Randolph);
    the state Canvassing Committee certified Helali the winner with 446 votes, as
    reported by The White River Valley Herald (''Helali Wins High Bailiff As Write-In'',
    November 14, 2024, citing the official certification) and confirmed in Seven Days''
    2026 retrospective. No party label attaches to a write-in candidacy.'
  retrieved: '2026-10-17'
