  note: 'Vermont Secretary of State, Elections Division, ''Vermont Justices of the
    Peace'' listing (updated December 4, 2025): lists fifteen Morristown justices
    of the peace elected November 5, 2024: Darcie Abbene, Judy Bickford, Donald Blake,
    Jr, Julia Compagna, Richard Craig, Leah Hollenberger, Urban Martin, Monte Mason,
    Yvette Mason, Shelley Nolan, Siri Rooney, Shapleigh Smith, Jr, Edward Wilson,
    Charles Burnham, and Roland Billings. The Town of Morristown''s 2025 Annual Town
    Report lists Jane Foster and Aimee Towne as justices of the peace instead of Burnham
    and Billings; the certified listing governs the election record, and Foster and
    Towne (possible mid-term appointees) are not recorded as holders. The listing
    publishes no vote totals or party labels and none are recorded'
