  note: 'Vermont Secretary of State, Elections Division, ''Vermont Justices of the
    Peace'' listing (updated December 4, 2025): the certified listing names five winners
    for Sharon''s five justice of the peace seats. Only four of the five serve: the
    2025 town report''s elected list shows Barrett, Fullerton, Gray, and Jones, with
    Sherri Lorette seated by state appointment to fill a vacancy -- Lisa Flanders,
    the fifth name in the listing, appears nowhere in the town''s records and is excluded
    entirely under the departed-winner pattern, her story told here. The town voted
    in March 2025 to increase its justices to seven, effective for the next cycle'
