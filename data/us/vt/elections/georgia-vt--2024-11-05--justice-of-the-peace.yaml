  note: 'Vermont Secretary of State, Elections Division, ''2025-2026 Vermont Justices
    of the Peace'' listing (updated December 4, 2025): the SOS listing names eleven
    Georgia winners of the November 5, 2024 justice of the peace election and prints
    the twelfth seat as ''Open''; the contest carries vote_for 12 with eleven winners
    and the vacancy is the listing''s own. Georgia elects its Planning Commissioners
    (a four-year seat and a one-year remainder stood in 2026), but no source read
    fixes the commission''s size, so no post is created; the town has an appointed
    Town Assessor (no listers) and its audits are performed by an outside firm (no
    auditor post).'
