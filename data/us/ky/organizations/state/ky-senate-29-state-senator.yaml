  note: 'Commonwealth of Kentucky, State Board of Elections / Secretary of State, ''2024 General Election Certification as Amended on December 9th 2024'' -- official certified results for the November 5, 2024 general election, State Senator 29th District contest, county tables with district totals: Scott Madon (Write-In) 6,825; Willie Crase (Write-In) 2,892; James Tyler Ward II (Write-In) 2,006; James Richard Tanner Hesterberg (Write-In) 1,908; Justin Wade Noble (Write-In) 1,844; Leonard Hendrickson (Write-In) 1,266; Valerie Ison Horn (Write-In) 1,238; Craig E. Blackburn (Write-In) 722; John Clem (Write-In) 443; Paul Williams (Write-In) 152; Andrew Thomas Saylor (Write-In) 106. Scott Madon won with 6,825 votes. No candidate was listed on the ballot for this contest; all candidates were write-in candidates.'
