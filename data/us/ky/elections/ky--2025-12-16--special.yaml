  note: 'Jefferson County Board of Elections, Electionware Special Election Summary for the 37th Senatorial District, December 16, 2025 (hosted by the Kentucky State Board of Elections) -- district totals: Gary Clemons (Democratic) 3,752; Calvin Leach (Republican) 1,297; Wendy Higdon (Libertarian) 121; Write-In 8 (unnamed aggregate). Gary Clemons won with 3,752 votes. The same candidate totals appear in Jefferson County''s Official Results Report of December 18, 2025; the State Board of Elections certified the results on January 5, 2026. The special election filled the vacancy left by David Yates''s October 2025 resignation to become Jefferson County Clerk.'
