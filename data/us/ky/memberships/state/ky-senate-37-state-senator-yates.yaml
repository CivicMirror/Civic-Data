  note: 'Commonwealth of Kentucky, State Board of Elections / Secretary of State, ''2024 General Election Certification as Amended on December 9th 2024'' -- official certified results for the November 5, 2024 general election, State Senator 37th District contest, county tables with district totals: David Yates (Democratic) 25,124; Calvin Leach (Republican) 16,460. David Yates won with 25,124 votes.'
