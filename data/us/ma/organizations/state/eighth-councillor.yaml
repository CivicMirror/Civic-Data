sources:
- url: https://malegislature.gov/Laws/GeneralLaws/PartI/TitleVIII/Chapter57/Section2
  note: 'MGL c.57 Sec. 2 defines the Eighth Councillor District as the union of five contiguous Senate districts: Berkshire, Hampden, Franklin and Hampshire; Hampden; Hampden, Hampshire and Worcester; Hampden and Hampshire; Hampshire, Franklin and Worcester. Verified via a bijection check against this repo''s 40 jurisdictions/state/*-senate.yaml files -- see issue #103.'
  retrieved: '2026-09-29'
- url: https://malegislature.gov/Laws/Constitution
  note: 'Amendments Art. XVI establishes the 8 elected councillor districts (one per district, each composed of 5 contiguous senatorial districts once the commonwealth has 40 such districts) and a 5-year MA residency requirement for candidacy. Amendments Art. LXXXII (superseding Arts. LXIV and LXXX) sets the councillor''s term: elected biennially, term begins at noon the Thursday after the first Wednesday in January following election and ends the same way in the third year following election -- distinct from the Governor/Lt. Governor/other 4 constitutional officers, who are quadrennial under the same article. Const. Pt. 2, Ch. II, Sec. III, Art. I: the Governor presides over the Council without a vote; the Lieutenant Governor is always a member ex officio -- neither is separately elected to the Council, so neither is minted here.'
  retrieved: '2026-09-29'
