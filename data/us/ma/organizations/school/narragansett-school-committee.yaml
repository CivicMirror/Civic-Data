  note: 'The Narragansett Regional School District Committee has 8 members under the regional agreement (M.G.L. c. 71 s.14B and s.16E), apportioned 4 to Templeton and 4 to Phillipston. This post covers only Templeton''s four apportioned seats; Phillipston''s belong to that town. Note both member towns vote on the district''s seats, so Phillipston-apportioned seats also appear on Templeton ballots and are deliberately excluded here.'
