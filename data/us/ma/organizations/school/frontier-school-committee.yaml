  note: 'Frontier Regional School District Agreement policy BB-1 ("File: BB-1 - REGIONAL AGREEMENT"), Section I: 11-member Committee total (4 Deerfield, 3 Sunderland, 2 Whately, 2 Conway), but only 7 of those are elected -- one seat per town is appointed annually (1-year term) by that town''s own local school committee: 3 elected + 1 appointed Deerfield, 2 elected + 1 appointed Sunderland, 1 elected + 1 appointed Conway, 1 elected + 1 appointed Whately. This post/org tracks only the 7 elected seats, matching this repo''s existing convention for appointed/ex-officio seats mixed into an otherwise-elected body (see e.g. the Smith Vocational and Agricultural Board of Trustees org, and Northampton/Agawam''s mayor-ex-officio school committee seats).'
