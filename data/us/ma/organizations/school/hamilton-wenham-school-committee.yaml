# Regional agreement (May 2010, amended 2/13/2014) sets 7 elected seats across 2 member towns. All 7 current holders were sourced generically from the district's own site (hwschools.net), which does not label members by town -- their `seat` field is left blank rather than assumed to be all-Wenham, since the pre-remodel per-town org they lived under was itself a data-entry artifact, not evidence of town of origin. Splitting the 7 by town needs a per-town source (e.g. Hamilton's or Wenham's own annual report) for issue #45.
