# Union 28 by-laws (final vote 5/3/2018) fix the union committee at 10 elected members, 5 per town, sitting jointly as the towns' respective local school committees. Governs the Swift River School (the shared elementary building) -- also referred to as the Swift River School Committee in district-hosted materials.
