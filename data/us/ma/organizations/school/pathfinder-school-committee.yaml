  note: 'FLAG (2026-09-20, issue #75 scope review): the District''s own 2022 Annual Report confirms most seats are filled by direct election at the November biennial state election ("incumbents ... were re-elected. New Members elected were..."), consistent with civicmirror''s elected-only scope. But it also states Ware''s second seat is filled by appointment, not election, per the regional agreement ("Ware''s population has increased to having over 10,000 residents, which per the regional agreement, another school committee member from Ware will be appointed") -- this repo currently has both Ware members tagged how_seated: elected, which is likely wrong for one of them. Needs a source that identifies which specific Ware seat/holder is the appointed one before correcting -- do not guess.'
  retrieved: '2026-09-20'
- url: https://github.com/user-attachments/files/32465894/A.Section.pdf
  note: 'FOLLOW-UP (2026-09-21): the regional agreement itself (Section I(A)) confirms this is a temporary bridge, not a standing appointed seat -- when a town crosses 10,000 population it "shall be immediately entitled to an additional member... to be appointed by the selectmen of the town concerned and the Committee, acting jointly, to serve until the next biennial state election, at which election a successor shall be elected to serve for a term of four years." So all 12 seats are structurally elected; the open question is only whether Ware''s second holder (Richard Fly, seated 2023 per the district''s own committee roster) is still within that one-time bridge window or has already stood for election since. Still needs Ware''s population-crossing date plus 2024/2026 biennial election results for this seat before correcting `how_seated` on either Ware membership -- do not guess which one.'
  retrieved: '2026-09-21'
- url: https://github.com/CivicMirror/Civic-Data/issues/45#issuecomment-5683516853
  note: 'Belchertown''s own 2026 Elected Officers roster lists both of its Pathfinder members (Lorraine F. Alves, John Sullivan) with term-end dates, same as its other elected offices -- third corroboration of the general pattern that multi-seat member towns'' seats are directly elected. Does not itself identify which Ware holder (of Marie Barbara Ray or Richard Fly) is inside the population-crossing appointment bridge; that still needs Ware-specific sourcing.'
  retrieved: '2026-09-21'
