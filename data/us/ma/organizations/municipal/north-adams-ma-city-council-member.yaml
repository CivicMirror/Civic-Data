# CivicPatch listing 9 councillors. Confirmed via the city's own adopted charter
# (scripts/ecode360 charter scraper, MA Standard City Charter Plan A provisions,
# Sec. 50 "City council, number, election, etc."): a 9-member council elected
# at large -- no ward/district seats, so a single seats:9 post correctly models it
# (unlike Northampton, which mixes ward and at-large seats and needs a Boston-style
# per-seat model instead -- deliberately not created here).
