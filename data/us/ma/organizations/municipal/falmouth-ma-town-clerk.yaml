# No longer an elected office: Chapter 106 of the Acts of 2026 ("An Act
# Providing for the Appointed Position of Town Clerk in the Town of
# Falmouth," House Bill H.5412, substituted from H.5107) amended the
# Falmouth charter to strike "and a Town Clerk" from the elected-officer
# clause, so that "the only officer to be elected shall be a Moderator."
# The office of Town Clerk is now appointed by the Town Manager subject
# to Select Board approval; the sitting elected incumbent became the
# first appointed Town Clerk without interruption. Status changed from
# active to inactive rather than deleted, to preserve the historical
# record; no membership is recorded here since the office is no longer
# elected. Retrieved 2026-08-28. Resolves the Falmouth "Town Clerk
# status" item from issue #16's human-review queue.
