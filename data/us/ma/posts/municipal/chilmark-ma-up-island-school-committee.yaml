# Created for issue #45 (MA #34 Stage 3: School Committee officeholder
# backfill). Up-Island Regional School Committee: one representative
# elected from each member town (Aquinnah, Chilmark, West Tisbury) plus 2
# at-large seats. Split out from West Tisbury's over-broad post (see that
# post's history) -- this is Chilmark's own single seat.
# CONFIRMED elected 2026-09-16: Chilmark's Nov 8, 2022 state election
# official results (page 4) list "Up-Island Regional School Committee
# (vote for no more than 5)" as a ballot line -- Robert Lionette won 496
# votes. This is decided by the November biennial state-election ballot,
# not the spring Annual Town Election (which was checked earlier and
# wrongly taken as evidence the seat might be Select-Board-appointed).
