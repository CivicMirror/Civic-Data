# Created by the issue #66 structure-gap triage; seat count corrected
# 2026-09-16 from #48 follow-up research. The original 3-seat estimate
# (from the 2026 election alone: 2 regular + 1 unexpired-vacancy seat)
# undercounted -- the town's own 2024 ("VOTE FOR TWO"), 2025 ("VOTE FOR
# ONE") and 2026 ("VOTE FOR TWO" + a separate 1-yr-unexpired special)
# results together account for 5 regular 3-year seat-slots across one
# full staggered cycle (2+1+2=5), matching the 5 names the town's live
# Assessors page currently lists. The 2026 unexpired-vacancy seat is not
# a 6th seat -- its term-end (2027) matches what a 2024 winner's term
# would have been, i.e. it refilled an existing seat vacated early
# rather than adding one.
