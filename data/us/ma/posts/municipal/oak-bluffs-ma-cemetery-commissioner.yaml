# 2026-10-01 issue #107 resolution: the town's Cemetery Commission web page
# (/173/Cemetery-Commission) is stale (~2023-era: Jesse Law III, Richard Combra
# Jr., John Tiernan). The official 2026 Board and Committee Members roster (dated
# 2026-08-10) is authoritative: Gary Buckley (exp 2028), Jack Law (exp 2027),
# John Tiernan (exp 2029), all elected. "Jack Law" is the same person as
# Jesse Law III (town documents use the names interchangeably for the same seat).
# Richard Combra, Jr. appears on no official cemetery roster (Nov 2024
# spreadsheet and Aug 2026 roster both omit him; he is listed as a Parks
# Commissioner instead) - his membership was removed. The April 16, 2026 ATE
# re-elected John Victor Tiernan (490 votes) to a 3-year term.
