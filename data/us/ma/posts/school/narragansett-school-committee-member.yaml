  note: 'The Narragansett Regional School District Committee has 7 members under the regional agreement (M.G.L. c. 71 s.14B and s.16E), apportioned 4 to Templeton and 3 to Phillipston (corrected 2026-09-21 per issue #45 sourcing -- this source''s original "4 and 4" claim contradicted Phillipston''s own Annual Town Report, which lists exactly 3 staggered Phillipston seats, and this post''s seats: 7 total). Both member towns vote on the district''s seats, so Phillipston-apportioned seats also appear on Templeton ballots and are deliberately excluded here.'
