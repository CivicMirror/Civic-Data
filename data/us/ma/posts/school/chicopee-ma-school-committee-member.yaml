  note: 'Stale seat count corrected 11 -> 12, same bug class already fixed elsewhere in issue #45. Chicopee City Charter, Article III: the School Committee "consist[s] of the Mayor, two members at large and one from each ward" (9 wards) = 1 + 2 + 9 = 12, not 11. The Mayor is a full member and ex-officio chair, not merely a presiding non-member.'
  retrieved: '2026-09-16'
- url: https://www.chicopeema.gov/DocumentCenter/View/21409/November-4-2025-Municipal-Election--Summary-Report
  note: 'Resolved 2026-09-18: this at-large seat (the one up in 2025-11-04) was mistakenly minted for Mark Daniel McCarthy, the losing candidate -- official results show Robert George Cantin won with 2,727 votes (50.17%) to McCarthy''s 2,689 (49.47%). McCarthy''s membership record has been removed and replaced with Cantin''s.'
  retrieved: '2026-09-18'
- url: https://www.chicopeema.gov/DocumentCenter/View/17619/November-7-2023---Municipal-Election-Summary-Report
  note: 'Resolved 2026-09-18: the second at-large seat''s prior "unresolved" flag was a name-confusion error. It was Chester "Chet" Szetela (father) who resigned an At-Large seat in October 2024 -- that vacancy was filled by appointment (McCarthy, above) and later by election (Cantin). His daughter, Susan Ann Szetela Lopes, holds a separate At-Large seat she was elected to unopposed on 2023-11-07 (term 2024-2027) and never resigned; confirmed still current on the district''s own School Committee page. Minted -- this is the post''s 12th and final seat.'
  retrieved: '2026-09-18'
