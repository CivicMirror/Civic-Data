id: ocd-jurisdiction/country:us/state:ma/cd:2/legislature
name: Massachusetts's 2nd congressional district (U.S. House delegation)
state: ma
division_id: ocd-division/country:us/state:ma/cd:2
classification: legislature
government_form: single-member district (U.S. House of Representatives)
website: https://www.govtrack.us/congress/members/MA/2
site_intelligence:
  officials_directory_url: https://www.govtrack.us/congress/members/MA/2
  election_results_url: https://electionstats.state.ma.us
  election_results_vendor: state ElectionStats (federal contests certified by the Secretary of the Commonwealth)
  notes: >-
    Federal district with no government of its own, so there is no official district website (see cd-1.yaml for the same pattern). CAVEAT: OCD-IDs do not version congressional districts by redistricting cycle -- this jurisdiction names "whichever district is currently numbered 2," not a boundary-stable entity. After the 2010 Census, Massachusetts lost a seat and its map was redrawn; the pre-2013 MA-02 (Springfield-based, represented by Richard Neal 1989-2013) is not the same district as the current MA-02 this file describes -- Neal's Springfield base was absorbed into the redrawn MA-01 (see cd-1.yaml), and he was reelected there in 2012. His historical role is still linked to office_id 'ma-2/us-representative' because that's the only id this repo has minted for "district 2," but it refers to the old boundary, not this jurisdiction's current one.
election_authority:
  name: Massachusetts Secretary of the Commonwealth, Elections Division
  level: state
  url: https://www.sec.state.ma.us/divisions/elections/election-and-voter-information.htm
sources:
  - url: https://www.govtrack.us/congress/members/MA/2
    note: >-
      GovTrack district page (sample); used because congressional districts
      have no official government website of their own
    retrieved: "2026-08-14"
