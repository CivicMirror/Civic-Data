# REAL JURISDICTION -- Massachusetts "Berkshire Middle District" registry of deeds district.
# (issues #63 / #104). District composition per MGL c.36 §1: Pittsfield, Becket, Dalton, Hinsdale, Lee, Lenox, Otis, Peru, Richmond, Stockbridge, Tyringham and Washington (registry office: Pittsfield).
