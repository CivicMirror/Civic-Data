# REAL JURISDICTION -- Massachusetts "Berkshire Northern District" registry of deeds district.
# (issues #63 / #104). District composition per MGL c.36 §1: that portion of Berkshire County lying north of the middle district (registry office: Adams).
# Modeled on the judicial-district precedent but nested under the county in
# the id, since registry districts never cross county lines (unlike DA
# districts). Elected register, 6-year term per MGL c.36 §2.
