# REAL JURISDICTION -- Massachusetts "Worcester District" registry of deeds district.
# (issues #63 / #104). District composition per MGL c.36 §1: the remainder of Worcester County -- 55 municipalities (registry office: Worcester).
# Modeled on the judicial-district precedent but nested under the county in
# the id, since registry districts never cross county lines (unlike DA
# districts). Elected register, 6-year term per MGL c.36 §2.
