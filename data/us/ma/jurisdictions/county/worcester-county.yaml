# REAL JURISDICTION — Worcester County government (commissioners, county
# council, etc.) was abolished effective 1998-07-01 under MGL c.34B
# (Abolition of County Government; St.1997, c.48), which transferred most
# county functions to the Commonwealth. Four countywide offices remain
# directly elected by Worcester County voters and survived abolition:
# Sheriff, Register of Deeds, Register of Probate, and District Attorney.
#
# The District Attorney is DELIBERATELY EXCLUDED from this file's `offices`
# list. Worcester's DA seat (the "Middle District") is not coextensive
# with the county: it excludes the Worcester County town of Athol and
# includes Bellingham, which is in Norfolk County. It gets its own file,
# data/us/ma/jurisdictions/da-middle-district.yaml, the same way
# congressional districts (which also don't align to any one place) get
# cd-N.yaml files rather than being folded into a municipality's record.
id: ocd-division/country:us/state:ma/county:worcester
name: Worcester County
state: ma
classification: county
government_form: >-
  County government abolished 1998-07-01 (MGL c.34B; St.1997, c.48);
  functions transferred to the Commonwealth. No county council or
  commissioners remain — only the three directly-elected offices below
  (a fourth, District Attorney, is a separate jurisdiction — see above).
website: https://www.sec.state.ma.us/divisions/cis/government/politics-counties.htm
site_intelligence:
  notes: >-
    No unified Worcester County government website exists post-abolition
    — each elected office runs its own site (worcestercountysheriff.com,
    massrods.com/worcester, mass.gov court pages). 'website' above points
    to the Secretary of the Commonwealth's counties reference page as a
    neutral, office-independent source — the same pattern cd-1.yaml uses
    for congressional districts that have no government site of their own.
election_authority:
  name: Massachusetts Secretary of the Commonwealth, Elections Division
  level: state
  url: https://www.sec.state.ma.us/divisions/elections/election-and-voter-information.htm
offices:
  - id: worcester-county-ma/sheriff
    role: Sheriff
    seats: 1
    seat_structure: at-large
    term_years: 6
    partisan: true
    notes: >-
      MGL c.37 §1: "A sheriff shall be elected in each county for six
      years, beginning with the first Wednesday of January following his
      election, and until his successor is qualified."
  - id: worcester-county-ma/register-of-deeds
    role: Register of Deeds
    seats: 1
    seat_structure: at-large
    term_years: 6
    partisan: true
    notes: >-
      6-year term confirmed via the Worcester District Registry's own
      election history (elected 2018, re-elected 2024) and Secretary of
      the Commonwealth election materials. Governed by MGL c.36, but the
      exact section setting term length wasn't pinned to statute text
      during research — lower-confidence provenance than the Sheriff/
      Register of Probate citations, which quote the statute directly.
      Worcester's registry ("Worcester District") covers all 60 county
      municipalities.
  - id: worcester-county-ma/register-of-probate
    role: Register of Probate
    seats: 1
    seat_structure: at-large
    term_years: 6
    partisan: true
    notes: >-
      MGL c.217 §4: "There shall be in each county a register of probate
      and insolvency, who shall hold office for six years beginning with
      the first Wednesday in January in the year succeeding his election,
      and until his successor is qualified."
sources:
  - url: https://law.justia.com/codes/massachusetts/part-i/title-vi/chapter-34b/section-1/
    note: MGL c.34B §1 — transfer date for abolished counties (Worcester among them).
    retrieved: "2026-08-12"
  - url: https://malegislature.gov/Laws/GeneralLaws/PartI/TitleVI/Chapter37/Section1
    note: MGL c.37 §1 — sheriff's 6-year elected term, quoted verbatim above.
    retrieved: "2026-08-12"
  - url: https://malegislature.gov/Laws/GeneralLaws/PartIII/TitleI/Chapter217/Section4
    note: MGL c.217 §4 — register of probate's 6-year elected term, quoted verbatim above.
    retrieved: "2026-08-12"
  - url: https://massrods.com/worcester/
    note: Worcester District Registry of Deeds — confirms current register and district scope.
    retrieved: "2026-08-12"
  - url: https://www.sec.state.ma.us/divisions/cis/government/politics-counties.htm
    note: Secretary of the Commonwealth counties reference (used as jurisdiction website).
    retrieved: "2026-08-12"
