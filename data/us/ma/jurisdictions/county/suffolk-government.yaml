# REAL JURISDICTION -- Suffolk County surviving elected offices
# (issue #63). No separately elected county commissioners (MGL c.34 §4: Boston mayor/council, Chelsea and Revere councils, Winthrop selectmen exercise commissioner powers) and no elected county treasurer (MGL c.35 §1: Boston treasurer is county treasurer). Remaining county government abolished 1999-07-01 under MGL c.34B §1(e).
# classification 'executive' represents these as independently-elected
# administrative/constitutional offices rather than a legislative body.
