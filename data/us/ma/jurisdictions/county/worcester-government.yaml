# REAL JURISDICTION -- Worcester County government (commissioners, county
# council, etc.) was abolished effective 1998-07-01 under MGL c.34B (Abolition
# of County Government; St.1997, c.48), which transferred most county functions
# to the Commonwealth. Four countywide offices remain directly elected by
# Worcester County voters and survived abolition: Sheriff, Register of Deeds,
# Register of Probate, and District Attorney.
#
# The District Attorney is DELIBERATELY EXCLUDED from this jurisdiction.
# Worcester's DA seat (the "Middle District") is not coextensive with the
# county: it excludes the Worcester County town of Athol and includes
# Bellingham, which is in Norfolk County. It gets its own jurisdiction,
# jurisdictions/county/da-middle-district.yaml, the same way congressional
# districts (which also don't align to any one place) get their own files
# rather than being folded into a municipality's record.
#
# classification 'executive' represents these as independently-elected
# administrative/constitutional offices rather than a legislative body --
# there is no county council or commissioners left to call a 'government'.
# Rebuilt under the new Jurisdiction/Organization/Post/Membership schema
# (docs/FRESH-START-ORGANIZATIONS.md); content transcribed from the pre-reset
# data (git history, commit 705e144) which used the old ocd-division-based
# jurisdiction model.
