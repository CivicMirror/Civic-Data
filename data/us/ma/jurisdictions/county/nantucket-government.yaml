# REAL JURISDICTION -- Nantucket County surviving elected offices
# (issue #63). No separately elected county commissioners: under MGL c.34 §4 the Nantucket select board serves ex officio as county commissioners, and under MGL c.35 §1 / c.54 §160 the town treasurer is the county treasurer.
# classification 'executive' represents these as independently-elected
# administrative/constitutional offices rather than a legislative body.
