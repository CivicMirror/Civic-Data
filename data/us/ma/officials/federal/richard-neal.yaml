# REAL OFFICIAL — unlike other sample officials in this repo (fictional
# placeholder people), this record names the real, currently-serving
# officeholder. Contact info is sourced from his official House.gov page,
# not fabricated; no direct email is listed because House offices route
# constituent contact through a web form rather than publishing an address.
#
# File is named by person, not by jurisdiction: 'roles' is where the office
# lives, so a redistricting or a run for a different office is a new entry
# appended here, not a new file. This is a REAL example of that, not a
# hypothetical: Neal represented old MA-02 1989-2013, then was redrawn
# into MA-01 after the post-2010-Census map and has held that seat since.
# See data/us/ma/jurisdictions/cd-2.yaml for the caveat that this repo's
# 'cd:2' id names the CURRENT MA-02 (a different district held by someone
# else today), not the pre-2013 district Neal actually represented — the
# role below is linked to it only because it's the sole id this repo has
# minted for "district 2."
