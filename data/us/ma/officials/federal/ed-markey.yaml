# REAL OFFICIAL — currently-serving Junior U.S. Senator from
# Massachusetts (Class II seat). Contact info sourced from his official
# senate.gov contact page; no direct email listed because Senate offices
# route constituent contact through a web form rather than publishing an
# address, matching the convention used for House officials in this repo
# (see richard-neal.yaml). Prior to the Senate, Markey served 37 years in
# the U.S. House (MA-07, then MA-05 after 2013 redistricting) — that
# House career is not represented in 'roles' below since it predates and
# is separate from this repo's current congressional-district records,
# and doing it justice would require the same kind of multi-district
# history Neal's record already documents; tracked as a gap, not silently
# resolved.
