  note: 'Town of Stoneham Select Board-Administrator Act, s.14 table of officers the registered voters ''continue to elect'' (art. 18, 5-1-2023): ''k. town clerk -- 3 yrs. -- 1''. Holder from the Annual Town Election results of April 1 2025 (Maria Sagarino, 4,615 votes). Term end DERIVED (not published): elected 2025-04-01 to the Act''s three-year term. Town Clerk is absent from the 2026 Annual Town Election results (which carried Select Board, School Committee, Housing Authority and Board of Assessors), consistent with that term. This supersedes the earlier note, which inferred the three-year length from the ballot cycle because no charter or bylaw figure had been found.'
