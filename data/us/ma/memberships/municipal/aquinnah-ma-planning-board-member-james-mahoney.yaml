# Resolving the Aquinnah Planning Board partial roster (2/5) surfaced in
# issue #46. Aquinnah's bylaws (Chapter XXII) constitute a 5-member board,
# elected to 3-year terms, one/two seats up each year. James Mahoney won an
# unexpired 1-year seat by write-in in 2023, then won the seat's regular
# 3-year term outright (uncontested, 33 votes) in the 2024 Annual Town
# Election -- current term through the 2027 Annual Town Election.
