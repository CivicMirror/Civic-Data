# Resolving the Aquinnah Planning Board partial roster (2/5) surfaced in
# issue #46. Aquinnah's bylaws (Chapter XXII) constitute a 5-member board,
# elected to 3-year terms, one/two seats up each year. Isaac Taylor won a
# 3-year seat in the 2022 election (116 votes) and was re-elected in 2025
# (80 votes, "Vote for not more than TWO" alongside Heidi Vanderhoop) --
# current term through the 2028 Annual Town Election.
