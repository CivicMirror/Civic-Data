  note: 'Town of Templeton Annual Town Election, May 20 2024 -- the document contains both the warrant and the tally, and the tally reads ''Town Clerk / Carol Harris 192 201 185 = 578'' against 2 write-ins and 103 blanks. She won the seat outright; seating by election is confirmed, not inferred. Term dates DERIVED (not published as dates) from Templeton Code ch. 22 as amended 5-19-2018 ATM art. 8: ''The term of the Town Clerk shall commence on July 1 of the year so elected and expire on June 30 in the year for which the term at issue was warned'' -- so the 3-year term warned in 2024 runs 2024-07-01 to 2027-06-30. Consistent with Town Clerk being absent from the May 18 2026 warrant.'
