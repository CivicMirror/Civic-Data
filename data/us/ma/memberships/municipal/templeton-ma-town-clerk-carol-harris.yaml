  note: 'Town of Templeton Code ch. 22 (Elections and Town Meetings), amended 5-19-2018 ATM art. 8: ''The term of the Town Clerk shall commence on July 1 of the year so elected and expire on June 30 in the year for which the term at issue was warned'', with the annual election on the third Monday of May. The May 20 2024 Annual Town Election warrant listed ''One Town Clerk .... 3 years'', and Town Clerk is absent from the May 18 2026 warrant, consistent with that term. Term end DERIVED (not published): 2024 election + 3-year term + the bylaw''s June 30 expiry = 2027-06-30. how_seated recorded as elected because the office is elective by bylaw; note the town publishes no tallies, so seating by election rather than by appointment to a vacancy is inferred, not confirmed.'
