  note: 'Office of Governor Tate Reeves, 2026-07-10: McCullouch appointed District Attorney for the Seventh Circuit Court District (Hinds County), filling the vacancy created by the resignation of Jody Owens on 2026-06-29; McCullouch had served as attorney pro tempore from 2026-07-01 by temporary appointment of Senior Circuit Judge Winston Kidd. Governor Reeves called a special election for 2026-11-03; the winner serves the remainder of the term. The SOS Judicial Branch and Legal Resources 2026 edition still prints Owens for this seat.'
