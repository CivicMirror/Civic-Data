  note: 'Issue #122: Councilman confirmed on MML Government Contacts roster. Issue #122: per Walter 2026-10-06, for MS towns with no usable official website the MML Government Contacts roster serves as the official source. Earlier hold: former official domain cityofrosedalems.com hijacked (Korean casino spam); MML leads only. Resolved 2026-10-06: SOS Blue Book Ch.12 lists the 2021-2025 board -- Mayor Tracy Robinson; Aldermen Rochelle Armstrong, Tracy Tucker-Norman, Douglas Kelly, Charles Turner. MML page (Government Contacts) shows the current post-June-2025 board: Mayor Jackson Coleman; Councilmen Johnathan Moore, Kierre Scott, Cordarius Walker, Lezedric Walker. Mayor double-sourced 2026-10-06: official city bid notices published Aug 14/21 2026 (Rosedale sidewalk & lighting) and Sept/Oct 2026 (municipal building improvement) are signed ''Mayor Jackson Coleman'' / ''Mayor W. Jackson Coleman, City of Rosedale'' -- same corroboration pattern as Columbia. Aldermen are MML-only. MML page title uses ''Councilman'' for this city. Flag: MML shows ''Next Election Date: 12/2029'' -- MS municipal generals are June; the month is likely an MML data-entry slip, roster itself corroborated current.'
