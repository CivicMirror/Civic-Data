  note: 'Issue #122: Alderman At Large confirmed. Town of Taylorsville Election Commission order signed 2025-04-01 dispensing with the 2025-06-03 general election and declaring elected without opposition: Len "Trey" Gibson III, Mayor; Mike Bryant, Alderman at Large; Annette M. Ford, Ward 1; James "Eugene" Page, Ward 2; Mark A. Jones, Ward 3; Rhonda "Cheryl" McCallum, Ward 4. The order fills the gap in the MML roster, which listed only four aldermen and omitted the at-large member; MML lists the Ward 4 alderwoman as "Cheryl McCallum".'
