  note: 'Issue #122: Mayor confirmed. Town of Braxton Election Commission order of 2025-02-05 dispensing with the 2025-06-03 general election: Michael Arinder elected Mayor without opposition, plus aldermen Travis Broome, James Graham, Kristen McMillan and Taylor Pettigrew, with the fifth alderman seat vacant for want of a qualified candidate. The current MML roster adds Samantha Easterling and Tate Yelverton and drops Pettigrew, so MML is the later roster and is used for the seated members; the order spells McMillan "Kristen".'
