name: Mississippi Levee District
identifiers: []
jurisdiction_id: ocd-jurisdiction/country:us/state:ms/levee_district:mississippi-levee/government
notes: 'Constitutional levee district (Miss. Const. art. 11, Sec. 229) covering Bolivar, Washington, Issaquena, and Sharkey Counties and parts of Humphreys and Warren Counties. Seven commissioners elected by county (two each from Bolivar and Washington, one each from Issaquena, Sharkey, and the district portion of Humphreys) to staggered four-year terms under art. 11, Sec. 231. Warren County has district territory but no seat.'
