  note: 'Board of Mississippi Levee Commissioners, Board of Commissioners (official board site, retrieved 2026-10-15): the board consists of 7 commissioners elected from their respective counties; the district contains Bolivar, Washington, Issaquena, and Sharkey Counties, along with parts of Humphreys and Warren Counties.'
  retrieved: '2026-10-15'
- url: http://billstatus.ls.state.ms.us/documents/2021/html/HC/HC0006IN.htm
  note: 'Mississippi Constitution of 1890, Article 11, Sections 229-231 (text as quoted in House Concurrent Resolution 6, 2021 Regular Session): levee commissioners are elected by the qualified electors of the respective counties for four-year terms.'
