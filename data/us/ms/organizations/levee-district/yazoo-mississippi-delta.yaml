notes: 'Constitutional levee district (Miss. Const. art. 11, Sec. 229) covering all or portions of DeSoto, Tunica, Coahoma, Quitman, Tallahatchie, Leflore, Sunflower, Humphreys, Holmes, and Yazoo Counties. Twelve commissioners elected by county (two each from Tunica and Coahoma, one from each other county) to four-year terms under art. 11, Sec. 231.'
