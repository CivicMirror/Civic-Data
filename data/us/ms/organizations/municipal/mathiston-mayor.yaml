  note: 'Issue #122: Mathiston Mayor, elected. Town of Mathiston Election Commission order signed 2025-02-27 dispensing with the 2025-06-03 general election and declaring elected without opposition: Jimmy Carden, Mayor; Alderman Tommy Brooks; Alderwoman Jamie Brooks; Aldermen Jeff Haney, Jeff Harrison and Gary Jeffcoats. The order designates no at-large seat, so all five are modelled as one pooled post; MML labels Tommy Brooks "Alderman At-Large". Resolves MML''s stale 06/2025 next-election date.'
