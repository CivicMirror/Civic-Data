notes: 'Special Municipal Separate school district board: five members. The board was appointed (appointments split between the Poplarville Board of Aldermen and the Pearl River County Board of Supervisors) until the Pearl River County Board of Supervisors adopted Poplarville School Board Election Districts effective July 1, 2026, converting all five seats to elected; first election November 3, 2026 (three seats in midterm years, two in presidential years). The county post names House Bill 1142, but the official 2026 HB 1142 is an unrelated bench-warrant bill, so that bill number is not cited. The current members were seated by appointment and are recorded as appointed holdovers (classification pass, issue #158).'
