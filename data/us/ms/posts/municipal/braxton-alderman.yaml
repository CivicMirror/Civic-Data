  note: 'Issue #122: elected alderman seats (5 seats; ward assignments not published, no ward numbers assigned). MML Government Contacts roster re-read live 2026-10-13. MML labels two members "Alderman At-Large", which the 2025 election order does not support, so all five seats are modelled as one pooled post.'
