  note: 'Issue #122: elected alderman seats (5 seats; ward assignments not published, no ward numbers assigned). Official Recapitulation of the Town of Vardaman Republican primary of 2025-04-01 -- Mayor: Timothy Cook 106 (55.5%), James M. Casey 43, Jacob Colby Skinner 42 -- bound with the town resolution of 2025-05-05 declaring the Board of Aldermen, no general election being held for want of opposition: Robert High, Danna Johnson-Moreno, Michael Shane Langford, Mary Winter and Peggy Jean Skinner. The resolution designates no at-large seat, so all five are modelled as one pooled post; MML labels Robert High "Alderman At-Large" and shortens three of the names.'
