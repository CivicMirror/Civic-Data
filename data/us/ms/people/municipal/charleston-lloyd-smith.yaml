  note: 'Issue #122: Commissioner confirmed. Official Recapitulation, City of Charleston Democratic primary of 2025-04-01 (filed by the SOS in the primary run-off folder). It establishes that Charleston is a commission form with five ward commissioners, not the mixed alderman/commissioner titles MML shows. Winners: Sedrick Smith Sr., Mayor, 490 unopposed; Ward 1 Gyrone Kenniel 45 of 85; Ward 2 Lloyd Smith 28 unopposed; Ward 3 Tawanda Smith-Shannon 65 of 119; Ward 4 Michael Webster 101 of 200; Ward 5 Cassandra Harris-Patterson 68 of 116 -- each a majority, so no run-off. All six match the current MML roster, confirming they were seated.'
