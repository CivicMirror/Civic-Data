name: Validate data

on:
  pull_request:
    paths:
      - "data/**"
      - "schemas/**"
      - "scripts/**"
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Validate schemas, references, and cross-validation
        run: python scripts/validate.py

      # Cross-validation findings are warnings, not failures — they may be
      # real-world events (resignations, appointments, recalls) rather than
      # data errors. This step surfaces them on the PR for volunteer review.
      - name: Generate validation report
        if: always() && github.event_name == 'pull_request'
        run: |
          python scripts/validate.py > report.txt || true
          echo '### Civic-Data validation report' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat report.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # Most volunteer reviewers won't dig into the Actions summary tab, so
      # the same report is also posted (and kept up to date) as a PR comment.
      - name: Post validation report as PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const MAX = 60000;
            let report = fs.readFileSync('report.txt', 'utf8');
            if (report.length > MAX) {
              report = report.slice(0, MAX) + '\n... (truncated — see the full output in the Actions run log)';
            }
            const marker = '<!-- civic-data-validation-report -->';
            const body = `${marker}\n### Civic-Data validation report\n\n\`\`\`\n${report}\n\`\`\``;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
